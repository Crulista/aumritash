<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/assets/dead.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Nothing here - Aumritash Maitra</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; background: #000; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; padding: 1.5rem; box-sizing: border-box; text-align: center; font-family: VT323, monospace; text-transform: uppercase; color: #f2f2f2; }
        .eye { width: 96px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; animation: blink 5s steps(1) infinite; }
        h1 { margin: 0; font-weight: normal; font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: 0.22em; color: #ff1a1a; }
        p { margin: 0; font-size: clamp(1.1rem, 3vw, 1.45rem); letter-spacing: 0.14em; color: #8a8480; }
        a { margin-top: 0.8rem; font-size: 1.5rem; letter-spacing: 0.12em; color: #f2f2f2; text-decoration: none; border: 2px solid #f2f2f2; padding: 0.35rem 1.2rem 0.25rem; }
        a:hover, a:focus-visible { background: #f2f2f2; color: #000; outline: none; }
        @keyframes blink { 0%, 92% { opacity: 1; } 94%, 97% { opacity: 0; } 100% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .eye { animation: none; } }
    </style>
</head>
<body>
    <img class="eye" src="/assets/favicon.svg" alt="" aria-hidden="true">
    <h1>Nothing is here</h1>
    <p>This path was never built.</p>
    <a href="/">&lt; Back to the start</a>
</body>
</html>
