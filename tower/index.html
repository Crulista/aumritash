<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>The Tower - Aumritash Maitra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/chapter.css">
    <script type="importmap">
        { "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        } }
    </script>
    <style>
        html, body { height: 100%; overflow: hidden; }
        body::before { display: none; }
        body { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; background: #000; }

        /* Same PS1-ish view as the flame: rendered small, blown up with hard pixels */
        #view { position: fixed; inset: 0; width: 100% !important; height: 100% !important; image-rendering: pixelated; image-rendering: crisp-edges; }

        [hidden] { display: none !important; }

        .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }

        .caption {
            position: fixed;
            top: 13%;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--pixel);
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            letter-spacing: 0.2em;
            color: rgba(232, 226, 218, 0.8);
            text-shadow: 0 2px 0 #000;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.6s;
            padding: 0 1rem;
        }

        .hint {
            position: fixed;
            bottom: 7%;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--pixel);
            font-size: 1.3rem;
            letter-spacing: 0.2em;
            color: var(--dim);
            text-shadow: 0 2px 0 #000;
            z-index: 5;
            pointer-events: none;
            animation: breathe 2.4s ease-in-out infinite;
        }
        @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

        /* The Watcher's words: big, red, typed out one letter at a time */
        .say {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 16%;
            text-align: center;
            font-family: var(--pixel);
            font-size: clamp(2.4rem, 8vw, 5rem);
            line-height: 1;
            letter-spacing: 0.16em;
            color: var(--red);
            text-shadow: 0 0 24px rgba(255, 26, 26, 0.6), 0 3px 0 #000;
            z-index: 6;
            pointer-events: none;
            padding: 0 1rem;
            overflow-wrap: anywhere;
        }

        /* Its name and health, once it has taken its true shape */
        .boss { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); width: min(760px, 88vw); z-index: 6; pointer-events: none; }
        .boss-name { font-family: var(--pixel); font-size: clamp(1.5rem, 4.5vw, 2.2rem); letter-spacing: 0.22em; color: var(--text); text-shadow: 0 2px 0 #000; margin-bottom: 0.3rem; }
        .boss-bar { height: 14px; border: 2px solid rgba(232, 226, 218, 0.75); background: rgba(0, 0, 0, 0.6); }
        .boss-bar i { display: block; height: 100%; width: 0; background: linear-gradient(to bottom, #ff3a2a, #a00d0d); }

        /* ── The fight ── */
        body.fighting .say { bottom: auto; top: 30%; font-size: clamp(1.6rem, 5vw, 3rem); }
        body.fighting .sound { bottom: auto; top: 1.35rem; left: 50%; transform: translateX(-50%); }
        body.fighting .hint { display: none; }

        /* The visitor's own bars, top left: health, stamina, and how many embers they have left to heal with */
        .me { position: fixed; left: 1.5rem; top: 4.4rem; width: min(300px, 46vw); z-index: 6; pointer-events: none; }
        .bar { height: 12px; border: 2px solid rgba(232, 226, 218, 0.75); background: rgba(0, 0, 0, 0.6); margin-bottom: 4px; }
        .bar i { display: block; height: 100%; width: 100%; }
        .bar.hp i { background: linear-gradient(to bottom, #d8402c, #8a1410); }
        .bar.st { height: 8px; width: 82%; }
        .bar.st i { background: linear-gradient(to bottom, #7fbf5a, #3f7a2c); }
        .me p { font-family: var(--pixel); font-size: 1.2rem; letter-spacing: 0.12em; color: #ffcf8a; text-shadow: 0 2px 0 #000; }

        .phase { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.7rem; padding: 1.5rem; text-align: center; background: rgba(0, 0, 0, 0.72); pointer-events: none; }
        .phase-title { font-family: var(--pixel); font-size: clamp(1.9rem, 6.5vw, 3.2rem); letter-spacing: 0.2em; color: #ffd9a0; text-shadow: 0 0 18px rgba(255, 150, 60, 0.45); }
        .phase-hint { color: var(--text); max-width: 30rem; line-height: 1.8; }
        .phase-hint b { font-family: var(--pixel); font-size: 1.15rem; letter-spacing: 0.1em; color: #ffcf8a; border: 1px solid rgba(255, 207, 138, 0.6); padding: 0 0.4rem; }

        /* Touch controls: a stick wherever the left thumb lands, three buttons under the right */
        .pad { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
        .stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid rgba(232, 226, 218, 0.35); border-radius: 50%; display: none; }
        .stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(232, 226, 218, 0.4); }
        .pad button { position: absolute; pointer-events: auto; font-family: var(--pixel); letter-spacing: 0.08em; color: var(--text); background: rgba(0, 0, 0, 0.55); border: 2px solid rgba(232, 226, 218, 0.7); border-radius: 50%; touch-action: none; }
        .pad button:active { background: var(--text); color: #000; }
        #btnAtk { right: 1.1rem; bottom: 1.6rem; width: 92px; height: 92px; font-size: 1.25rem; border-color: #ffcf8a; color: #ffe2b8; }
        #btnRoll { right: 7.4rem; bottom: 1.1rem; width: 72px; height: 72px; font-size: 1.1rem; }
        #btnHeal { right: 1.6rem; bottom: 8rem; width: 62px; height: 62px; font-size: 1.3rem; color: #ffcf8a; }
        #btnGuard { right: 6.6rem; bottom: 6.4rem; width: 72px; height: 72px; font-size: 1rem; }
        #btnGuard.held { background: var(--text); color: #000; }

        /* Cut-scenes play between black bars */
        .bars::before, .bars::after { content: ''; position: fixed; left: 0; right: 0; height: 11vh; background: #000; z-index: 4; transition: transform 0.7s; pointer-events: none; }
        .bars::before { top: 0; transform: translateY(-100%); }
        .bars::after { bottom: 0; transform: translateY(100%); }
        body.cine .bars::before, body.cine .bars::after { transform: none; }
        body.cine .me, body.cine .pad, body.cine .boss { opacity: 0; }
        .me, .boss { transition: opacity 0.5s; }

        .fell { position: fixed; left: 0; right: 0; top: 42%; z-index: 9; text-align: center; font-family: var(--pixel); font-size: clamp(3rem, 12vw, 6rem); letter-spacing: 0.25em; color: var(--red); text-shadow: 0 0 30px rgba(255, 26, 26, 0.6), 0 4px 0 #000; background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.8) 25%, rgba(0, 0, 0, 0.8) 75%, transparent); padding: 1rem 0; pointer-events: none; }

        .hurt { position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(255, 20, 20, 0.55)); }
        .hurt.on { animation: hurt 0.5s steps(5); }
        @keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }

        .rank { font-family: var(--pixel); font-size: clamp(5rem, 22vw, 9rem); line-height: 0.9; color: #ffd9a0; text-shadow: 0 0 30px rgba(255, 150, 60, 0.5); }

        .gate {
            position: fixed;
            inset: 0;
            z-index: 22;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.1rem;
            padding: 1.5rem;
            text-align: center;
            background: #000;
        }
        .gate-title { font-family: var(--pixel); font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: 0.2em; color: var(--red); text-shadow: 0 0 22px rgba(255, 26, 26, 0.5); }
        .gate-line { color: var(--dim); max-width: 26rem; }
        .gate .btn { font-size: 1.7rem; padding: 0.5rem 2rem 0.4rem; }
        .gate.end { background: rgba(0, 0, 0, 0.8); z-index: 12; gap: 0.7rem; }
        .gate.end .gate-title { color: #ffd9a0; text-shadow: none; font-size: clamp(1.5rem, 5vw, 2.2rem); }
        .gate.end .btn { font-size: 1.3rem; padding: 0.4rem 1.2rem 0.3rem; }

        .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--pixel); font-size: 1.6rem; letter-spacing: 0.3em; color: var(--dim); z-index: 23; background: #000; }

        .sound { position: fixed; left: 1.5rem; bottom: 1.8rem; z-index: 10; }
        .sound[aria-pressed="false"] { border-style: dashed; border-color: var(--red); color: var(--red); }

        .fade { position: fixed; inset: 0; background: #000; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.6s steps(5); }
        .fade.on { opacity: 1; }

        @media (max-width: 760px) {
            .caption { top: 11%; }
            .hint { font-size: 1.05rem; bottom: 11%; }
            .sound { left: 1rem; bottom: 1rem; }
            .boss { bottom: 12%; }
            .say { bottom: 21%; }
            /* On a phone the boss bar goes up top too, out from under the thumbs */
            body.fighting .boss { bottom: auto; top: 8.2rem; }
            body.fighting .boss-name { font-size: 1.3rem; margin-bottom: 0.15rem; }
            body.fighting .sound { left: auto; right: 1rem; top: 4.3rem; transform: none; font-size: 0.9rem; padding: 0.15rem 0.5rem 0.1rem; }
            .me { left: 1rem; top: 4.2rem; }
        }
    </style>
</head>
<body>
    <script src="../assets/track.js"></script>
    <canvas id="view" aria-hidden="true"></canvas>

    <div class="loading" id="loading">LOADING…</div>

    <header class="top">
        <a href="../more/" class="btn small">&lt; The flame</a>
        <button class="btn small" id="skip" hidden>Skip &gt;</button>
    </header>

    <!-- A click is needed before sound can play, so the climb starts from a button -->
    <section class="gate" id="start" hidden>
        <p class="gate-title">THE SEAL IS WEAK</p>
        <p class="gate-line">You have seen everything there was to see. Something at the top of the tower knows it.</p>
        <button class="btn" id="climb">Approach</button>
    </section>

    <p class="caption" id="caption" aria-live="polite"></p>
    <p class="hint" id="hint" hidden></p>
    <p class="say" id="say" aria-live="polite"></p>

    <div class="boss" id="boss" hidden>
        <p class="boss-name" id="bossName"></p>
        <div class="boss-bar"><i id="bossFill"></i></div>
    </div>

    <div class="me" id="me" hidden>
        <div class="bar hp"><i id="meHp"></i></div>
        <div class="bar st"><i id="meSt"></i></div>
        <p id="meHeals"></p>
    </div>
    <div class="phase" id="phase" hidden>
        <p class="phase-title" id="phaseTitle"></p>
        <p class="phase-hint" id="phaseHint"></p>
    </div>
    <div class="pad" id="pad" hidden>
        <div class="stick" id="stick"><i id="knob"></i></div>
        <button type="button" id="btnHeal" aria-label="Heal">✚</button>
        <button type="button" id="btnGuard">GUARD</button>
        <button type="button" id="btnRoll">ROLL</button>
        <button type="button" id="btnAtk">HIT</button>
    </div>
    <p class="fell" id="fell" hidden>YOU FELL</p>
    <div class="hurt" id="hurt"></div>

    <section class="gate end" id="end" hidden>
        <p class="gate-title" id="endTitle">THE WATCHER FALLS</p>
        <p class="rank" id="rank"></p>
        <p class="gate-line" id="endLine"></p>
        <p class="gate-line">What you do with it comes next.</p>
        <button class="btn" id="again">Play again</button>
        <a class="btn" href="../more/">&lt; Back to the flame</a>
    </section>

    <button class="btn small sound" id="sound" hidden aria-pressed="true">♪ Sound on</button>

    <div class="bars"></div>
    <div class="fade on" id="fade"></div>

    <script type="module">
    import * as THREE from 'three';
    import { CLASSES, loadCharacter, footfalls } from '../assets/characters.js';
    import { createSfx } from '../assets/sfx.js';
    const sfx = createSfx();

    const $ = id => document.getElementById(id);
    const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
    const track = (...a) => window.track && window.track(...a);
    const touch = matchMedia('(hover: none)').matches;
    const mix = (a, b, t) => a + (b - a) * t;
    const clamp01 = x => Math.min(1, Math.max(0, x));
    const ease = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
    // 0 → 1 as t goes from a to b, eased
    const ramp = (t, a, b) => ease((t - a) / (b - a));

    // The tower only opens for someone who has walked all three paths (?preview is for looking at it early)
    let seen = [];
    try { seen = JSON.parse(store.get('aumritash-seen') || '[]'); } catch (e) {}
    const preview = /[?&](preview|debug)\b/.test(location.search);
    if (!preview && !['work', 'games', 'stories'].every(p => seen.includes(p))) location.replace('../more/');

    const heroCls = CLASSES.find(c => c.id === store.get('aumritash-origin')) || CLASSES[0];
    const who = (store.get('aumritash-name') || heroCls.name).toUpperCase();
    const BOSS = 'THE WATCHER';     // what the visitor's name turns into

    // ── Renderer ──
    const canvas = $('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'low-power' });
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.localClippingEnabled = true;
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 160);
    function resize() {
        const scale = Math.max(2, innerHeight / 300);
        renderer.setSize(Math.ceil(innerWidth / scale), Math.ceil(innerHeight / scale), false);
        camera.aspect = innerWidth / innerHeight;
        // Phones are tall and narrow: widen the lens so the scene isn't cropped to a sliver
        camera.fov = camera.aspect < 0.8 ? 72 : 55;
        camera.updateProjectionMatrix();
    }
    resize();
    addEventListener('resize', resize);

    // ── Procedural textures, as at the flame ──
    function noiseTexture(base, spread, size = 64, blocks = false) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        const img = g.createImageData(size, size);
        for (let i = 0; i < size * size; i++) {
            const n = (Math.random() - 0.5) * spread;
            img.data[i * 4] = base[0] + n; img.data[i * 4 + 1] = base[1] + n * 0.9; img.data[i * 4 + 2] = base[2] + n * 0.8; img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        if (blocks) {
            g.strokeStyle = 'rgba(0,0,0,0.45)';
            g.lineWidth = 1;
            for (let y = 0; y < size; y += 16) {
                g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(size, y + 0.5); g.stroke();
                const off = (y / 16) % 2 ? 0 : 16;
                for (let x = off; x < size; x += 32) { g.beginPath(); g.moveTo(x + 0.5, y); g.lineTo(x + 0.5, y + 16); g.stroke(); }
            }
        }
        const t = new THREE.CanvasTexture(c);
        t.magFilter = THREE.NearestFilter;
        t.minFilter = THREE.NearestMipmapNearestFilter;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
    }
    function glowTexture() {
        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const g = c.getContext('2d');
        const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
        grd.addColorStop(0, 'rgba(255,255,255,1)');
        grd.addColorStop(0.4, 'rgba(255,255,255,0.6)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, 32, 32);
        return new THREE.CanvasTexture(c);
    }
    // The seal on the door: a dashed ring around three question marks
    function sealTexture() {
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const g = c.getContext('2d');
        g.strokeStyle = '#fff';
        g.lineWidth = 2;
        g.setLineDash([5, 4]);
        g.beginPath(); g.arc(32, 32, 27, 0, Math.PI * 2); g.stroke();
        g.setLineDash([]);
        g.fillStyle = '#fff';
        g.font = 'bold 22px monospace';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('???', 32, 34);
        const t = new THREE.CanvasTexture(c);
        t.magFilter = THREE.NearestFilter;
        return t;
    }
    const GLOW = glowTexture();
    const stoneTex = noiseTexture([92, 84, 76], 40, 64, true);
    const roughTex = noiseTexture([70, 62, 56], 50, 64);
    const mat = (tex, rx = 1, ry = rx, color = '#ffffff', side = THREE.FrontSide) => {
        const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry);
        return new THREE.MeshLambertMaterial({ map: t, color, side });
    };
    const STONE = mat(stoneTex), ROUGH = mat(roughTex), DARK = new THREE.MeshBasicMaterial({ color: '#020203' });
    const VOID = new THREE.MeshBasicMaterial({ color: '#030204', fog: false });
    const eyeMat = new THREE.SpriteMaterial({ map: GLOW, color: '#ff2020', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });

    const world = new THREE.Scene();
    world.background = new THREE.Color('#050409');
    world.fog = new THREE.FogExp2('#0d0a12', 0.05);
    world.add(new THREE.HemisphereLight('#6a7a9a', '#1f1612', 0.9));
    const moon = new THREE.DirectionalLight('#9aaed4', 0.8);
    moon.position.set(-12, 20, 10);
    world.add(moon);
    const heroLight = new THREE.PointLight('#a8bce0', 2.4, 8, 1.6);
    world.add(heroLight);

    // A pair of red eyes; `open` 0..1 is how far the lids are apart
    function eyePair(size = 1) {
        const g = new THREE.Group();
        for (const s of [-1, 1]) {
            const sp = new THREE.Sprite(eyeMat.clone());
            sp.scale.set(0.22, 0.12, 1);
            sp.position.x = s * 0.17;
            g.add(sp);
        }
        g.scale.setScalar(size);
        setOpen(g, 0);
        return g;
    }
    function setOpen(g, open) {
        g.userData.open = open;
        g.visible = open > 0.01;
        g.children.forEach(s => { s.scale.y = 0.12 * Math.max(0.05, open); });
    }

    // Three sets, far apart in the same world; the camera cuts between them
    const SETS = { door: new THREE.Group(), stair: new THREE.Group(), top: new THREE.Group() };
    SETS.stair.position.x = 200;
    SETS.top.position.x = 400;
    Object.values(SETS).forEach(s => world.add(s));
    const rand = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

    // ═════════════ Set 1: the sealed door at the foot of the tower ═════════════
    const door = {};
    {
        const S = SETS.door;
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), mat(roughTex, 26, 26, '#6a5f58'));
        ground.rotation.x = -Math.PI / 2;
        S.add(ground);
        // The tower's curved foot, with a dark doorway cut into it
        const wall = new THREE.Mesh(new THREE.CylinderGeometry(7, 7.6, 30, 20, 1, true), mat(stoneTex, 12, 10));
        wall.position.set(0, 15, -8.3);
        S.add(wall);
        const frame = new THREE.Mesh(new THREE.BoxGeometry(3.4, 4.6, 0.9), ROUGH);
        frame.position.set(0, 2.3, -0.35);
        S.add(frame);
        const hole = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 3.8), DARK);
        hole.position.set(0, 1.9, 0.11);
        S.add(hole);
        door.slabs = [-1, 1].map(s => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.8, 0.3), mat(stoneTex, 0.6, 1.9, '#b0a59c'));
            m.userData.side = s;
            S.add(m);
            return m;
        });
        door.seal = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.9), new THREE.MeshBasicMaterial({ map: sealTexture(), color: '#ff2020', transparent: true, depthWrite: false, fog: false }));
        door.seal.position.set(0, 2.1, 0.45);
        S.add(door.seal);
        door.light = new THREE.PointLight('#ff3020', 0, 9, 1.5);
        door.light.position.set(0, 2.1, 1.4);
        S.add(door.light);
        // Dust shaken loose when the slabs move
        const N = 60, pos = new Float32Array(N * 3);
        door.dustGeo = new THREE.BufferGeometry();
        door.dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        door.dust = Array.from({ length: N }, () => ({ x: (rand() - 0.5) * 2.6, y: 3.8 * rand(), z: 0.5 + rand() * 0.6, v: 0.6 + rand() * 1.4, d: (rand() - 0.5) * 0.8 }));
        door.dustPts = new THREE.Points(door.dustGeo, new THREE.PointsMaterial({ color: '#b8a898', size: 0.09, transparent: true, opacity: 0, depthWrite: false }));
        S.add(door.dustPts);
    }

    // ═════════════ Set 2: the stair that winds up inside ═════════════
    const RISE = 0.9, STAIR_R = 2.6;      // metres climbed per radian, and how far the steps sit from the middle
    const SHELL_R = 3.5, BAND = 0.8;      // the outer wall is built in rings this tall, so real gaps can be left in it
    const TURN = 9.4;
    const stairAt = (a, out = new THREE.Vector3()) => out.set(Math.cos(a) * STAIR_R, a * RISE, Math.sin(a) * STAIR_R);
    const stair = { eyes: [] };
    {
        const S = SETS.stair;
        for (let a = -0.4; a < TURN; a += 0.2) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.2, 0.62), a * 5 % 2 < 1 ? STONE : ROUGH);
            stairAt(a, step.position);
            step.position.y -= 0.1;
            step.rotation.y = -a;
            S.add(step);
        }
        const H = TURN * RISE + 6, Y0 = -2;
        const core = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.75, H, 12), mat(stoneTex, 6, 8, '#8a8078'));
        core.position.y = H / 2 + Y0;
        S.add(core);

        // Where the gaps go: beside the stair, a little above head height, two rings tall
        const TAU = Math.PI * 2, GAP_W = 0.27;      // radians, about 0.95 m of wall
        const gaps = [];
        for (let a = 1.3; a < TURN - 0.6; a += 0.6 + rand() * 0.35) {
            const band = Math.round((a * RISE + 1.0 - Y0) / BAND);
            gaps.push({ a, ang: ((a % TAU) + TAU) % TAU, band });
        }
        // The wall itself, ring by ring, leaving each gap truly open to the dark outside
        const bands = Math.ceil(H / BAND);
        for (let b = 0; b < bands; b++) {
            const cuts = gaps.filter(g => b === g.band || b === g.band + 1).map(g => [g.ang - GAP_W / 2, g.ang + GAP_W / 2]).sort((p, q) => p[0] - q[0]);
            const arcs = [];
            let from = 0;
            for (const [c0, c1] of cuts) { if (c0 > from) arcs.push([from, c0]); from = Math.max(from, c1); }
            if (from < TAU) arcs.push([from, TAU]);
            for (const [a0, a1] of arcs) {
                const len = a1 - a0;
                // three's cylinder measures its angle from +z towards +x; the stair measures from +x towards +z
                const geo = new THREE.CylinderGeometry(SHELL_R, SHELL_R, BAND, Math.max(2, Math.ceil(len / 0.4)), 1, true, Math.PI / 2 - a1, len);
                const m = new THREE.Mesh(geo, mat(stoneTex, len / TAU * 10, 0.5, b % 2 ? '#9a8f86' : '#90857c', THREE.BackSide));
                m.material.map.offset.x = a0 / TAU * 10;
                m.position.y = Y0 + b * BAND + BAND / 2;
                S.add(m);
            }
        }
        for (const g of gaps) {
            const y0 = Y0 + g.band * BAND, yc = y0 + BAND, c = Math.cos(g.a), s = Math.sin(g.a);
            // A stone surround gives the gap some depth
            for (const [dy, dw, w, h] of [[BAND + 0.07, 0, 1.25, 0.16], [-BAND - 0.07, 0, 1.25, 0.16], [0, 0.56, 0.16, BAND * 2], [0, -0.56, 0.16, BAND * 2]]) {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.3), ROUGH);
                m.position.set(c * (SHELL_R + 0.1) - s * dw, yc + dy, s * (SHELL_R + 0.1) + c * dw);
                m.rotation.y = Math.PI / 2 - g.a;
                S.add(m);
            }
            // Something stands outside each one, looking in
            const pair = eyePair(1);
            pair.userData.a = g.a;
            pair.userData.gap = new THREE.Vector3(c * SHELL_R, yc + 0.15, s * SHELL_R);
            S.add(pair);
            stair.eyes.push(pair);
        }
    }

    // ═════════════ Set 3: the top of the tower ═════════════
    const top = { void: [], spikes: [] };
    // Mostly chest and back, some on the shoulders and arms; none below the waist
    const EYE_BONES = ['spine_01', 'spine_02', 'spine_02', 'spine_03', 'spine_03', 'spine_03', 'neck_01', 'clavicle_l', 'clavicle_r', 'upperarm_l', 'upperarm_r', 'lowerarm_l', 'lowerarm_r'];
    const WATCH = new THREE.Vector3(0, 0, -4.2);      // where the Watcher stands, across the cold brazier
    const BODY = 2.3, BEAST = 3.5;                    // how tall it is when it first stands up, and after it changes
    const GRIP = 1.05;
    {
        const S = SETS.top;
        const floor = new THREE.Mesh(new THREE.CircleGeometry(13, 28), mat(stoneTex, 10, 10, '#9a8f86'));
        floor.rotation.x = -Math.PI / 2;
        S.add(floor);
        for (let i = 0; i < 36; i++) {
            if ([6, 7, 20, 29].includes(i)) continue;                // the wall has teeth missing
            const a = (i / 36) * Math.PI * 2;
            const m = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.9 + rand() * 0.7, 0.7), i % 2 ? STONE : ROUGH);
            m.position.set(Math.cos(a) * 12.7, m.geometry.parameters.height / 2, Math.sin(a) * 12.7);
            m.rotation.y = -a + Math.PI / 2;

        }
        const dais = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.3, 0.3, 10), ROUGH);
        dais.position.y = 0.15;
        S.add(dais);
        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.35, 0.5, 8), new THREE.MeshLambertMaterial({ color: '#2a2422' }));
        bowl.position.y = 0.55;
        S.add(bowl);
        // Eyes out in the open dark past the wall, well above its top, shut until the visitor walks out
        for (let i = 0; i < 44; i++) {
            const ang = -Math.PI / 2 + (rand() - 0.5) * Math.PI * 1.5;
            const r = 18 + rand() * 12;
            const pair = eyePair(r / 8 * (0.8 + rand() * 0.5));
            pair.position.set(Math.cos(ang) * r, 2.6 + rand() * 9, Math.sin(ang) * r);
            const u = pair.userData;
            u.from = pair.position.clone();
            u.size = pair.scale.x;
            u.openP = 0.12 + rand() * 0.8;         // how far across the roof the visitor is when this pair opens
            u.goAt = 0.6 + rand() * 3.2;
            u.shutAt = 6.7 + rand() * 1.5;
            u.wakeAt = 14.2 + rand() * 2.6;        // when it opens again on the changed body
            // Where on the body this pair ends up: a bone of the upper body, and a small offset from it (in the body's own units)
            u.bone = EYE_BONES[Math.floor(rand() * EYE_BONES.length)];
            u.on = new THREE.Vector3((rand() - 0.5) * 0.24, (rand() - 0.5) * 0.16, 0.13 + rand() * 0.05);
            u.via = new THREE.Vector3((rand() - 0.5) * 6, 4 + rand() * 4, 0);
            S.add(pair);
            top.void.push(pair);
        }
        // The two that stay: the Watcher's own
        top.gaze = eyePair(2);
        S.add(top.gaze);
        top.glow = new THREE.PointLight('#ff2a1a', 0, 14, 1.4);
        S.add(top.glow);
        // A dull red haze behind it, so the hollow shape reads against a black sky
        top.aura = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: '#5a0a0c', transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
        S.add(top.aura);
        // Reveals the Watcher's body from the ground up
        top.clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);

        // What it becomes: a fan of long spines behind its shoulders...
        top.crown = new THREE.Group();
        for (let i = 0; i < 9; i++) {
            const a = (i / 8 - 0.5) * 2.5;                       // fanned from one shoulder, over the head, to the other
            const len = 0.5 + 0.34 * Math.cos(a * 0.8) + (i % 2) * 0.16;
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.035, len, 4), VOID);
            spike.geometry.translate(0, len / 2, 0);
            spike.rotation.z = -a;
            top.crown.add(spike);
        }
        S.add(top.crown);
        // ...and a scythe, called up out of nothing. GRIP is how far up the shaft its hand closes.
        top.scythe = new THREE.Group();
        const WOOD = new THREE.MeshLambertMaterial({ color: '#4a3c38', fog: false }), STEEL = new THREE.MeshLambertMaterial({ color: '#8d8890', fog: false, side: THREE.DoubleSide });
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.024, 2.3, 5), WOOD);
        shaft.position.y = 1.15;
        top.scythe.add(shaft);
        // Blade outline: from the top of the shaft it runs out sideways, then hooks down to a point
        const outline = new THREE.Shape();
        outline.moveTo(0.05, 0.16);
        outline.quadraticCurveTo(-0.75, 0.3, -1.3, -0.5);
        outline.quadraticCurveTo(-0.72, 0.0, 0.05, -0.06);
        outline.closePath();
        const blade = new THREE.Mesh(new THREE.ExtrudeGeometry(outline, { depth: 0.02, bevelEnabled: false }), STEEL);
        blade.position.set(0, 2.2, -0.01);
        top.scythe.add(blade);
        // The cutting edge glows
        const cut = new THREE.QuadraticBezierCurve3(new THREE.Vector3(-1.3, -0.5, 0), new THREE.Vector3(-0.72, 0, 0), new THREE.Vector3(0.05, -0.06, 0));
        const edge = new THREE.Mesh(new THREE.TubeGeometry(cut, 12, 0.014, 4), new THREE.MeshBasicMaterial({ color: '#ff2a1a', fog: false }));
        edge.position.set(0, 2.2, 0);
        top.scythe.add(edge);
        top.edge = edge;
        // Leaning a little, the way a tall thing is carried
        top.lean = new THREE.Vector3(0.16, 1, 0.1).normalize();
        top.scythe.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), top.lean);
        top.scythe.visible = false;
        S.add(top.scythe);
    }

    // ── Cast ──
    let hero = null, watcher = null, heroSteps = null;
    const bones = {};
    async function loadCast() {
        hero = await loadCharacter(heroCls);
        world.add(hero.root);
        heroSteps = footfalls(hero, () => sfx.step());
        // The Watcher wears the visitor's own shape, hollowed out: the same figure, taller, with nothing in it but the dark
        watcher = await loadCharacter(heroCls);
        const hollow = new THREE.MeshLambertMaterial({ color: '#191013', clippingPlanes: [top.clip], fog: false });
        watcher.root.traverse(o => {
            if (o.isMesh) o.material = hollow;
            if (o.isBone && /^(Head|neck_01|spine_0[123]|clavicle_[lr]|hand_[lr]|upperarm_[lr]|lowerarm_[lr])$/.test(o.name)) bones[o.name] = o;
        });
        watcher.root.position.copy(WATCH);
        SETS.top.add(watcher.root);
    }

    // ── Words on screen ──
    function caption(text) {
        const el = $('caption');
        if (el.dataset.text === text) return;
        el.dataset.text = text;
        el.style.opacity = 0;
        setTimeout(() => { if (el.dataset.text !== text) return; el.textContent = text; el.style.opacity = text ? 1 : 0; }, el.textContent ? 350 : 0);
    }
    function hint(on) {
        $('hint').textContent = touch ? 'HOLD THE SCREEN TO WALK' : 'HOLD CLICK · W · ↑ TO WALK';
        $('hint').hidden = !on;
    }
    function fadeTo(on) { $('fade').classList.toggle('on', on); }
    // The visitor's name coming apart and settling into another: `k` 0..1 is how far along it is
    const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&?/\\<>*';
    function jumble(from, to, k) {
        const len = Math.round(mix(from.length, to.length, k));
        let out = '';
        for (let i = 0; i < len; i++) {
            const locked = i / to.length < k * 1.25 - 0.25;          // letters settle left to right
            out += locked ? (to[i] || '') : k < 0.08 ? (from[i] || '') : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        }
        return out;
    }

    // ── Walking: the visitor moves only while they hold ──
    const held = new Set();
    const isUI = t => t.closest && t.closest('button, a, .gate');
    addEventListener('pointerdown', e => { if (!isUI(e.target)) held.add('pointer'); });
    addEventListener('pointerup', () => held.delete('pointer'));
    addEventListener('pointercancel', () => held.delete('pointer'));
    addEventListener('blur', () => held.clear());
    addEventListener('contextmenu', e => { if (!isUI(e.target)) e.preventDefault(); });
    addEventListener('keydown', e => { if (['w', 'W', 'ArrowUp', ' '].includes(e.key)) { held.add(e.key); e.preventDefault(); } });
    addEventListener('keyup', e => held.delete(e.key));
    const SPEED = 1.7;
    let canWalk = false, walking = false;
    let timeWarp = 1;           // below 1 for a beat of slow motion (a parry landing)
    let armReach = 1;           // how far the Watcher's arms are stretched; reapplied every frame after the animation
    // Sets whether the visitor may walk right now, and returns true on frames where they are
    function walk(allowed) {
        if (allowed !== canWalk) { canWalk = allowed; hint(allowed); }
        const now = allowed && held.size > 0;
        if (now !== walking) { walking = now; hero.play(now ? heroCls.walk : heroCls.walkIdle, { fade: 0.25 }); }
        return now;
    }

    // ═════════════ The shots ═════════════
    // Each shot is a small state machine: enter() sets it up, update(dt) runs it and returns true when it is over.
    // Shots aim the camera by setting camTo and look; the frame loop eases towards them.
    const camTo = new THREE.Vector3(), look = new THREE.Vector3(), lookNow = new THREE.Vector3(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
    let fired = new Set(), clockT = 0, camSnap = true;
    const once = (key, cond) => { if (cond && !fired.has(key)) { fired.add(key); return true; } return false; };

    const SHOTS = [
        {   // 1. Walk up to the sealed door; it breaks; walk in
            name: 'seal',
            enter() {
                this.z = 11; this.t = 0; this.phase = 'approach';
                hero.root.position.set(0, 0, this.z);
                hero.root.rotation.y = Math.PI;
                door.slabs.forEach(m => m.position.set(m.userData.side * 0.6, 1.9, 0.28));
                door.seal.material.opacity = 1;
                door.seal.material.color.set('#ff2020');
                door.seal.scale.setScalar(1);
                door.dustPts.material.opacity = 0;
                world.fog.density = 0.05;
                heroLight.intensity = 2.4;
                sfx.setWind(true);
                caption('The way up was sealed.');
            },
            update(dt) {
                let shake = 0;
                door.light.intensity = 1.2 + Math.sin(clockT * 5) * 0.4;
                door.seal.scale.setScalar(1 + Math.sin(clockT * 5) * 0.02);
                if (this.phase === 'approach') {
                    if (walk(true)) this.z -= SPEED * dt;
                    if (this.z <= 5.4) { this.phase = 'break'; this.t = 0; walk(false); document.body.classList.add('cine'); }
                } else if (this.phase === 'break') {
                    const t = this.t += dt;
                    // The seal flares white and is gone
                    const flare = ramp(t, 0.3, 1.5);
                    door.seal.material.color.setRGB(1, 0.13 + flare * 0.87, 0.13 + flare * 0.87);
                    door.seal.scale.setScalar(1 + flare * 0.25);
                    door.seal.material.opacity = t < 1.5 ? 1 : Math.max(0, 1 - (t - 1.5) * 4);
                    door.light.intensity = 1.2 + flare * 14 - ramp(t, 1.5, 2.1) * 15.2;
                    if (once('thud', t > 1.5)) { sfx.thud(); caption('Not any more.'); }
                    if (once('rumble', t > 1.8)) sfx.rumble(3.2);
                    // The slabs grind apart
                    const open = ramp(t, 1.9, 4.9);
                    shake = t > 1.8 && t < 5 ? Math.sin(t * 60) * 0.012 : 0;
                    door.slabs.forEach(m => { m.position.x = m.userData.side * (0.6 + open * 1.25) + shake; });
                    door.dustPts.material.opacity = Math.min(ramp(t, 1.8, 2.3), 1 - ramp(t, 4.7, 6.7)) * 0.7;
                    const p = door.dustGeo.attributes.position.array;
                    door.dust.forEach((d, i) => { const life = (Math.max(0, t - 1.8) * d.v * 0.35 + i * 0.137) % 1; p[i * 3] = d.x + d.d * life; p[i * 3 + 1] = d.y * (1 - life); p[i * 3 + 2] = d.z + life * 0.6; });
                    door.dustGeo.attributes.position.needsUpdate = true;
                    if (t > 5.2) { this.phase = 'enter'; caption(''); document.body.classList.remove('cine'); }
                } else {
                    door.light.intensity = 0;
                    door.dustPts.material.opacity = Math.max(0, door.dustPts.material.opacity - dt * 0.4);
                    if (walk(true)) this.z -= SPEED * dt;
                    if (this.z <= -1.3) { walk(false); return true; }
                }
                hero.root.position.z = this.z;
                camTo.set(1.3, 2.3, this.z + 5.2 + shake * 3);
                look.set(0, 2, Math.min(0, this.z - 6));
            }
        },
        {   // 2. The climb: gaps in the wall, and something outside each one
            name: 'climb',
            enter() {
                this.a = 0.5;
                world.fog.density = 0.06;
                heroLight.intensity = 3.4;
                caption('');
            },
            update(dt) {
                if (walk(true)) this.a += SPEED / Math.hypot(STAIR_R, RISE) * dt;
                const a = this.a, O = SETS.stair.position;
                stairAt(a, hero.root.position).add(O);
                hero.root.rotation.y = -a;
                if (once('c1', a > 1.6)) caption('Every gap in the wall is watching.');
                if (once('c2', a > 6)) caption('');
                // Each pair stands just outside its gap, on the line from the visitor through it, so it is only ever
                // seen through the opening, and it is always looking at them
                tmp.copy(hero.root.position).sub(O).setY(hero.root.position.y + 1.5);
                for (const e of stair.eyes) {
                    const ahead = e.userData.a - a;
                    const want = ahead < 2.6 && ahead > -1.5 ? 1 : 0;
                    if (want && e.userData.open < 0.02) sfx.eye(0.6, ahead > 0 ? 0.5 : -0.5);
                    setOpen(e, mix(e.userData.open, want, 1 - Math.pow(0.002, dt)));
                    tmp2.copy(e.userData.gap).sub(tmp).normalize();
                    e.position.copy(e.userData.gap).addScaledVector(tmp2, 0.55);
                    e.lookAt(tmp.x + O.x, tmp.y, tmp.z);
                }
                // The camera trails a few steps below, looking up the stair
                stairAt(a - 1.35, tmp2);
                camTo.set(tmp2.x * 1.06 + O.x, tmp2.y + 2.5, tmp2.z * 1.06);
                stairAt(a + 0.5, look).add(O);
                look.y += 1.2;
                if (a >= 7.8) { walk(false); return true; }
            }
        },
        {   // 3. The roof: walk out, the eyes gather into the Watcher, and it changes
            name: 'watcher', END: 20.5,
            enter() {
                this.z = 11; this.t = 0; this.phase = 'walk';
                const C = SETS.top.position;
                hero.root.position.set(C.x, 0, this.z);
                hero.root.rotation.y = Math.PI;
                top.void.forEach(e => { e.position.copy(e.userData.from); e.scale.setScalar(e.userData.size); e.userData.openedAt = null; setOpen(e, 0); });
                setOpen(top.gaze, 0);
                top.clip.constant = 0;
                top.glow.intensity = 0;
                top.aura.material.opacity = 0;
                top.scythe.visible = false;
                top.crown.scale.setScalar(0.001);
                armReach = 1;
                document.body.classList.remove('fighting');
                watcher.root.scale.setScalar(BODY);
                watcher.stopAll();
                watcher.play('Idle_Loop', { fade: 0 });
                document.body.classList.remove('cine');
                watcher.mixer.timeScale = 0.45;
                world.fog.density = 0.026;
                heroLight.intensity = 3;
                $('say').textContent = '';
                $('boss').hidden = true;
                $('bossFill').style.width = '0';
                caption('The top of the tower.');
            },
            update(dt) {
                const C = SETS.top.position;
                if (this.phase === 'walk') {
                    if (walk(true)) this.z -= SPEED * dt;
                    hero.root.position.z = this.z;
                    if (once('c2', this.z < 7)) caption('Something has been waiting.');
                    if (this.z <= 3.6) { this.phase = 'scene'; walk(false); caption(''); sfx.whoosh(); sfx.setDrone(true); document.body.classList.add('cine'); }
                }
                const p = clamp01((11 - this.z) / 7.4);
                const t = this.phase === 'scene' ? (this.t += dt) : 0;

                // How big it is: it stands up at one size, then swells into something else
                const beast = ramp(t, 13.4, 17);
                const size = mix(BODY, BEAST, beast);
                watcher.root.scale.setScalar(size);
                watcher.root.rotation.y = Math.sin(clockT * 0.5) * 0.06;

                for (const e of top.void) {
                    const u = e.userData;
                    // They open out in the dark as the visitor crosses the roof...
                    if (u.openedAt === null && p >= u.openP) { u.openedAt = clockT; sfx.eye(0.4 + rand() * 0.4, e.position.x < 0 ? -0.7 : 0.7); }
                    let open = u.openedAt === null ? 0 : Math.min(1, (clockT - u.openedAt) * 3);
                    // ...then leave it, arcing in over the wall to pile into one shape
                    const k = ease((t - u.goAt) / 1.7);
                    if (t > 0) {
                        if (u.openedAt === null) u.openedAt = clockT;
                        bones[u.bone].getWorldPosition(tmp).sub(C).addScaledVector(u.on, size);
                        const a = 1 - k, tx = tmp.x, ty = tmp.y, tz = tmp.z;
                        const vx = (u.from.x + tx) / 2 + u.via.x, vy = (u.from.y + ty) / 2 + u.via.y, vz = (u.from.z + tz) / 2;
                        e.position.set(a * a * u.from.x + 2 * a * k * vx + k * k * tx, a * a * u.from.y + 2 * a * k * vy + k * k * ty, a * a * u.from.z + 2 * a * k * vz + k * k * tz);
                        e.scale.setScalar(mix(u.size, 0.2 * size, k));
                    }
                    // One by one they close, until only two are left; when it changes, they all open again
                    if (t > u.shutAt) open = Math.max(0, 1 - (t - u.shutAt) * 5);
                    if (t > u.wakeAt) open = Math.min(1, (t - u.wakeAt) * 4) * (0.8 + 0.2 * Math.sin(clockT * 7 + u.goAt * 9));
                    e.quaternion.copy(camera.quaternion);
                    setOpen(e, open);
                }
                // The body rises out of the floor as they arrive
                top.clip.constant = t > 13 ? 99 : ramp(t, 2, 6.5) * (BODY * 1.95);
                if (once('rise', t > 2)) sfx.rumble(4);
                top.aura.scale.set(4.4 * size, 4.2 * size, 1);
                top.aura.position.set(WATCH.x, 1.15 * size, WATCH.z - 0.8);
                top.aura.material.opacity = ramp(t, 2, 7.5) * (0.75 + Math.sin(clockT * 2.3) * 0.08) + (t > 8.7 ? 0.2 : 0);

                // Its own eyes open last, wherever its head is
                if (bones.Head) {
                    bones.Head.getWorldPosition(tmp).sub(C);
                    top.gaze.position.set(tmp.x, tmp.y + 0.05 * size, tmp.z + 0.11 * size);
                    top.gaze.scale.setScalar(0.87 * size);
                    top.gaze.quaternion.copy(camera.quaternion);
                    top.glow.position.set(tmp.x, tmp.y - 0.2, tmp.z + 1.4);
                }
                if (once('gaze', t > 8.7)) { sfx.thud(); sfx.roar(1.6); }
                setOpen(top.gaze, t < 8.7 ? 0 : Math.min(1, (t - 8.7) * 2.2) * (0.92 + Math.sin(clockT * 9) * 0.08));
                top.glow.intensity = ramp(t, 2.5, 6.5) * 2 + (t > 8.7 ? 5 + Math.sin(clockT * 9) * 0.8 : 0) + beast * 4;

                // It speaks
                const line = `I SEE YOU, ${who}.`;
                if (once('roar', t > 10.3)) sfx.roar(3.2);
                if (t > 10.3 && t < 13.4) $('say').textContent = line.slice(0, Math.floor((t - 10.3) * 9));

                // The change: it swells, its arms stretch, spines fan out behind it, and every eye opens again

                    C.x + mix(mix(mix(1.8, -2.4, turn), 0.95, close), 1.5, wide),
                    mix(mix(mix(2.8, 2.1, turn), 1.75, close), 1.5, wide),
                    mix(mix(mix(hz + 4.8, 7.8, turn), 5.6, close), 8.2, wide));
                look.set(C.x + wide * -0.4, mix(mix(mix(mix(1.6, 3.4, p), 2.5, turn), 2.9, close), 3.7, wide), mix(hz - 8, WATCH.z, turn));
                if (t > 10.3 && t < 17) camTo.x += Math.sin(clockT * 40) * 0.012;

                if (t >= this.END) return true;
            },
            // Skip lands on the last frame instead of leaving the shot
            finish() { this.phase = 'scene'; this.z = 3.6; hero.root.position.z = 3.6; this.t = this.END - 0.05; walk(false); caption(''); fired = new Set(['c2', 'rise', 'gaze', 'roar', 'change', 'full']); watcher.play('Sword_Idle', { fade: 0 }); hero.play(heroCls.pose, { fade: 0 }); }
        },
        {   // 4. The fight
            name: 'fight', seamless: true,
            enter() { startFight(); },

        }
    ];

    // ═════════════ The fight ═════════════
    // A real-time duel on the roof. The visitor moves, rolls (briefly untouchable), strikes, guards, parries and heals.
    // The Watcher's moves are authored as poses over time (where its hand is, where the scythe points, how its body
    // turns and bends); its arms are solved to hold the scythe, so body and weapon always move as one. A blow lands only
    // where the blade actually passes, and the mark on the ground is drawn from that same blade path.
    //   Phase 1  scythe: sweep, overhead slam with a shockwave, lunge into a backhand cut, a burst if the visitor hugs it
    //   Phase 2  (below two thirds) adds a volley of eyes, and it comes apart and re-forms behind you
    //   Phase 3  (below one third) adds beams called down from the eyes in the dark, and everything is faster
    // Falling sends the visitor back to the start of the phase with one more ember, so nobody is stuck for good.
    // Fight positions are in the roof's own coordinates (x, z from its centre). Pose numbers are in the body's own units
    // (it stands about 1.5 tall before scaling), in a frame where z is ahead of it and its right hand is on the -x side.
    const fight = {};
    const ARENA = 11.4, REACH = 3.4;           // how far from the centre the visitor can go; how close a strike must be
    const RED = () => new THREE.MeshBasicMaterial({ color: '#ff2a1a', transparent: true, opacity: 0, depthWrite: false, fog: false, side: THREE.DoubleSide });
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
    const toward = (v, to, rate, dt) => v + (to - v) * (1 - Math.exp(-rate * dt));

    // ── Rig helpers: turn a bone in world space, and bend an arm to put its hand on a point ──
    const _pq = new THREE.Quaternion(), _bq = new THREE.Quaternion(), _q = new THREE.Quaternion();
    const _a = V(), _b = V(), _c = V(), _n = V(), _p = V(), _e = V(), _t = V();
    const UPV = V(0, 1, 0);
    function turnWorld(bone, q) {

        _n.copy(_t).normalize();

    }

    // crouch: 0 standing to 1 low. left: where its left hand goes ('shaft' = lower on the scythe, or a point).
    const POSE = {
        rest:    { hand: [-0.32, 0.98, 0.22], dir: [0.14, 1, 0.06], edge: [1, 0, 0], twist: 0, bend: 0.05, crouch: 0.15, left: null },
        cast:    { hand: [-0.3, 1.78, 0.12], dir: [0, 1, 0.05], edge: [1, 0, 0], twist: 0, bend: -0.2, crouch: 0, left: [0.34, 1.5, 0.5] },
        roar:    { hand: [-0.62, 1.2, -0.08], dir: [-0.9, 0.42, 0], edge: [0, 0, 1], twist: 0, bend: -0.38, crouch: 0.25, left: [0.62, 1.2, -0.08] },
        gather:  { hand: [-0.2, 1.0, 0.3], dir: [0.3, 0.9, 0.1], edge: [1, 0, 0], twist: 0, bend: 0.45, crouch: 0.95, left: [0.2, 0.95, 0.3] },
        stagger: { hand: [-0.6, 1.55, -0.3], dir: [-0.5, 0.7, -0.5], edge: [1, 0, 0], twist: -0.5, bend: -0.5, crouch: 0.7, left: null },
        low:     { hand: [-0.1, 0.92, 0.45], dir: [0.55, 0.2, 0.8], edge: [0, 1, 0], twist: 0.95, bend: 0.4, crouch: 0.9, left: 'shaft' },
        down:    { hand: [-0.3, 0.6, 0.3], dir: [0.4, -0.2, 0.9], edge: [0, -1, 0], twist: 0.2, bend: 0.7, crouch: 1, left: null }
    };
    // A move is a list of [time, pose, ease]; 'in' snaps into the pose (a strike), 'out' settles into it.
    const MOVE = {
        // Draws the scythe back to its right, then cuts flat through everything in front of it, right to left
        sweep: { lock: 0.55, active: [0.86, 1.04], total: 2.15, dmg: 28, keys: [
            [0, POSE.rest],
            [0.8, { hand: [-0.5, 1.15, -0.15], dir: [-0.8, 0.35, -0.5], edge: [0.5, 0, -0.85], twist: -1.0, bend: -0.05, crouch: 0.35, left: null }, 'out'],
            [0.9, { hand: [-0.55, 0.95, 0.35], dir: [-0.75, -0.1, 0.65], edge: [0.65, 0, 0.75], twist: 0.05, bend: 0.15, crouch: 0.5, left: null }, 'in'],
            [1.02, { hand: [-0.25, 0.9, 0.55], dir: [0.15, -0.1, 1], edge: [1, 0, -0.15], twist: 1.1, bend: 0.2, crouch: 0.5, left: null }],
            [1.4, { hand: [0.05, 1.0, 0.5], dir: [0.5, 0.05, 0.85], edge: [0.85, 0, -0.5], twist: 1.3, bend: 0.15, crouch: 0.4, left: null }, 'out'],
            [2.15, POSE.rest]
        ] },
        // The same cut coming back the other way: a backhand, left to right
        sweepBack: { lock: 0.2, active: [0.44, 0.62], total: 1.75, dmg: 26, keys: [
            [0, { hand: [0.05, 1.0, 0.5], dir: [0.5, 0.05, 0.85], edge: [-0.85, 0, 0.5], twist: 1.3, bend: 0.15, crouch: 0.4, left: null }],
            [0.4, { hand: [0.08, 1.05, 0.48], dir: [0.6, 0.12, 0.75], edge: [-0.8, 0, 0.6], twist: 1.4, bend: 0.1, crouch: 0.45, left: null }, 'out'],
            [0.5, { hand: [-0.45, 0.95, 0.45], dir: [-0.55, -0.1, 0.83], edge: [-0.83, 0, -0.55], twist: 0.1, bend: 0.2, crouch: 0.5, left: null }, 'in'],
            [0.62, { hand: [-0.55, 0.98, 0.05], dir: [-0.85, -0.06, -0.5], edge: [0.5, 0, -0.85], twist: -1.0, bend: 0.12, crouch: 0.45, left: null }],
            [1.0, { hand: [-0.5, 1.05, -0.1], dir: [-0.8, 0.1, -0.6], edge: [0.6, 0, -0.8], twist: -1.15, bend: 0.05, crouch: 0.35, left: null }, 'out'],
            [1.75, POSE.rest]
        ] },
        // Lifts the scythe overhead in both hands and brings it straight down; it stays buried a moment
        slam: { lock: 0.62, active: [0.92, 1.12], total: 2.6, dmg: 34, keys: [
            [0, POSE.rest],
            [0.9, { hand: [-0.2, 1.85, -0.1], dir: [0, 0.75, -0.65], edge: [0, -0.65, -0.75], twist: -0.15, bend: -0.3, crouch: 0, left: 'shaft' }, 'out'],
            [1.07, { hand: [-0.1, 0.85, 0.6], dir: [0, -0.22, 1], edge: [0, -1, -0.22], twist: 0, bend: 0.55, crouch: 0.6, left: 'shaft' }, 'in'],
            [1.7, { hand: [-0.1, 0.85, 0.6], dir: [0, -0.22, 1], edge: [0, -1, -0.22], twist: 0, bend: 0.5, crouch: 0.6, left: 'shaft' }],
            [2.6, POSE.rest]
        ] }
    };
    const EASE = { in: k => k * k * k, out: k => 1 - Math.pow(1 - k, 3), undefined: ease };
    const blank = () => ({ hand: V(), dir: V(), edge: V(), twist: 0, bend: 0, crouch: 0, left: null });
    const _pa = blank(), _pb = blank();
    function readPose(src, out) {
        out.hand.fromArray(src.hand); out.dir.fromArray(src.dir).normalize(); out.edge.fromArray(src.edge).normalize();
        out.twist = src.twist; out.bend = src.bend; out.crouch = src.crouch; out.left = src.left;
        return out;
    }
    function blendPose(a, b, k, out) {

        out.dir.copy(a.dir).lerp(b.dir, k).normalize();
        out.edge.copy(a.edge).lerp(b.edge, k).normalize();

    }
    function movePose(move, t, out) {
        const keys = move.keys;

    }

    // Puts the Watcher's body into a pose (after its animation has run) and hangs the scythe in its hand.
    // Returns nothing; leaves the blade's three points in rig.hand / rig.top / rig.tip, in roof coordinates.
    const rig = { hand: V(), top: V(), tip: V(), q: new THREE.Quaternion(), m: new THREE.Matrix4(), x: V(), z: V(), tw: new THREE.Quaternion(), bd: new THREE.Quaternion(), right: V(), tgt: V(), d: V(), e: V(), lt: V() };
    const SHAFT = 2.3 - GRIP;                  // from its hand up to the top of the shaft, in body units
    function poseWatcher(p, B, size, scytheScale) {
        const C = SETS.top.position, yaw = B.yaw;
        watcher.root.updateMatrixWorld(true);
        // Body: turn at the waist and chest, bend at the waist
        rig.right.set(Math.cos(yaw), 0, -Math.sin(yaw));
        turnWorld(bones.spine_01, rig.tw.setFromAxisAngle(UPV, p.twist * 0.5));
        turnWorld(bones.spine_01, rig.bd.setFromAxisAngle(rig.right, p.bend));
        turnWorld(bones.spine_03, rig.tw);

        const place = (v, out, isDir) => {
            out.copy(v);
            if (!isDir) out.y -= 0.85;
            out.applyAxisAngle(rig.x.set(1, 0, 0), p.bend).applyAxisAngle(UPV, p.twist);
            if (!isDir) { out.y += 0.85; out.multiplyScalar(size); }
            out.applyAxisAngle(UPV, yaw);
            if (!isDir) { out.x += B.x + C.x; out.z += B.z; }

        rig.x.copy(rig.e).negate();                                             // the blade is modelled along -x

        top.scythe.position.copy(rig.hand).addScaledVector(rig.d, -GRIP * size);

    const _s = V();
    function nearSeg(px, pz, a, b) {        // how far a point on the ground is from a line, both seen from above
        const dx = b.x - a.x, dz = b.z - a.z, k = clamp01(((px - a.x) * dx + (pz - a.z) * dz) / (dx * dx + dz * dz || 1));

    }
    const BLADE = 0.95;                         // how near the blade (seen from above) has to pass to count

    // ── Ground marks ──
    const fx = {};
    {
        const S = SETS.top, flat = m => { m.rotation.x = -Math.PI / 2; m.position.y = 0.04; m.visible = false; S.add(m); return m; };
        fx.wave = flat(new THREE.Mesh(new THREE.RingGeometry(0.86, 1, 40), RED()));
        fx.beams = Array.from({ length: 8 }, () => {
            const mark = flat(new THREE.Mesh(new THREE.CircleGeometry(2, 18), RED()));
            const pillar = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: '#ff3a2a', transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
            pillar.scale.set(3.4, 22, 1);
            pillar.visible = false;
            S.add(pillar);
            return { mark, pillar, t: -1, x: 0, z: 0, hit: false };
        });
        fx.orbs = Array.from({ length: 9 }, () => {
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: '#ff2a1a', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
            sp.scale.set(1.1, 1.1, 1);
            sp.visible = false;
            S.add(sp);
            return { sp, live: false, p: V(), v: V(), age: 0 };
        });
        fx.spark = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: '#ffe6b8', transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
        fx.spark.scale.set(2.2, 2.2, 1);

    // For each scythe move: run it once on the real body, trace where the blade goes over the ground, and keep that
    // as a picture. The same blade test decides hits, so what is marked is exactly what is dangerous.
    const MARK_EXTENT = 3.4;                    // half the width of the picture, in body units
    function buildMarks() {
        const B = { x: 0, z: 0, yaw: 0 }, N = 128, pose = blank();
        watcher.root.position.set(0, 0, 0);
        watcher.root.rotation.set(0, 0, 0);
        watcher.root.scale.setScalar(BEAST);
        for (const [name, move] of Object.entries(MOVE)) {
            const c = document.createElement('canvas');
            c.width = c.height = N;
            const g = c.getContext('2d');
            g.fillStyle = '#000';
            g.fillRect(0, 0, N, N);
            g.strokeStyle = '#fff';
            g.lineCap = g.lineJoin = 'round';
            g.lineWidth = BLADE / BEAST / (2 * MARK_EXTENT) * N * 2;
            const px = v => (v / BEAST / (2 * MARK_EXTENT) + 0.5) * N;

                g.beginPath(); g.moveTo(px(_s.x), px(_s.z)); g.lineTo(px(rig.top.x), px(rig.top.z)); g.lineTo(px(rig.tip.x), px(rig.tip.z)); g.stroke();
            }

            m.alphaMap = tex;
            fx.marks[name] = fx.flat(new THREE.Mesh(new THREE.PlaneGeometry(2 * MARK_EXTENT, 2 * MARK_EXTENT), m));
        }
    }

    // ── The visitor's blade, and the bones the fight poses on them ──
    const hb = {};
    let blade = null;
    function armHero() {
        hero.root.traverse(o => { if (o.isBone && /^(upperarm_r|lowerarm_r|hand_r)$/.test(o.name)) hb[o.name] = o; });
        if (blade) return;

        blade = new THREE.Group();
        const steel = new THREE.MeshLambertMaterial({ color: '#c9c4cc', emissive: '#2a2830' });
        const edge = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.05, 0.78), steel);
        edge.position.z = 0.47;
        const guard = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.2, 0.03), new THREE.MeshLambertMaterial({ color: '#6a5a3a' }));
        guard.position.z = 0.08;
        const grip = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.026, 0.16), new THREE.MeshLambertMaterial({ color: '#2a1c14' }));
        blade.add(edge, guard, grip);
        blade.position.set(-0.02, 0.085, 0);
        hb.hand_r.add(blade);
    }

    function resetFight() {
        Object.assign(fight, {
            on: false, done: false, T: 0, mode: 'intro', modeT: 0, rank: null, deaths: 0, hits: 0, parries: 0, time: 0, bot: fight.bot || false, roared: false, carded: false,
            // the visitor
            p: { x: 0, z: 3.6, yaw: Math.PI, hp: 100, st: 100, stWait: 0, state: 'idle', t: 0, inv: false, heals: 3, maxHeals: 3, dx: 0, dz: 0, struck: false, healed: false, guardAt: -9, flick: 0 },
            want: { attack: -9, roll: -9, heal: -9 }, guard: false,

            b: { x: WATCH.x, z: WATCH.z, yaw: 0, hp: 100, shown: 100, phase: 1, state: 'idle', move: null, t: 0, cool: 1.8, last: '', flinch: 0, hidden: 0, tx: 0, tz: 0, did: {}, n: 0, walk: 0, run: 0, open: 0 },
            pose: readPose(POSE.rest, blank()), poseTo: readPose(POSE.rest, blank()), poseRate: 8,
            size: BEAST, crown: 1, crownTo: 1, scythe: 1, gaze: 1, shake: 0, wave: null, checkpoint: 100, hot: 0, mark: null, cut: 0
        });

        for (const o of fx.orbs) { o.live = false; o.sp.visible = false; }
        fx.wave.visible = false;
        for (const m of Object.values(fx.marks)) m.visible = false;
        for (const id of ['phase', 'me', 'pad', 'fell']) $(id).hidden = true;
        $('say').textContent = '';
        timeWarp = 1;
    }
    resetFight();

    // ── Input: keys and mouse on a computer, a stick and four buttons on a phone ──
    const keys = new Set(), stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
    const press = what => { if (fight.on) fight.want[what] = fight.T; };
    const guard = on => { if (on && !fight.guard) fight.p.guardAt = fight.T; fight.guard = on; $('btnGuard').classList.toggle('held', on); };
    addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        keys.add(k);
        if (!fight.on || e.repeat) return;
        if (k === ' ' || k === 'k') { e.preventDefault(); press('roll'); }
        else if (k === 'j' || k === 'enter') press('attack');
        else if (k === 'e' || k === 'r') press('heal');
        else if (k === 'shift' || k === 'l' || k === 'f') guard(true);
    });
    addEventListener('keyup', e => { const k = e.key.toLowerCase(); keys.delete(k); if (k === 'shift' || k === 'l' || k === 'f') guard(false); });
    addEventListener('blur', () => { keys.clear(); stick.id = null; stick.x = stick.y = 0; guard(false); });
    addEventListener('pointerdown', e => {

    });
    const dropStick = e => {
        if (e.pointerType === 'mouse' && e.button === 2) guard(false);

    addEventListener('pointerup', dropStick);
    addEventListener('pointercancel', dropStick);
    for (const [id, what] of [['btnAtk', 'attack'], ['btnRoll', 'roll'], ['btnHeal', 'heal']]) $(id).addEventListener('pointerdown', e => { e.preventDefault(); press(what); });

    function heroAnim(name, once = false, speed = 1, restart = false, from = 0) {
        const a = hero.play(name, { fade: 0.1, once });
        if (a && restart) { a.reset().play(); a.time = from; }
        hero.mixer.timeScale = speed;
    }
    function setMode(mode) { fight.mode = mode; fight.modeT = 0; }
    function line(text, seconds = 2.2) {
        $('say').textContent = text;
        clearTimeout(line.t);
        line.t = setTimeout(() => { if ($('say').textContent === text) $('say').textContent = ''; }, seconds * 1000);
    }
    function flashHurt() { $('hurt').classList.remove('on'); void $('hurt').offsetWidth; $('hurt').classList.add('on'); }

    // A blow reaching the visitor. Rolling through it avoids it; a guard raised just in time turns it aside (and, if it
    // was the scythe, leaves the Watcher open); a guard already up takes most of it, at a cost in stamina.
    function hitPlayer(dmg, fromX, fromZ, kind = 'blade') {
        const P = fight.p, B = fight.b;
        if (P.inv || P.state === 'dead' || fight.mode !== 'play') return false;
        const facing = Math.abs(angDiff(Math.atan2(fromX - P.x, fromZ - P.z), P.yaw)) < 1.9;
        if (P.state === 'guard' && facing && kind !== 'beam') {
            if (fight.T - P.guardAt < 0.22) {
                fight.parries++;
                P.flick = 1;
                fx.spark.material.opacity = 1;
                fx.spark.position.set(P.x + Math.sin(P.yaw) * 0.6, 1.4, P.z + Math.cos(P.yaw) * 0.6);
                sfx.tick(); sfx.thud();
                timeWarp = 0.25;
                fight.shake = 0.5;
                if (kind === 'blade') { B.state = 'stagger'; B.t = 0; B.did = {}; fight.mark = null; line('PARRIED', 0.9); }
                return true;
            }
            P.st -= dmg * 1.1;
            P.stWait = 0.9;
            sfx.thud();
            fight.shake = 0.4;
            if (P.st > 0) { P.hp -= dmg * 0.15; if (P.hp > 0) return true; }

            dmg *= 0.7;

        sfx.thud();
        flashHurt();
        const d = Math.hypot(P.x - fromX, P.z - fromZ) || 1;
        P.dx = (P.x - fromX) / d; P.dz = (P.z - fromZ) / d;
        if (P.hp <= 0) {

            fight.deaths++;

            sfx.roar(2.4);

    }
    function hitBoss(dmg) {
        const B = fight.b;
        if (B.hidden > 0.3 || B.state === 'roar' || fight.mode !== 'play') return;
        if (B.state === 'stagger') dmg *= 1.75;                 // an opening is worth more
        B.hp = Math.max(0, B.hp - dmg);
        B.flinch = 1;
        fight.shake = Math.max(fight.shake, 0.35);
        fx.spark.material.opacity = 1;
        fx.spark.position.set(mix(fight.p.x, B.x, 0.75), 1.6, mix(fight.p.z, B.z, 0.75));
        sfx.thud();
        if (B.hp <= 0) { setMode('won'); B.state = 'down'; B.t = 0; fight.mark = null; sfx.roar(3.5); sfx.setDrone(false); document.body.classList.add('cine'); return; }
        const next = B.hp <= 33 ? 3 : B.hp <= 66 ? 2 : 1;
        if (next > B.phase) { B.phase = next; fight.checkpoint = next === 2 ? 66 : 33; B.state = 'roar'; B.t = 0; B.did = {}; fight.mark = null; }
    }

    // ── The visitor ──
    let RUN = 4.2, JOG_RATE = 1.5, WALK = 1.4;      // corrected from the clips when the fight starts
    function updatePlayer(dt) {
        const P = fight.p, B = fight.b, T = fight.T;
        // Movement is relative to the Watcher: forward is towards it, sideways circles it
        let ix = 0, iy = 0;
        if (keys.has('w') || keys.has('arrowup')) iy += 1;
        if (keys.has('s') || keys.has('arrowdown')) iy -= 1;
        if (keys.has('d') || keys.has('arrowright')) ix += 1;
        if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
        ix += stick.x; iy -= stick.y;
        if (fight.bot) [ix, iy] = botThink(ix, iy);
        const il = Math.hypot(ix, iy);
        if (il > 1) { ix /= il; iy /= il; }
        let fxd = B.x - P.x, fzd = B.z - P.z;
        const dist = Math.hypot(fxd, fzd) || 1;
        fxd /= dist; fzd /= dist;
        const mx = fxd * iy - fzd * ix, mz = fzd * iy + fxd * ix;
        const moving = il > 0.15;
        const fresh = what => T - fight.want[what] < 0.3;
        const can = fight.mode === 'play';

        P.t += dt;
        P.inv = false;
        P.stWait -= dt;
        P.flick = toward(P.flick, 0, 5, dt);
        if (P.state === 'idle' || P.state === 'run' || P.state === 'guard') {
            if (can && fresh('roll') && P.st > 8) {
                fight.want.roll = -9;
                P.state = 'roll'; P.t = 0; P.st -= 22; P.stWait = 0.8;
                // Rolls go where the stick points, or straight back if it is at rest
                P.dx = moving ? mx / il : -fxd; P.dz = moving ? mz / il : -fzd;
                P.yaw = Math.atan2(P.dx, P.dz);
                heroAnim('Roll', true, 1.9, true, 0.12);
                sfx.whoosh();
            } else if (can && fresh('attack') && P.st > 6) {
                fight.want.attack = -9;
                P.state = 'attack'; P.t = 0; P.st -= 15; P.stWait = 0.8; P.struck = false;
                P.yaw = Math.atan2(fxd, fzd);
                // The clip winds up for a third of a second; skip some of that so the blow answers the button
                heroAnim('Sword_Attack', true, 1.3, true, 0.1);
            } else if (can && fresh('heal') && P.heals > 0 && P.hp < 100) {
                fight.want.heal = -9;
                P.state = 'heal'; P.t = 0; P.healed = false;
                heroAnim('Interact', true, 1.9, true);
            } else if (can && fight.guard && P.st > 0) {
                if (P.state !== 'guard') { P.state = 'guard'; P.guardAt = Math.max(P.guardAt, T - 0.05); }
                P.yaw += angDiff(Math.atan2(fxd, fzd), P.yaw) * Math.min(1, dt * 12);
                P.stWait = 0.35;
                heroAnim('Idle_Loop');
            } else if (moving && fight.mode !== 'dead') {
                P.state = 'run';
                P.x += mx * RUN * dt; P.z += mz * RUN * dt;
                P.yaw += angDiff(Math.atan2(mx, mz), P.yaw) * Math.min(1, dt * 14);
                heroAnim('Jog_Fwd_Loop', false, JOG_RATE * Math.min(1, il + 0.2));
                heroSteps();
            } else {
                P.state = 'idle';
                P.yaw += angDiff(Math.atan2(fxd, fzd), P.yaw) * Math.min(1, dt * 8);
                heroAnim('Sword_Idle');
            }
        } else if (P.state === 'roll') {
            // The clip is a dive: up, over, and back to the feet. The middle of it is the part nothing can touch.
            P.inv = P.t > 0.06 && P.t < 0.5;
            const v = P.t < 0.52 ? 7.2 : 2.2;
            P.x += P.dx * v * dt; P.z += P.dz * v * dt;
            if (P.t >= 0.7) P.state = 'idle';
        } else if (P.state === 'attack') {
            // The blade comes down a quarter of a second in
            if (!P.struck && P.t >= 0.25) {
                P.struck = true;
                if (dist < REACH) hitBoss(4); else sfx.tick();
            }
            if (P.t >= 0.6) P.state = 'idle';
        } else if (P.state === 'heal') {
            if (!P.healed && P.t >= 0.6) { P.healed = true; P.heals--; P.hp = Math.min(100, P.hp + 45); sfx.kindle(); }
            if (P.t >= 1) P.state = 'idle';
        } else if (P.state === 'hurt') {
            const v = Math.max(0, 6 * (1 - P.t / 0.3));
            P.x += P.dx * v * dt; P.z += P.dz * v * dt;
            if (P.t >= 0.36) P.state = 'idle';

        const r = Math.hypot(P.x, P.z);
        if (r > ARENA) { P.x *= ARENA / r; P.z *= ARENA / r; }
        if (r < 1.6) { const k = 1.6 / (r || 1); P.x = (P.x || 0.01) * k; P.z *= k; }

    }

    // ── The Watcher ──
    function pick(B, dist) {
        const opts = [];
        const add = (name, w) => { if (name !== B.last) opts.push([name, w]); };
        if (dist < 3.2) add('burst', 4);                          // too close for the scythe: it throws them off
        if (dist < 8) { add('sweep', 3); add('slam', 2); if (B.phase >= 2) add('scatter', 1.2); }
        if (dist >= 5.5) { add('lunge', 3); add('slam', 1); if (B.phase >= 2) add('volley', 3); }
        if (B.phase >= 3) add('beams', 2.2);
        let roll = Math.random() * opts.reduce((s, o) => s + o[1], 0);
        for (const [name, w] of opts) { roll -= w; if (roll <= 0) return name; }
        return 'sweep';
    }
    const _mp = blank();
    function updateBoss(dt) {
        const B = fight.b, P = fight.p;
        const sp = 1 + (B.phase - 1) * 0.14;                    // everything it does gets quicker each phase
        const dx = P.x - B.x, dz = P.z - B.z, dist = Math.hypot(dx, dz) || 1, aim = Math.atan2(dx, dz);
        const face = rate => { B.yaw += angDiff(aim, B.yaw) * Math.min(1, dt * rate); };
        const first = key => { if (B.did[key]) return false; B.did[key] = true; return true; };
        const begin = (state, move) => { B.state = state; B.move = move || null; B.t = 0; B.did = {}; B.last = state; B.n = 0; };
        const settle = () => { B.state = 'idle'; B.move = null; B.t = 0; B.cool = (0.45 + Math.random() * 0.7) / sp; fight.mark = null; };
        const hold = (name, rate = 9) => { readPose(POSE[name], fight.poseTo); fight.poseRate = rate; };
        B.t += dt;
        B.flinch = toward(B.flinch, 0, 5, dt);
        fight.hot = 0;
        let walking = 0, running = 0;

        if (fight.mode !== 'play') {
            if (B.state !== 'down' && fight.mode !== 'intro') { face(2); hold('rest', 4); }
        } else if (B.state === 'idle') {
            face(3.2);
            hold('rest', 6);
            if (dist > 6.2) { const v = WALK * fight.size * 0.62 * sp; B.x += dx / dist * v * dt; B.z += dz / dist * v * dt; walking = 1; }
            B.cool -= dt;
            if (B.cool <= 0) {
                const next = pick(B, dist);
                if (MOVE[next]) begin(next, next); else begin(next);
            }
        } else if (B.move) {
            // A scythe move: the pose comes from its keys, the mark from its traced path, the hit from the blade itself
            const move = MOVE[B.move], t = B.t * sp;
            if (t < move.lock) face(5);
            movePose(move, t, fight.poseTo);
            fight.poseRate = 40;
            fight.hot = clamp01(t / move.active[0]) * (t < move.active[1] ? 1 : 0);
            fight.mark = t < move.active[1] + 0.1 ? { name: B.move, x: B.x, z: B.z, yaw: B.yaw, k: clamp01(t / move.active[0]) } : null;
            fight.cut = t >= move.active[0] && t <= move.active[1] ? move.dmg : 0;
            if (first('whoosh') ? false : t >= move.active[0] - 0.05 && first('cut')) sfx.whoosh();
            if (B.move === 'slam' && t >= move.active[1] && first('land')) {
                sfx.thud(); sfx.rumble(1.2); fight.shake = Math.max(fight.shake, 0.7);
                fight.wave = { x: rig.tip.x, z: rig.tip.z, r: 0.6, max: 10, hit: false };
            }
            if (t >= move.total) {
                // In later phases a sweep is sometimes followed straight back the other way
                if (B.move === 'sweep' && B.phase >= 2 && Math.random() < 0.45) begin('sweepBack', 'sweepBack');
                else settle();
            } else if (B.move === 'sweep' && t >= 1.4 && B.phase >= 2 && first('chain') && Math.random() < 0.45) begin('sweepBack', 'sweepBack');
        } else if (B.state === 'lunge') {
            // Drops low, crosses the roof in a few strides, and arrives already cutting
            const wind = 0.6 / sp;
            hold('low', 9);
            if (B.t < wind) {
                face(6);
                const go = Math.max(0, dist - 4.2);
                B.tx = B.x + dx / dist * go; B.tz = B.z + dz / dist * go;
                fight.mark = { name: 'sweepBack', x: B.tx, z: B.tz, yaw: B.yaw, k: B.t / wind * 0.6 };
            } else if (B.t < wind + 0.42) {
                if (first('go')) { sfx.whoosh(); B.vx = (B.tx - B.x) / 0.42; B.vz = (B.tz - B.z) / 0.42; }
                B.x += B.vx * dt; B.z += B.vz * dt;

            // Gathers itself in, then throws everything near it outwards

        } else if (B.state === 'volley') {

                while (B.n < n) {
                    B.n++;
                    const o = fx.orbs.find(q => !q.live);
                    if (!o) break;
                    o.live = true; o.age = 0;
                    o.p.set(B.x + (Math.random() - 0.5) * 2, 0.9 * fight.size + Math.random() * 1.5, B.z);
                    o.v.set(P.x - o.p.x, 1.2 - o.p.y, P.z - o.p.z).normalize().multiplyScalar(11.5 * sp);

                }
