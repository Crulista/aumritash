                    top.scythe.visible = true;
                    top.scythe.position.copy(tmp).addScaledVector(top.lean, -GRIP * size * grow);
                    top.scythe.scale.setScalar(Math.max(0.001, grow) * size);
                    top.edge.material.color.setRGB(1, 0.16 + (1 - ramp(t, 16.1, 17)) * 0.84, 0.1 + (1 - ramp(t, 16.1, 17)) * 0.9);
                }
                // The visitor's name comes apart and settles into its name, over a health bar
                if (t >= 13.4 && t < 17) $('say').textContent = jumble(who, BOSS, (t - 13.6) / 2.4);
                if (once('named', t > 17)) { $('say').textContent = ''; $('bossName').textContent = BOSS; $('boss').hidden = false; sfx.thud(); }
                if (t > 17) $('bossFill').style.width = ramp(t, 17.2, 18.8) * 100 + '%';
                if (once('full', t > 18.8)) sfx.tick();

                // Camera: behind the visitor as they walk; round to their shoulder as the thing takes shape; low and close when
                // it speaks; then back and up as it outgrows the frame
                const hz = hero.root.position.z;
                const turn = ramp(t, 0.3, 4), close = ramp(t, 8, 9.8), wide = ramp(t, 13.4, 16.5);
                camTo.set(
                    C.x + mix(mix(mix(1.8, -2.4, turn), 0.95, close), 1.5, wide),
                    mix(mix(mix(2.8, 2.1, turn), 1.75, close), 1.5, wide),
                    mix(mix(mix(hz + 4.8, 7.8, turn), 5.6, close), 8.2, wide));
                look.set(C.x + wide * -0.4, mix(mix(mix(mix(1.6, 3.4, p), 2.5, turn), 2.9, close), 3.7, wide), mix(hz - 8, WATCH.z, turn));
                if (t > 10.3 && t < 17) camTo.x += Math.sin(clockT * 40) * 0.012;

                if (t >= this.END) return true;
            },
            // Skip lands on the last frame instead of leaving the shot
            finish() { this.phase = 'scene'; this.z = 3.6; hero.root.position.z = 3.6; this.t = this.END - 0.05; walk(false); caption(''); fired = new Set(['c2', 'rise', 'gaze', 'roar', 'change', 'full']); watcher.play('Sword_Idle', { fade: 0 }); hero.play(heroCls.pose, { fade: 0 }); }
        },
        {   // 4. The fight
            name: 'fight', seamless: true,
            enter() { startFight(); },
            update(dt) { fightFrame(dt); if (fight.done) { fight.on = false; hero.mixer.timeScale = 1; } return fight.done; },
            finish() { abortFight(); }
        }
    ];

    // ═════════════ The fight ═════════════
    // A real-time duel on the roof. The visitor moves, rolls (briefly untouchable), strikes and heals; all of it costs
    // stamina or embers. The Watcher telegraphs each attack, commits to it, then leaves an opening.
    //   Phase 1  scythe: sweep, overhead slam with a shockwave, lunge
    //   Phase 2  (below two thirds) adds a volley of eyes, and it comes apart and re-forms behind you
    //   Phase 3  (below one third) adds beams called down from the eyes in the dark, and everything is faster
    // Falling sends the visitor back to the start of the phase with one more ember, so nobody is stuck for good.
    // All fight positions are in the roof's own coordinates (x, z from its centre).
    const fight = {};
    const ARENA = 11.4, REACH = 3.5;           // how far from the centre the visitor can go; how close a strike must be
    const ATTACK = { Wanderer: 'Sword_Attack', Hunter: 'Sword_Attack', Pilgrim: 'Interact', Wretch: 'Spell_Simple_Shoot' }[heroCls.name] || 'Sword_Attack';
    const RED = () => new THREE.MeshBasicMaterial({ color: '#ff2a1a', transparent: true, opacity: 0, depthWrite: false, fog: false, side: THREE.DoubleSide });
    const fx = {};
    {
        const S = SETS.top, flat = m => { m.rotation.x = -Math.PI / 2; m.position.y = 0.04; m.visible = false; S.add(m); return m; };
        // Faint marks on the stone where a blow is about to land
        fx.sweep = flat(new THREE.Mesh(new THREE.RingGeometry(1.5, 6.6, 24, 1, -1.9, 3.8), RED()));
        const strip = new THREE.PlaneGeometry(3, 8.4);
        strip.translate(0, 4.2, 0);
        fx.slam = flat(new THREE.Mesh(strip, RED()));
        fx.wave = flat(new THREE.Mesh(new THREE.RingGeometry(0.86, 1, 40), RED()));
        fx.beams = Array.from({ length: 8 }, () => {
            const mark = flat(new THREE.Mesh(new THREE.CircleGeometry(2, 18), RED()));
            const pillar = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: '#ff3a2a', transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
            pillar.scale.set(3.4, 22, 1);
            pillar.visible = false;
            S.add(pillar);
            return { mark, pillar, t: -1, x: 0, z: 0, hit: false };
        });
        fx.orbs = Array.from({ length: 9 }, () => {
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: '#ff2a1a', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
            sp.scale.set(1.1, 1.1, 1);
            sp.visible = false;
            S.add(sp);
            return { sp, live: false, p: new THREE.Vector3(), v: new THREE.Vector3(), age: 0 };
        });
        // The visitor's strike landing
        fx.spark = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: '#ffe6b8', transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
        fx.spark.scale.set(2.2, 2.2, 1);
        S.add(fx.spark);
    }

    function resetFight() {
        Object.assign(fight, {
            on: false, done: false, T: 0, mode: 'intro', modeT: 0, rank: null, deaths: 0, hits: 0, time: 0, bot: fight.bot || false,
            // the visitor
            p: { x: 0, z: 3.6, yaw: Math.PI, hp: 100, st: 100, stWait: 0, state: 'idle', t: 0, inv: false, heals: 3, maxHeals: 3, dx: 0, dz: 0, struck: false, healed: false, lie: 0 },
            want: { attack: -9, roll: -9, heal: -9 },
            // the Watcher
            b: { x: WATCH.x, z: WATCH.z, yaw: 0, hp: 100, shown: 100, phase: 1, state: 'idle', t: 0, cool: 1.6, last: '', twist: 0, tilt: 0, flinch: 0, hidden: 0, tx: 0, tz: 0, did: {}, n: 0 },
            lean: new THREE.Vector3(0.16, 1, 0), leanTo: new THREE.Vector3(0.16, 1, 0), leanRate: 5,
            size: BEAST, crown: 1, crownTo: 1, scythe: 1, gaze: 1, shake: 0, wave: null, checkpoint: 100, hot: 0
        });
        for (const b of fx.beams) { b.t = -1; b.mark.visible = b.pillar.visible = false; }
        for (const o of fx.orbs) { o.live = false; o.sp.visible = false; }
        fx.sweep.visible = fx.slam.visible = fx.wave.visible = false;
        for (const id of ['phase', 'me', 'pad', 'fell']) $(id).hidden = true;
        $('say').textContent = '';
    }
    resetFight();

    // ── Input: keys and mouse on a computer, a stick and three buttons on a phone ──
    const keys = new Set(), stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
    const press = what => { if (fight.on) fight.want[what] = fight.T; };
    addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        keys.add(k);
        if (!fight.on || e.repeat) return;
        if (k === ' ' || k === 'k' || k === 'shift') { e.preventDefault(); press('roll'); }
        else if (k === 'j' || k === 'enter') press('attack');
        else if (k === 'e' || k === 'r') press('heal');
    });
    addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
    addEventListener('blur', () => { keys.clear(); stick.id = null; stick.x = stick.y = 0; });
    addEventListener('pointerdown', e => {
        if (!fight.on || isUI(e.target)) return;
        if (e.pointerType === 'mouse') { press(e.button === 2 ? 'roll' : 'attack'); return; }
        if (stick.id === null) {
            stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; stick.x = stick.y = 0;
            $('stick').style.display = 'block';
            $('stick').style.left = e.clientX + 'px';
            $('stick').style.top = e.clientY + 'px';
            $('knob').style.transform = '';
        }
    });
    addEventListener('pointermove', e => {
        if (e.pointerId !== stick.id) return;
        const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy, len = Math.hypot(dx, dy), k = Math.min(1, len / 50) / (len || 1);
        stick.x = dx * k; stick.y = dy * k;
        $('knob').style.transform = `translate(${stick.x * 34}px, ${stick.y * 34}px)`;
    });
    const dropStick = e => { if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.y = 0; $('stick').style.display = 'none'; } };
    addEventListener('pointerup', dropStick);
    addEventListener('pointercancel', dropStick);
    for (const [id, what] of [['btnAtk', 'attack'], ['btnRoll', 'roll'], ['btnHeal', 'heal']]) $(id).addEventListener('pointerdown', e => { e.preventDefault(); press(what); });

    const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
    const toward = (v, to, rate, dt) => v + (to - v) * (1 - Math.exp(-rate * dt));
    function heroAnim(name, once = false, speed = 1, restart = false) {
        const a = hero.play(name, { fade: 0.12, once });
        if (a && restart) a.reset().play();
        hero.mixer.timeScale = speed;
    }
    function setMode(mode) { fight.mode = mode; fight.modeT = 0; }
    function line(text, seconds = 2.2) {
        $('say').textContent = text;
        clearTimeout(line.t);
        line.t = setTimeout(() => { if ($('say').textContent === text) $('say').textContent = ''; }, seconds * 1000);
    }

    function hitPlayer(dmg, fromX, fromZ) {
        const P = fight.p;
        if (P.inv || P.state === 'dead' || fight.mode !== 'play') return false;
        P.hp -= dmg;
        fight.hits++;
        fight.shake = 1;
        sfx.thud();
        $('hurt').classList.remove('on');
        void $('hurt').offsetWidth;
        $('hurt').classList.add('on');
        const d = Math.hypot(P.x - fromX, P.z - fromZ) || 1;
        P.dx = (P.x - fromX) / d; P.dz = (P.z - fromZ) / d;
        if (P.hp <= 0) {
            P.hp = 0; P.state = 'dead'; P.t = 0;
            fight.deaths++;
            setMode('dead');
            sfx.roar(2.4);
        } else { P.state = 'hurt'; P.t = 0; }
        return true;
    }
    function hitBoss(dmg) {
        const B = fight.b;
        if (B.hidden > 0.3 || B.state === 'roar' || fight.mode !== 'play') return;
        B.hp = Math.max(0, B.hp - dmg);
        B.flinch = 1;
        fight.shake = Math.max(fight.shake, 0.35);
        fx.spark.material.opacity = 1;
        fx.spark.position.set(mix(fight.p.x, B.x, 0.75), 1.6, mix(fight.p.z, B.z, 0.75));
        sfx.thud();
        if (B.hp <= 0) { setMode('won'); B.state = 'down'; B.t = 0; sfx.roar(3.5); sfx.setDrone(false); watcher.play('Fixing_Kneeling', { fade: 0.8 }); watcher.mixer.timeScale = 0.35; return; }
        const next = B.hp <= 33 ? 3 : B.hp <= 66 ? 2 : 1;
        if (next > B.phase) { B.phase = next; fight.checkpoint = next === 2 ? 66 : 33; B.state = 'roar'; B.t = 0; }
    }

    // ── The visitor ──
    function updatePlayer(dt) {
        const P = fight.p, B = fight.b, T = fight.T;
        // Movement is relative to the Watcher: forward is towards it, sideways circles it
        let ix = 0, iy = 0;
        if (keys.has('w') || keys.has('arrowup')) iy += 1;
        if (keys.has('s') || keys.has('arrowdown')) iy -= 1;
        if (keys.has('d') || keys.has('arrowright')) ix += 1;
        if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
        ix += stick.x; iy -= stick.y;
        if (fight.bot) [ix, iy] = botThink(ix, iy);
        const il = Math.hypot(ix, iy);
        if (il > 1) { ix /= il; iy /= il; }
        let fxd = B.x - P.x, fzd = B.z - P.z;
        const dist = Math.hypot(fxd, fzd) || 1;
        fxd /= dist; fzd /= dist;
        const mx = fxd * iy - fzd * ix, mz = fzd * iy + fxd * ix;
        const moving = il > 0.15;
        const fresh = what => T - fight.want[what] < 0.3;
        const can = fight.mode === 'play';

        P.t += dt;
        P.inv = false;
        P.stWait -= dt;
        if (P.state === 'idle' || P.state === 'run') {
            if (can && fresh('roll') && P.st > 8) {
                fight.want.roll = -9;
                P.state = 'roll'; P.t = 0; P.st -= 22; P.stWait = 0.7;
                // Rolls go where the stick points, or straight back if it is at rest
                P.dx = moving ? mx / il : -fxd; P.dz = moving ? mz / il : -fzd;
                P.yaw = Math.atan2(P.dx, P.dz);
                heroAnim('Roll', true, 1.7, true);
                sfx.whoosh();
            } else if (can && fresh('attack') && P.st > 6) {
                fight.want.attack = -9;
                P.state = 'attack'; P.t = 0; P.st -= 15; P.stWait = 0.8; P.struck = false;
                P.yaw = Math.atan2(fxd, fzd);
                heroAnim(ATTACK, true, 1.5, true);
            } else if (can && fresh('heal') && P.heals > 0 && P.hp < 100) {
                fight.want.heal = -9;
                P.state = 'heal'; P.t = 0; P.healed = false;
                heroAnim('Interact', true, 1.3, true);
            } else if (moving && fight.mode !== 'dead') {
                P.state = 'run';
                P.x += mx * 4.7 * dt; P.z += mz * 4.7 * dt;
                P.yaw = Math.atan2(mx, mz);
                heroAnim(heroCls.walk, false, 1.75);
                heroSteps();
            } else {
                P.state = 'idle';
                P.yaw += angDiff(Math.atan2(fxd, fzd), P.yaw) * Math.min(1, dt * 8);
                heroAnim(heroCls.pose);
            }
        } else if (P.state === 'roll') {
            P.inv = P.t > 0.02 && P.t < 0.4;
            const v = P.t < 0.42 ? 9.4 : 2.5;
            P.x += P.dx * v * dt; P.z += P.dz * v * dt;
            if (P.t >= 0.56) P.state = 'idle';
        } else if (P.state === 'attack') {
            if (!P.struck && P.t >= 0.24) {
                P.struck = true;
                if (dist < REACH) hitBoss(4); else sfx.tick();
            }
            if (P.t >= 0.5) P.state = 'idle';
        } else if (P.state === 'heal') {
            if (!P.healed && P.t >= 0.65) { P.healed = true; P.heals--; P.hp = Math.min(100, P.hp + 45); sfx.kindle(); }
            if (P.t >= 0.95) P.state = 'idle';
        } else if (P.state === 'hurt') {
            const v = Math.max(0, 7 * (1 - P.t / 0.3));
            P.x += P.dx * v * dt; P.z += P.dz * v * dt;
            if (P.t >= 0.34) P.state = 'idle';
        }
        if (P.stWait <= 0) P.st = Math.min(100, P.st + 42 * dt);
        P.lie = toward(P.lie, P.state === 'dead' ? 1 : 0, 6, dt);

        // Stay on the roof, and out of the brazier and the Watcher itself
        const r = Math.hypot(P.x, P.z);
        if (r > ARENA) { P.x *= ARENA / r; P.z *= ARENA / r; }
        if (r < 1.6) { const k = 1.6 / (r || 1); P.x = (P.x || 0.01) * k; P.z *= k; }
        const d2 = Math.hypot(P.x - B.x, P.z - B.z);
        if (d2 < 1.7 && B.hidden < 0.5) { P.x = B.x + (P.x - B.x) / d2 * 1.7; P.z = B.z + (P.z - B.z) / d2 * 1.7; }
    }

    // ── The Watcher ──
    const LEAN = {      // where the scythe points, in the Watcher's own frame (x across, y up, z ahead)
        rest: [0.16, 1, 0], back: [-0.85, 0.55, -0.35], flat: [0.25, 0.12, 1], high: [0, 0.75, -0.65], down: [0, -0.05, 1], low: [0.35, 0.3, 1], up: [0, 1, 0.1]
    };
    function pose(name, rate = 6) { fight.leanTo.fromArray(LEAN[name]).normalize(); fight.leanRate = rate; }
    function pick(B, dist) {
        const opts = [];
        const add = (name, w) => { if (name !== B.last) opts.push([name, w]); };
        if (dist < 7.6) { add('sweep', 3); add('slam', 2); if (B.phase >= 2) add('scatter', 1.3); }
        if (dist >= 5) { add('lunge', 3); add('slam', 1); if (B.phase >= 2) add('volley', 3); }
        if (B.phase >= 3) add('beams', 2.2);
        let roll = Math.random() * opts.reduce((s, o) => s + o[1], 0);
        for (const [name, w] of opts) { roll -= w; if (roll <= 0) return name; }
        return 'sweep';
    }
    function updateBoss(dt) {
        const B = fight.b, P = fight.p;
        const sp = 1 + (B.phase - 1) * 0.14;                    // everything it does gets quicker each phase
        const dx = P.x - B.x, dz = P.z - B.z, dist = Math.hypot(dx, dz) || 1, aim = Math.atan2(dx, dz);
        const face = rate => { B.yaw += angDiff(aim, B.yaw) * Math.min(1, dt * rate); };
        const fwdX = Math.sin(B.yaw), fwdZ = Math.cos(B.yaw);
        const first = key => { if (B.did[key]) return false; B.did[key] = true; return true; };
        const begin = state => { B.state = state; B.t = 0; B.did = {}; B.last = state; };
        const rest = seconds => { if (B.t >= seconds) { B.state = 'idle'; B.t = 0; B.cool = (0.5 + Math.random() * 0.7) / sp; pose('rest', 4); B.twist = 0; B.tilt = 0; } };
        B.t += dt;
        B.flinch = toward(B.flinch, 0, 5, dt);
        fight.hot = 0;

        if (fight.mode !== 'play') {
            if (B.state !== 'down') { face(2); pose('rest', 3); B.twist = toward(B.twist, 0, 4, dt); B.tilt = toward(B.tilt, 0, 4, dt); }
            return;
        }
        if (B.state === 'idle') {
            face(3.2);
            B.twist = toward(B.twist, 0, 5, dt); B.tilt = toward(B.tilt, 0, 5, dt);
            if (dist > 6.5) { const v = 2.5 * sp; B.x += dx / dist * v * dt; B.z += dz / dist * v * dt; }
            B.cool -= dt;
            if (B.cool <= 0) begin(pick(B, dist));
        } else if (B.state === 'sweep') {
            // Draws the scythe back across its body, then cuts flat through everything in front of it
            const wind = (B.did.again ? 0.45 : 0.85) / sp, dir = B.did.again ? -1 : 1;
            if (B.t < wind) {
                if (B.t < wind * 0.65) face(4);
                pose('back', 7); B.twist = toward(B.twist, -0.8 * dir, 6, dt); fight.hot = B.t / wind;
                fx.sweep.visible = true; fx.sweep.material.opacity = 0.05 + 0.2 * B.t / wind;
                fx.sweep.position.set(B.x, 0.04, B.z); fx.sweep.rotation.z = B.yaw - Math.PI / 2;
            } else if (B.t < wind + 0.24) {
                pose('flat', 30); B.twist = toward(B.twist, 1.15 * dir, 22, dt); fight.hot = 1;
                if (first('cut' + dir)) { sfx.whoosh(); watcher.play('Sword_Attack', { fade: 0.08, once: true }); }
                if (B.t > wind + 0.08 && first('hit' + dir) && dist < 6.7 && Math.abs(angDiff(aim, B.yaw)) < 1.95) hitPlayer(28, B.x, B.z);
            } else {
                fx.sweep.visible = false;
                // In later phases it sometimes cuts straight back the other way
                if (B.phase >= 2 && !B.did.again && first('decide') && Math.random() < 0.45) { B.did = { again: true }; B.t = 0; return; }
                if (first('settle')) watcher.play('Sword_Idle', { fade: 0.5 });
                rest(wind + 0.24 + 1.05 / sp);
            }
        } else if (B.state === 'slam') {
            // Lifts the scythe overhead and brings it straight down; the stone answers with a ring that spreads outwards
            const wind = 0.95 / sp;
            if (B.t < wind) {
                if (B.t < wind * 0.7) face(5);
                pose('high', 6); B.tilt = toward(B.tilt, -0.18, 5, dt); fight.hot = B.t / wind;
                fx.slam.visible = true; fx.slam.material.opacity = 0.05 + 0.2 * B.t / wind;
                fx.slam.position.set(B.x, 0.04, B.z); fx.slam.rotation.z = B.yaw + Math.PI;
            } else if (B.t < wind + 0.2) {
                pose('down', 34); B.tilt = toward(B.tilt, 0.3, 20, dt); fight.hot = 1;
                if (B.t > wind + 0.1 && first('hit')) {
                    sfx.thud(); sfx.rumble(1.2); fight.shake = Math.max(fight.shake, 0.7);
                    const along = dx * fwdX + dz * fwdZ, across = Math.abs(dx * fwdZ - dz * fwdX);
                    if (along > 0 && along < 8.6 && across < 1.6) hitPlayer(34, B.x, B.z);
                    fight.wave = { x: B.x + fwdX * 5.6, z: B.z + fwdZ * 5.6, r: 0.5, hit: false };
                }
            } else { fx.slam.visible = false; rest(wind + 0.2 + 1.3 / sp); }
        } else if (B.state === 'lunge') {
            // Drops low, then crosses the roof in one stride
            const wind = 0.62 / sp;
            if (B.t < wind) { face(6); pose('low', 6); B.tilt = toward(B.tilt, 0.25, 6, dt); fight.hot = B.t / wind; B.tx = P.x; B.tz = P.z; }
            else if (B.t < wind + 0.38) {
                if (first('go')) { sfx.whoosh(); const d = Math.hypot(B.tx - B.x, B.tz - B.z) || 1, go = Math.max(0, d - 2.2); B.vx = (B.tx - B.x) / d * go / 0.38; B.vz = (B.tz - B.z) / d * go / 0.38; }
                B.x += B.vx * dt; B.z += B.vz * dt; fight.hot = 1; pose('flat', 20); B.twist = toward(B.twist, 0.9, 14, dt);
                if (first('hit') ? false : !B.did.landed && dist < 2.9) { B.did.landed = true; hitPlayer(24, B.x, B.z); }
            } else rest(wind + 0.38 + 0.95 / sp);
        } else if (B.state === 'volley') {
            // Some of its eyes leave its body and come looking
            const wind = 0.7 / sp, count = B.phase >= 3 ? 7 : 5;
            face(3); pose('up', 5);
            if (B.t >= wind) {
                const n = Math.min(count, Math.floor((B.t - wind) / 0.22) + 1);
                while (B.n < n) {
                    B.n++;
                    const o = fx.orbs.find(q => !q.live);
                    if (!o) break;
                    o.live = true; o.age = 0;
                    o.p.set(B.x + (Math.random() - 0.5) * 2, 0.9 * fight.size + Math.random() * 1.5, B.z);
                    o.v.set(P.x - o.p.x, 1.2 - o.p.y, P.z - o.p.z).normalize().multiplyScalar(11.5 * sp);
                    sfx.eye(1, 0);
                }
                if (B.t >= wind + count * 0.22) { B.n = 0; rest(wind + count * 0.22 + 1 / sp); }
            } else B.n = 0;
        } else if (B.state === 'scatter') {
            // Comes apart into the dark, and pulls itself together behind the visitor
            if (B.t < 0.5) B.hidden = B.t / 0.5;
            else if (B.t < 0.95) {
                B.hidden = 1;
                if (first('move')) {
                    sfx.whoosh();
                    // Behind them, as seen from where it was; pulled in if that would be off the roof
                    let nx = P.x + dx / dist * 5.5, nz = P.z + dz / dist * 5.5;
                    const r = Math.hypot(nx, nz);
                    if (r > ARENA - 1.5) { nx *= (ARENA - 1.5) / r; nz *= (ARENA - 1.5) / r; }
                    if (Math.hypot(nx, nz) < 3) { nx = P.x - dx / dist * 5.5; nz = P.z - dz / dist * 5.5; }
                    B.x = nx; B.z = nz; B.yaw = Math.atan2(P.x - nx, P.z - nz);
                }
            } else if (B.t < 1.4) B.hidden = 1 - (B.t - 0.95) / 0.45;
            else { B.hidden = 0; begin('sweep'); B.did = { again: true }; B.last = 'scatter'; }
        } else if (B.state === 'beams') {
            // Calls on the eyes still out in the dark; where they look, the stone burns
            const wind = 0.8 / sp, count = 6;
            face(2); pose('up', 5); B.tilt = toward(B.tilt, -0.15, 4, dt);
            if (B.t >= wind) {
                const n = Math.min(count, Math.floor((B.t - wind) / 0.42) + 1);
                while (B.n < n) {
                    B.n++;
                    const b = fx.beams.find(q => q.t < 0);
                    if (!b) break;
                    // Mostly where the visitor is; sometimes where they are heading
                    const lead = Math.random() < 0.4 ? 1.6 : 0;
                    b.x = P.x + (P.state === 'run' ? Math.sin(P.yaw) * lead : 0); b.z = P.z + (P.state === 'run' ? Math.cos(P.yaw) * lead : 0);
                    b.t = 0; b.hit = false;
                    sfx.eye(1, 0);
                }
                if (B.t >= wind + count * 0.42) { B.n = 0; rest(wind + count * 0.42 + 1.5 / sp); }
            } else B.n = 0;
        } else if (B.state === 'roar') {
            // Losing a third of itself: it throws the visitor back, and comes on harder
            pose('up', 6); B.tilt = toward(B.tilt, -0.25, 5, dt); B.twist = toward(B.twist, 0, 5, dt); B.hidden = 0;
            fx.sweep.visible = fx.slam.visible = false;
            if (first('roar')) {
                sfx.roar(2.6); sfx.rumble(2.4); fight.shake = 1;
                line(B.phase === 2 ? 'LOOK AT ME.' : 'DO NOT LOOK AWAY.', 2.4);
                fight.crownTo = B.phase === 2 ? 1.35 : 1.7;
                for (const o of fx.orbs) { o.live = false; }
                for (const b of fx.beams) b.t = -1;
            }
            if (B.t < 0.5 && dist < 8) { P.x += dx / dist * 16 * dt; P.z += dz / dist * 16 * dt; }
            rest(2.4);
        }
        // Keep it on the roof and off the brazier
        const r = Math.hypot(B.x, B.z);
        if (r > ARENA - 1) { B.x *= (ARENA - 1) / r; B.z *= (ARENA - 1) / r; }
        if (r < 2.4) { const k = 2.4 / (r || 1); B.x = (B.x || 0.01) * k; B.z *= k; }
    }

    // ── Things in the air and on the ground ──
    function updateHazards(dt) {
        const P = fight.p, B = fight.b;
        if (fight.wave) {
            const w = fight.wave;
            w.r += 9.5 * dt;
            fx.wave.visible = true;
            fx.wave.position.set(w.x, 0.05, w.z);
            fx.wave.scale.setScalar(w.r);
            fx.wave.material.opacity = 0.75 * (1 - w.r / 11);
            if (!w.hit && Math.abs(Math.hypot(P.x - w.x, P.z - w.z) - w.r) < 0.75) w.hit = hitPlayer(16, w.x, w.z) || P.inv;
            if (w.r > 11) { fight.wave = null; fx.wave.visible = false; }
        }
        for (const o of fx.orbs) {
            o.sp.visible = o.live;
            if (!o.live) continue;
            o.age += dt;
            // They bend towards the visitor for a moment, then fly straight
            if (o.age < 0.9) {
                tmp.set(P.x - o.p.x, 1.2 - o.p.y, P.z - o.p.z).normalize().multiplyScalar(o.v.length());
                o.v.lerp(tmp, Math.min(1, dt * 2.2));
            }
            o.p.addScaledVector(o.v, dt);
            o.sp.position.copy(o.p);
            if (Math.hypot(o.p.x - P.x, o.p.z - P.z) < 0.85 && o.p.y < 2.6) { if (hitPlayer(11, o.p.x, o.p.z) || !P.inv) o.live = false; }
            if (o.age > 3 || o.p.y < 0.1) o.live = false;
        }
        for (const b of fx.beams) {
            if (b.t < 0) { b.mark.visible = b.pillar.visible = false; continue; }
            b.t += dt;
            b.mark.visible = true;
            b.mark.position.set(b.x, 0.045, b.z);
            b.pillar.position.set(b.x, 10, b.z);
            if (b.t < 0.85) { b.mark.material.opacity = 0.1 + 0.3 * b.t / 0.85; b.pillar.visible = false; }
            else {
                b.pillar.visible = true;
                const k = 1 - (b.t - 0.85) / 0.4;
                b.pillar.material.opacity = Math.max(0, k);
                b.mark.material.opacity = Math.max(0, k) * 0.8;
                if (!b.hit) { b.hit = true; sfx.thud(); if (Math.hypot(P.x - b.x, P.z - b.z) < 2.1) hitPlayer(22, b.x, b.z); }
                if (k <= 0) b.t = -1;
            }
        }
        fx.spark.material.opacity = Math.max(0, fx.spark.material.opacity - dt * 6);
    }

    // ── A stand-in player for testing: circles, strikes in the openings, rolls through what it can ──
    function botThink() {
        const P = fight.p, B = fight.b, dist = Math.hypot(P.x - B.x, P.z - B.z);
        const danger = (['sweep', 'slam', 'lunge'].includes(B.state) && fight.hot > 0.82) || (fight.wave && Math.abs(Math.hypot(P.x - fight.wave.x, P.z - fight.wave.z) - fight.wave.r) < 1.6)
            || fx.orbs.some(o => o.live && Math.hypot(o.p.x - P.x, o.p.z - P.z) < 2.2) || fx.beams.some(b => b.t > 0.55 && b.t < 0.85 && Math.hypot(P.x - b.x, P.z - b.z) < 2.3);
        if (danger && fight.botSkill > Math.random() * 0.999) press('roll');
        else if (P.hp < 45 && P.heals > 0 && fight.hot < 0.2) press('heal');
        else if (dist < REACH - 0.3 && fight.hot < 0.3 && P.st > 30) press('attack');
        return [B.state === 'beams' ? 1 : 0.35, dist > REACH - 0.8 ? 1 : 0];
    }

    function startFight() {
        resetFight();
        fight.on = true;
        document.body.classList.add('fighting');
        $('phaseTitle').textContent = 'THE WATCHER';
        $('phaseHint').innerHTML = touch
            ? 'Left thumb to move. <b>HIT</b> to strike, <b>ROLL</b> to dodge through an attack, <b>✚</b> to heal.'
            : '<b>W A S D</b> move &nbsp; <b>J</b> or <b>CLICK</b> strike<br><b>SPACE</b> roll through an attack &nbsp; <b>E</b> heal';
        $('phase').hidden = false;
        $('me').hidden = false;
        $('pad').hidden = !touch;
        sfx.thud();
    }
    function abortFight() { fight.rank = '—'; fight.done = true; }

    // Everything the fight moves, every frame
    function fightFrame(dt) {
        const C = SETS.top.position, P = fight.p, B = fight.b;
        fight.T += dt;
        fight.modeT += dt;
        if (fight.mode === 'intro') {
            // The controls stay up for a moment, or until the visitor does something
            if (fight.modeT > 4 || (fight.modeT > 1 && (keys.size || stick.id !== null || fight.T - Math.max(fight.want.attack, fight.want.roll) < 0.3 || fight.bot))) { $('phase').hidden = true; setMode('play'); }
        } else if (fight.mode === 'play') fight.time += dt;
        else if (fight.mode === 'dead') {
            if (fight.modeT > 0.9) $('fell').hidden = false;
            if (fight.modeT > 2.4) fadeTo(true);
            if (fight.modeT > 3.2) {
                // Back to the start of this phase, with one more ember than last time
                const deaths = fight.deaths, hits = fight.hits, time = fight.time, phase = B.phase, cp = fight.checkpoint, bot = fight.bot, skill = fight.botSkill;
                resetFight();
                Object.assign(fight, { on: true, deaths, hits, time, checkpoint: cp, bot, botSkill: skill, crownTo: phase === 1 ? 1 : phase === 2 ? 1.35 : 1.7 });
                fight.b.hp = fight.b.shown = cp; fight.b.phase = phase;
                fight.p.heals = fight.p.maxHeals = Math.min(6, 3 + deaths);
                $('me').hidden = false; $('pad').hidden = !touch;
                watcher.play('Sword_Idle', { fade: 0 });
                setMode('play');
                camSnap = true;
                fadeTo(false);
                return;
            }
        } else if (fight.mode === 'won') {
            if (fight.modeT > 1 && fight.modeT < 4) line('...', 1);
            if (fight.modeT > 5 && !fight.done) {
                const d = fight.deaths, hh = fight.hits;
                fight.rank = d === 0 && hh <= 2 ? 'S' : d === 0 ? 'A' : d <= 1 ? 'B' : d <= 3 ? 'C' : 'D';
                fight.done = true;
            }
        }

        updatePlayer(dt);
        updateBoss(dt);
        updateHazards(dt);

        // ── The Watcher's body ──
        const won = fight.mode === 'won';
        fight.size = toward(fight.size, won ? BODY + 0.4 : BEAST + (B.phase - 1) * 0.2, 1.2, dt);
        const size = fight.size;
        watcher.root.position.set(B.x, 0, B.z);
        watcher.root.scale.setScalar(size);
        watcher.root.rotation.set(B.tilt - B.flinch * 0.1, B.yaw + B.twist, 0);
        // Coming apart: the body sinks out of sight and only the eyes are left, flung wide
        top.clip.constant = B.hidden > 0 ? (1 - B.hidden) * size * 2 : 99;
        armReach = toward(armReach, won ? 1 : 1.32, 1.5, dt);
        fight.crown = toward(fight.crown, won ? 0 : fight.crownTo, 1.6, dt);
        if (bones.spine_03) {
            bones.spine_03.getWorldPosition(tmp).sub(C);
            const back = 0.12 * size;
            top.crown.position.set(tmp.x - Math.sin(B.yaw) * back, tmp.y, tmp.z - Math.cos(B.yaw) * back);
            top.crown.rotation.y = B.yaw;
            top.crown.scale.setScalar(Math.max(0.001, fight.crown * size * (1 - B.hidden)));
        }
        // Its eyes are its health: they shut as it loses
        B.shown = toward(B.shown, B.hp, 6, dt);
        $('bossFill').style.width = B.shown + '%';
        const sy = Math.sin(B.yaw + B.twist), cy = Math.cos(B.yaw + B.twist);
        top.void.forEach((e, i) => {
            const u = e.userData;
            bones[u.bone].getWorldPosition(tmp).sub(C);
            // The offset turns with the body, and flies outwards while it is scattered
            const ox = u.on.x * size, oz = u.on.z * size, spread = B.hidden * (2 + (i % 5));
            e.position.set(tmp.x + ox * cy + oz * sy + Math.cos(i * 2.4) * spread, tmp.y + u.on.y * size + B.hidden * (1.5 + Math.sin(i) * 2), tmp.z - ox * sy + oz * cy + Math.sin(i * 2.4) * spread);
            e.scale.setScalar(0.2 * size);
            e.quaternion.copy(camera.quaternion);
            const want = i / top.void.length < B.hp / 100 - 0.02 ? 0.8 + 0.2 * Math.sin(clockT * 7 + u.goAt * 9) : 0;
            setOpen(e, toward(u.open, want * (1 - B.flinch * 0.7), 8, dt));
        });
        if (bones.Head) {
            bones.Head.getWorldPosition(tmp).sub(C);
            top.gaze.position.set(tmp.x + sy * 0.11 * size, tmp.y + 0.05 * size, tmp.z + cy * 0.11 * size);
            top.gaze.scale.setScalar(0.87 * size);
            top.gaze.quaternion.copy(camera.quaternion);
            top.glow.position.set(tmp.x + sy * 1.4, tmp.y - 0.2, tmp.z + cy * 1.4);
        }
        fight.gaze = toward(fight.gaze, won ? 0.35 : 1 - B.hidden, 3, dt);
        setOpen(top.gaze, fight.gaze * (0.92 + Math.sin(clockT * 9) * 0.08));
        top.glow.intensity = (4 + B.phase * 2.5) * fight.gaze + B.flinch * 6 + fight.hot * 5;
        top.aura.scale.set(4.4 * size, 4.2 * size, 1);
        top.aura.position.set(B.x - sy * 0.8, 1.15 * size, B.z - cy * 0.8);
        top.aura.material.opacity = (0.4 + B.phase * 0.17) * fight.gaze;

        // The scythe: its edge runs white while a blow is coming
        fight.scythe = toward(fight.scythe, won ? 0 : 1 - B.hidden, 6, dt);
        fight.lean.lerp(fight.leanTo, 1 - Math.exp(-fight.leanRate * dt)).normalize();
        top.scythe.visible = fight.scythe > 0.02;
        if (top.scythe.visible && bones.hand_r) {
            const L = fight.lean;
            top.lean.set(L.x * cy + L.z * sy, L.y, -L.x * sy + L.z * cy);
            bones.hand_r.getWorldPosition(tmp).sub(C);
            top.scythe.quaternion.setFromUnitVectors(tmp2.set(0, 1, 0), top.lean);
            top.scythe.position.copy(tmp).addScaledVector(top.lean, -GRIP * size);
            top.scythe.scale.setScalar(fight.scythe * size);
            const heat = Math.max(fight.hot, B.phase === 3 ? 0.35 : 0);
            top.edge.material.color.setRGB(1, 0.16 + heat * 0.84, 0.1 + heat * 0.9);
        }

        // ── The visitor ──
        hero.root.position.set(C.x + P.x, 0.02 + P.lie * 0.12, P.z);
        hero.root.rotation.set(-P.lie * 1.45, P.yaw, 0);
        $('meHp').style.width = P.hp + '%';
        $('meSt').style.width = P.st + '%';
        $('meHeals').textContent = '✚'.repeat(P.heals) + '·'.repeat(Math.max(0, P.maxHeals - P.heals));
        $('btnHeal').style.opacity = P.heals ? 1 : 0.35;

        // ── Camera: locked on. It sits behind the visitor on the line from the Watcher, and backs off when they are close ──
        fight.shake = toward(fight.shake, 0, 5, dt);
        let bx = P.x - B.x, bz = P.z - B.z;
        const d = Math.hypot(bx, bz) || 1;
        bx /= d; bz /= d;
        const back = 5.4 + Math.max(0, 7 - d) * 0.55, jolt = fight.shake * 0.07;
        camTo.set(C.x + P.x + bx * back + bz * 1.1 + Math.sin(clockT * 47) * jolt, 2.7 + Math.max(0, 7 - d) * 0.22 + Math.cos(clockT * 53) * jolt, P.z + bz * back - bx * 1.1);
        look.set(C.x + mix(P.x, B.x, 0.72), mix(1.4, 0.62 * size, 0.72), mix(P.z, B.z, 0.72));
    }

    // The fight's last word: how it went
    const RANKS = ['—', 'D', 'C', 'B', 'A', 'S'];
    function showResult() {
        const r = fight.rank || '—', s = Math.round(fight.time);
        $('rank').textContent = r;
        $('endTitle').textContent = r === '—' ? 'THE WATCHER WAITS' : 'THE WATCHER FALLS';
        $('endLine').textContent = r === '—' ? 'You stepped past the fight.' : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} · fell ${fight.deaths} time${fight.deaths === 1 ? '' : 's'} · struck ${fight.hits} time${fight.hits === 1 ? '' : 's'}`;
        for (const id of ['me', 'pad', 'fell', 'phase']) $(id).hidden = true;
        if (RANKS.indexOf(r) > RANKS.indexOf(store.get('aumritash-rank') || '—')) store.set('aumritash-rank', r);
        track('fight', `${r} · ${s}s · ${fight.deaths} deaths · ${fight.hits} hits`);
    }

    // ── Running the shots ──
    let shot = -1, playing = false, cutting = false;
    function startShot(i) {
        shot = i;
        fired = new Set();
        cutting = false;
        canWalk = walking = false;
        hero.play(heroCls.walkIdle, { fade: 0 });
        SHOTS[i].enter();
        camSnap = true;
        fadeTo(false);
    }
    function cut(then) {
        if (cutting) return;
        cutting = true;
        walk(false);
        fadeTo(true);
        setTimeout(then, 650);
    }
    function finished() {
        // The fight is over (or was stepped past): show how it went
        playing = false;
        fight.on = false;
        $('skip').hidden = true;
        showResult();
        $('end').hidden = false;
    }
    function play() {
        $('start').hidden = true;
        $('end').hidden = true;
        $('skip').hidden = false;
        sfx.setDrone(false);
        resetFight();
        hero.mixer.timeScale = 1;
        hero.root.rotation.set(0, Math.PI, 0);
        caption('');
        playing = true;
        startShot(0);
    }
    $('climb').onclick = () => { sfx.unlock(); track('tower', 'climb'); play(); };
    $('again').onclick = () => { sfx.unlock(); fadeTo(true); setTimeout(play, 500); };
    $('skip').onclick = () => {
        if (!playing || cutting) return;
        const S = SHOTS[shot];
        if (S.name === 'fight') { S.finish(); return; }
        cut(() => {
            if (S.finish) { S.finish(); cutting = false; camSnap = true; fadeTo(false); }
            else startShot(shot + 1);
        });
    };

    const clock = new THREE.Clock();
    function frame(manual) {
        if (manual !== true) requestAnimationFrame(frame);
        const dt = Math.min(0.1, clock.getDelta());
        clockT += dt;
        if (playing && shot >= 0 && !cutting) {
            const done = SHOTS[shot].update(dt);
            if (done) {
                const next = SHOTS[shot + 1];
                if (!next) finished();
                else if (next.seamless) { shot++; fired = new Set(); next.enter(); }
                else cut(() => startShot(shot + 1));
            }
        }
        if (hero) {
            hero.mixer.update(dt);
            watcher.mixer.update(dt);
            // Bone tweaks made by a shot have to be redone after the animation has had its say
            for (const n of ['upperarm_l', 'upperarm_r', 'lowerarm_l', 'lowerarm_r']) if (bones[n]) bones[n].scale.setScalar(armReach);
            if (walking) heroSteps();
            heroLight.position.copy(hero.root.position).add(tmp.set(-0.8, 3, 1.6));
        }
        // Ease the camera towards where the shot wants it (or jump there on a cut)
        const k = camSnap ? 1 : 1 - Math.pow(fight.on ? 0.0008 : 0.03, dt);
        camera.position.lerp(camTo, k);
        lookNow.lerp(look, k);
        camera.lookAt(lookNow);
        camSnap = false;
        renderer.render(world, camera);
    }

    // ── Sound toggle (shared with the flame) ──
    let soundOn = store.get('aumritash-music') !== 'off';
    function renderSound() {
        $('sound').textContent = soundOn ? '♪ Sound on' : '♪ Sound off';
        $('sound').setAttribute('aria-pressed', String(soundOn));
    }
    sfx.setMuted(!soundOn);
    $('sound').onclick = () => { soundOn = !soundOn; store.set('aumritash-music', soundOn ? 'on' : 'off'); sfx.setMuted(!soundOn); if (soundOn) sfx.unlock(); renderSound(); };
    document.addEventListener('visibilitychange', () => sfx.pause(document.hidden));
    addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

    // ── Boot ──
    (async () => {
        try { await loadCast(); }
        catch (e) { $('loading').textContent = 'SOMETHING WENT WRONG · RELOAD'; console.error(e); return; }
        hero.root.position.set(0, 0, 11);
        camTo.set(1.3, 2.3, 16);
        look.set(0, 2, 0);
        $('loading').hidden = true;
        $('start').hidden = false;
        $('sound').hidden = false;
        renderSound();
        requestAnimationFrame(frame);
    })();

    // ?debug: drive the scene by hand when the tab can't animate
    if (location.search.includes('debug')) {
        window.__scene = {
            THREE, world, camera,
            state: () => ({ shot: shot >= 0 ? SHOTS[shot].name : null, phase: shot >= 0 ? SHOTS[shot].phase : null, t: shot >= 0 ? +(SHOTS[shot].t || 0).toFixed(2) : 0, playing, walking, sfx: sfx.state() }),
            goto(i) { playing = true; $('start').hidden = true; $('end').hidden = true; startShot(i); },
            hold: on => (on ? held.add('debug') : held.delete('debug')),
            fight,
            bot(on = true, skill = 0.9) { fight.bot = on; fight.botSkill = skill; },
            // Like step, but lets the fight's script run between frames
            async run(seconds, fps = 30) {
                const real = clock.getDelta;
                for (let i = 0; i < seconds * fps; i++) { clock.getDelta = () => 1 / fps; frame(true); clock.getDelta = real; await new Promise(r => setTimeout(r, 0)); }
            },
            step(seconds, fps = 30) {
                const real = clock.getDelta;
                clock.getDelta = () => 1 / fps;
                for (let i = 0; i < seconds * fps; i++) frame(true);
                clock.getDelta = real;
            }
        };
    }
    </script>
</body>
</html>
