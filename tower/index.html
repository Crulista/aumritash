<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../assets/dead.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>The Tower - Aumritash Maitra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/chapter.css">
    <script type="importmap">
        { "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        } }
    </script>
    <style>
        html, body { height: 100%; overflow: hidden; }
        body::before { display: none; }
        body { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; background: #000; }

        /* Same PS1-ish view as the flame: rendered small, blown up with hard pixels */
        #view { position: fixed; inset: 0; width: 100% !important; height: 100% !important; image-rendering: pixelated; image-rendering: crisp-edges; }

        [hidden] { display: none !important; }

        .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }

        .caption {
            position: fixed;
            top: 13%;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--pixel);
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            letter-spacing: 0.2em;
            color: rgba(232, 226, 218, 0.8);
            text-shadow: 0 2px 0 #000;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.6s;
            padding: 0 1rem;
        }

        .hint {
            position: fixed;
            bottom: 7%;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--pixel);
            font-size: 1.3rem;
            letter-spacing: 0.2em;
            color: var(--dim);
            text-shadow: 0 2px 0 #000;
            z-index: 5;
            pointer-events: none;
            animation: breathe 2.4s ease-in-out infinite;
        }
        @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

        /* The Watcher's words: big, red, typed out one letter at a time */
        .say {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 16%;
            text-align: center;
            font-family: var(--pixel);
            font-size: clamp(2.4rem, 8vw, 5rem);
            line-height: 1;
            letter-spacing: 0.16em;
            color: var(--red);
            text-shadow: 0 0 24px rgba(255, 26, 26, 0.6), 0 3px 0 #000;
            z-index: 6;
            pointer-events: none;
            padding: 0 1rem;
            overflow-wrap: anywhere;
        }

        /* Its name and health, once it has taken its true shape */
        .boss { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); width: min(760px, 88vw); z-index: 6; pointer-events: none; }
        .boss-name { font-family: var(--pixel); font-size: clamp(1.5rem, 4.5vw, 2.2rem); letter-spacing: 0.22em; color: var(--text); text-shadow: 0 2px 0 #000; margin-bottom: 0.3rem; }
        .boss-bar { height: 14px; border: 2px solid rgba(232, 226, 218, 0.75); background: rgba(0, 0, 0, 0.6); }
        .boss-bar i { display: block; height: 100%; width: 0; background: linear-gradient(to bottom, #ff3a2a, #a00d0d); }

        /* ── The fight ── */
        body.fighting .say { bottom: auto; top: 30%; font-size: clamp(1.6rem, 5vw, 3rem); }
        body.fighting .sound { bottom: auto; top: 1.35rem; left: 50%; transform: translateX(-50%); }
        body.fighting .hint { display: none; }

        /* The visitor's own bars, top left: health, stamina, and how many embers they have left to heal with */
        .me { position: fixed; left: 1.5rem; top: 4.4rem; width: min(300px, 46vw); z-index: 6; pointer-events: none; }
        .bar { position: relative; height: 12px; border: 2px solid rgba(232, 226, 218, 0.75); background: rgba(0, 0, 0, 0.6); margin-bottom: 4px; }
        .bar i { position: absolute; left: 0; top: 0; display: block; height: 100%; width: 100%; }
        .bar.hp i { background: linear-gradient(to bottom, #d8402c, #8a1410); }
        .bar.hp i.lag { background: #e8d8b0; opacity: 0.55; }
        .bar.st { height: 8px; width: 82%; }
        .bar.st i { background: linear-gradient(to bottom, #7fbf5a, #3f7a2c); }
        /* Out of stamina: the bar blinks red */
        .bar.st.empty { animation: empty 0.3s steps(2) infinite; }
        @keyframes empty { 0% { border-color: #ff3a2a; background: rgba(120, 0, 0, 0.7); } 100% { border-color: rgba(232, 226, 218, 0.75); } }
        .me-row { display: flex; align-items: center; gap: 0.7rem; }
        .me p { font-family: var(--pixel); font-size: 1.2rem; letter-spacing: 0.12em; color: #ffcf8a; text-shadow: 0 2px 0 #000; }
        /* The ember art's meter: a little coal that fills, and burns when it is ready */
        .art { position: relative; width: 74px; height: 8px; border: 2px solid rgba(255, 170, 90, 0.6); background: rgba(0, 0, 0, 0.6); transform: skewX(-20deg); }
        .art i { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: linear-gradient(to bottom, #ffb050, #b4400c); }
        .art.full { border-color: #ffd9a0; box-shadow: 0 0 10px rgba(255, 140, 50, 0.9); animation: coal 0.6s steps(3) infinite alternate; }
        .art.full::after { content: 'R'; position: absolute; left: 100%; top: -9px; margin-left: 8px; transform: skewX(20deg); font-family: var(--pixel); font-size: 1rem; color: #ffd9a0; text-shadow: 0 0 8px #ff8a30; }
        @media (hover: none) { .art.full::after { content: ''; } }
        @keyframes coal { to { box-shadow: 0 0 18px rgba(255, 170, 70, 1); } }
        /* Low health: the edges of the screen pulse red */
        .me-low { position: fixed; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(140, 0, 0, 0.75)); }
        /* The ember art's cut-in: a burning band across the screen with the visitor's name */
        .cutin { position: fixed; left: -5vw; right: -5vw; top: 56%; padding: 0.35rem 0; display: flex; justify-content: center; align-items: baseline; gap: 1.2rem; font-family: var(--pixel); letter-spacing: 0.3em; color: #fff2d8; text-shadow: 0 0 12px #ff7a20, 0 2px 0 #000; background: linear-gradient(90deg, transparent, rgba(150, 40, 0, 0.85) 18%, rgba(255, 120, 40, 0.9) 50%, rgba(150, 40, 0, 0.85) 82%, transparent); transform: skewY(-4deg) scaleY(0); opacity: 0; pointer-events: none; }
        .cutin b { font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: normal; }
        .cutin span { font-size: clamp(1rem, 3vw, 1.4rem); color: #ffd9a0; }
        .cutin.on { animation: cutin 0.95s steps(10) forwards; }
        @keyframes cutin { 0% { opacity: 1; transform: skewY(-4deg) scaleY(0) translateX(-30%); } 15% { opacity: 1; transform: skewY(-4deg) scaleY(1) translateX(0); } 75% { opacity: 1; transform: skewY(-4deg) scaleY(1) translateX(3%); } 100% { opacity: 0; transform: skewY(-4deg) scaleY(0.2) translateX(30%); } }
        /* The boss's posture: a thin bar under its health that fills from the middle out, white-hot when it is about to break */
        .boss-post { height: 6px; width: 60%; margin: 4px auto 0; border: 1px solid rgba(232, 226, 218, 0.45); background: rgba(0, 0, 0, 0.55); display: flex; justify-content: center; }
        .boss-post i { display: block; height: 100%; width: 0; background: linear-gradient(to bottom, #f0d890, #b08a3a); }
        .boss-post.hot i { background: linear-gradient(to bottom, #fffbe8, #ffc860); box-shadow: 0 0 8px #ffd27a; }
        .boss-post.open { animation: empty 0.25s steps(2) infinite; }

        .phase { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.7rem; padding: 1.5rem; text-align: center; background: rgba(0, 0, 0, 0.72); pointer-events: none; }
        .phase-title { font-family: var(--pixel); font-size: clamp(1.9rem, 6.5vw, 3.2rem); letter-spacing: 0.2em; color: #ffd9a0; text-shadow: 0 0 18px rgba(255, 150, 60, 0.45); }
        .phase-hint { color: var(--text); max-width: 30rem; line-height: 1.8; }
        .phase-hint b { font-family: var(--pixel); font-size: 1.15rem; letter-spacing: 0.1em; color: #ffcf8a; border: 1px solid rgba(255, 207, 138, 0.6); padding: 0 0.4rem; }

        /* Touch controls: a stick wherever the left thumb lands (left part of the screen), a fan of buttons under the
           right thumb: HIT in the corner, ROLL and HEAVY either side of it, GUARD between, the rarer ones above */
        .pad { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
        .stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid rgba(232, 226, 218, 0.35); border-radius: 50%; display: none; }
        .stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(232, 226, 218, 0.4); }
        .pad button { position: absolute; pointer-events: auto; padding: 0; font-family: var(--pixel); letter-spacing: 0.06em; color: var(--text); background: rgba(0, 0, 0, 0.55); border: 2px solid rgba(232, 226, 218, 0.7); border-radius: 50%; touch-action: none; }
        .pad button:active, .pad button.held { background: var(--text); color: #000; }
        #btnAtk { right: 14px; bottom: 24px; width: 92px; height: 92px; font-size: 1.3rem; border-color: #ffcf8a; color: #ffe2b8; }
        #btnRoll { right: 118px; bottom: 12px; width: 74px; height: 74px; font-size: 1.1rem; }
        #btnHeavy { right: 22px; bottom: 128px; width: 74px; height: 74px; font-size: 1rem; border-color: #ffcf8a; color: #ffe2b8; }
        #btnGuard { right: 116px; bottom: 100px; width: 70px; height: 70px; font-size: 1rem; }
        #btnHeal { right: 124px; bottom: 186px; width: 58px; height: 58px; font-size: 1.4rem; color: #ffcf8a; }
        #btnArt { right: 30px; bottom: 218px; width: 60px; height: 60px; font-size: 1.05rem; color: #fff2d8; border-color: #ffb050; background: rgba(140, 50, 0, 0.7); box-shadow: 0 0 14px rgba(255, 140, 50, 0.9); }
        #btnLock { right: 26px; bottom: 296px; width: 58px; height: 34px; border-radius: 17px; font-size: 0.9rem; }
        #btnLock.off { border-style: dashed; color: var(--dim); }

        /* Cut-scenes play between black bars */
        .bars::before, .bars::after { content: ''; position: fixed; left: 0; right: 0; height: 11vh; background: #000; z-index: 4; transition: transform 0.7s; pointer-events: none; }
        .bars::before { top: 0; transform: translateY(-100%); }
        .bars::after { bottom: 0; transform: translateY(100%); }
        body.cine .bars::before, body.cine .bars::after { transform: none; }
        body.cine .me, body.cine .pad, body.cine .boss { opacity: 0; }
        .me, .boss { transition: opacity 0.5s; }

        .fell { position: fixed; left: 0; right: 0; top: 42%; z-index: 9; text-align: center; font-family: var(--pixel); font-size: clamp(3rem, 12vw, 6rem); letter-spacing: 0.25em; color: var(--red); text-shadow: 0 0 30px rgba(255, 26, 26, 0.6), 0 4px 0 #000; background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.8) 25%, rgba(0, 0, 0, 0.8) 75%, transparent); padding: 1rem 0; pointer-events: none; }

        .hurt { position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(255, 20, 20, 0.55)); }
        .hurt.on { animation: hurt 0.5s steps(5); }
        @keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }

        .rank { font-family: var(--pixel); font-size: clamp(5rem, 22vw, 9rem); line-height: 0.9; color: #ffd9a0; text-shadow: 0 0 30px rgba(255, 150, 60, 0.5); }

        .gate {
            position: fixed;
            inset: 0;
            z-index: 22;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.1rem;
            padding: 1.5rem;
            text-align: center;
            background: #000;
        }
        .gate-title { font-family: var(--pixel); font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: 0.2em; color: var(--red); text-shadow: 0 0 22px rgba(255, 26, 26, 0.5); }
        .gate-line { color: var(--dim); max-width: 26rem; }
        .gate .btn { font-size: 1.7rem; padding: 0.5rem 2rem 0.4rem; }
        .gate.end { background: rgba(0, 0, 0, 0.8); z-index: 12; gap: 0.7rem; }
        .gate.end .gate-title { color: #ffd9a0; text-shadow: none; font-size: clamp(1.5rem, 5vw, 2.2rem); }
        .gate.end .btn { font-size: 1.3rem; padding: 0.4rem 1.2rem 0.3rem; }

        /* The end: what is left of it speaks in a paler voice; two choices; the pieces of the page falling away */
        .say.soft { color: #d8cfc2; text-shadow: 0 0 18px rgba(255, 200, 140, 0.25), 0 3px 0 #000; font-size: clamp(1.5rem, 4.6vw, 2.7rem) !important; top: auto !important; bottom: 24% !important; }
        .choice { position: fixed; left: 0; right: 0; bottom: 15%; z-index: 12; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1.2rem 2.4rem; padding: 0 1rem; text-align: center; animation: rise 1.2s steps(8) both; }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
        .choice .btn { font-size: 1.6rem; padding: 0.5rem 1.6rem 0.4rem; background: rgba(0, 0, 0, 0.6); }
        .choice .keep { border-color: #ffcf8a; color: #ffe2b8; }
        .choice .keep:hover, .choice .keep:focus-visible { background: #ffcf8a; color: #000; box-shadow: 0 0 22px rgba(255, 170, 80, 0.6); }
        .choice .kill { border-color: #8a8480; color: #b8b0a8; }
        .choice .kill:hover, .choice .kill:focus-visible { background: #000; border-color: var(--red); color: var(--red); }
        .choice p { flex-basis: 100%; font-family: var(--pixel); font-size: 1.3rem; letter-spacing: 0.12em; color: var(--text); text-shadow: 0 2px 0 #000; }
        .dropped { animation: dropped 1.3s cubic-bezier(0.5, 0, 1, 0.6) forwards; transform-origin: 20% 50%; z-index: 41 !important; }
        @keyframes dropped { to { transform: translateY(120vh) rotate(24deg); } }
        .flash { position: fixed; inset: 0; z-index: 19; opacity: 0; pointer-events: none; }
        .board { list-style: none; font-family: var(--pixel); font-size: 1.15rem; letter-spacing: 0.1em; color: var(--dim); line-height: 1.35; }
        .board::before { content: 'BEST CLIMBS'; display: block; color: #ffd9a0; letter-spacing: 0.2em; margin-bottom: 0.2rem; }
        .board .you { color: #ffe2b8; }

        .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--pixel); font-size: 1.6rem; letter-spacing: 0.3em; color: var(--dim); z-index: 23; background: #000; }

        .sound { position: fixed; left: 1.5rem; bottom: 1.8rem; z-index: 10; }
        .sound[aria-pressed="false"] { border-style: dashed; border-color: var(--red); color: var(--red); }

        .fade { position: fixed; inset: 0; background: #000; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.6s steps(5); }
        .fade.on { opacity: 1; }

        @media (max-width: 760px) {
            .caption { top: 11%; }
            .hint { font-size: 1.05rem; bottom: 11%; }
            .sound { left: 1rem; bottom: 1rem; }
            .boss { bottom: 12%; }
            .say { bottom: 21%; }
            /* On a phone the boss bar goes up top too, out from under the thumbs */
            body.fighting .boss { bottom: auto; top: 8.2rem; }
            body.fighting .boss-name { font-size: 1.3rem; margin-bottom: 0.15rem; }
            body.fighting .sound { left: auto; right: 1rem; top: 4.3rem; transform: none; font-size: 0.9rem; padding: 0.15rem 0.5rem 0.1rem; }
            .me { left: 1rem; top: 4.2rem; }
        }
    </style>
</head>
<body>
    <script src="../assets/track.js"></script>
    <canvas id="view" aria-hidden="true"></canvas>

    <div class="loading" id="loading">LOADING…</div>

    <header class="top">
        <a href="../more/" class="btn small">&lt; The flame</a>
        <button class="btn small" id="skip" hidden>Skip &gt;</button>
    </header>

    <!-- A click is needed before sound can play, so the climb starts from a button -->
    <section class="gate" id="start" hidden>
        <p class="gate-title">THE SEAL IS WEAK</p>
        <p class="gate-line">You have seen everything there was to see. Something at the top of the tower knows it.</p>
        <button class="btn" id="climb">Approach</button>
    </section>

    <p class="caption" id="caption" aria-live="polite"></p>
    <p class="hint" id="hint" hidden></p>
    <p class="say" id="say" aria-live="polite"></p>

    <div class="boss" id="boss" hidden>
        <p class="boss-name" id="bossName"></p>
        <div class="boss-bar"><i id="bossFill"></i></div>
        <div class="boss-post" id="bossPostBar" hidden><i id="bossPost"></i></div>
    </div>

    <div class="me" id="me" hidden>
        <div class="bar hp"><i class="lag" id="meHpLag"></i><i id="meHp"></i></div>
        <div class="bar st" id="meStBar"><i id="meSt"></i></div>
        <div class="me-row">
            <p id="meHeals"></p>
            <div class="art" id="meArt" title="Ember art"><i id="meArtFill"></i></div>
        </div>
        <div class="me-low" id="meLow"></div>
        <div class="cutin" id="cutin"><b id="cutinName"></b><span>ASH CRESCENT</span></div>
    </div>
    <div class="phase" id="phase" hidden>
        <p class="phase-title" id="phaseTitle"></p>
        <p class="phase-hint" id="phaseHint"></p>
    </div>
    <div class="pad" id="pad" hidden>
        <div class="stick" id="stick"><i id="knob"></i></div>
        <button type="button" id="btnLock" aria-label="Lock on">LOCK</button>
        <button type="button" id="btnArt" aria-label="Ember art" hidden>ART</button>
        <button type="button" id="btnHeal" aria-label="Heal">✚</button>
        <button type="button" id="btnHeavy">HEAVY</button>
        <button type="button" id="btnGuard">GUARD</button>
        <button type="button" id="btnRoll">ROLL</button>
        <button type="button" id="btnAtk">HIT</button>
    </div>
    <p class="fell" id="fell" hidden>YOU FELL</p>
    <div class="hurt" id="hurt"></div>

    <section class="gate end" id="end" hidden>
        <p class="gate-title" id="endTitle">THE WATCHER FALLS</p>
        <p class="rank" id="rank"></p>
        <p class="gate-line" id="endLine"></p>
        <p class="gate-line" id="endNote"></p>
        <ol class="board" id="board" hidden></ol>
        <button class="btn" id="again">Play again</button>
        <a class="btn" href="../more/">&lt; Back to the flame</a>
    </section>

    <!-- The end: keep the place alive, or end it (asked twice, since it cannot be taken back) -->
    <section class="choice" id="choice" hidden>
        <button class="btn keep" id="keepBtn">Keep it alive</button>
        <button class="btn kill" id="endBtn">End it all</button>
    </section>
    <section class="choice" id="sure" hidden>
        <p>This cannot be undone. Everything here will be gone for you.</p>
        <button class="btn kill" id="sureYes">End it</button>
        <button class="btn" id="sureNo">Go back</button>
    </section>
    <div class="flash" id="flash"></div>

    <button class="btn small sound" id="sound" hidden aria-pressed="true">♪ Sound on</button>

    <div class="bars"></div>
    <div class="fade on" id="fade"></div>

    <script type="module">
    import * as THREE from 'three';
    import { CLASSES, loadCharacter, footfalls } from '../assets/characters.js';
    import { createSfx } from '../assets/sfx.js';
    import { mix, clamp01, ease, ramp, eyePair, setOpen, glowTexture } from '../assets/fight/kit.js';
    import { createFight } from '../assets/fight/core.js';
    import { createEnding } from '../assets/ending.js';
    const sfx = createSfx();

    const $ = id => document.getElementById(id);
    const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
    const track = (...a) => window.track && window.track(...a);
    const touch = matchMedia('(hover: none)').matches;

    // The tower only opens for someone who has walked all three paths (?preview is for looking at it early)
    let seen = [];
    try { seen = JSON.parse(store.get('aumritash-seen') || '[]'); } catch (e) {}
    const preview = /[?&](preview|debug)\b/.test(location.search);
    if (!preview && !['work', 'games', 'stories'].every(p => seen.includes(p))) location.replace('../more/');

    const heroCls = CLASSES.find(c => c.id === store.get('aumritash-origin')) || CLASSES[0];
    const who = (store.get('aumritash-name') || heroCls.name).toUpperCase();
    const BOSS = 'THE WATCHER';     // what the visitor's name turns into

    // ── Renderer ──
    const canvas = $('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'low-power' });
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.localClippingEnabled = true;
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 160);
    function resize() {
        const scale = Math.max(2, innerHeight / 300);
        renderer.setSize(Math.ceil(innerWidth / scale), Math.ceil(innerHeight / scale), false);
        camera.aspect = innerWidth / innerHeight;
        // Phones are tall and narrow: widen the lens so the scene isn't cropped to a sliver
        camera.fov = camera.aspect < 0.8 ? 72 : 55;
        camera.updateProjectionMatrix();
    }
    resize();
    addEventListener('resize', resize);

    // ── Procedural textures, as at the flame ──
    function noiseTexture(base, spread, size = 64, blocks = false) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        const img = g.createImageData(size, size);
        for (let i = 0; i < size * size; i++) {
            const n = (Math.random() - 0.5) * spread;
            img.data[i * 4] = base[0] + n; img.data[i * 4 + 1] = base[1] + n * 0.9; img.data[i * 4 + 2] = base[2] + n * 0.8; img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        if (blocks) {
            g.strokeStyle = 'rgba(0,0,0,0.45)';
            g.lineWidth = 1;
            for (let y = 0; y < size; y += 16) {
                g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(size, y + 0.5); g.stroke();
                const off = (y / 16) % 2 ? 0 : 16;

    const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&?/\\<>*';

                    tmp2.copy(e.userData.gap).sub(tmp).normalize();
                    e.position.copy(e.userData.gap).addScaledVector(tmp2, 0.55);
                    e.lookAt(tmp.x + O.x, tmp.y, tmp.z);
                }
                // The camera trails a few steps below, looking up the stair
                stairAt(a - 1.35, tmp2);
                camTo.set(tmp2.x * 1.06 + O.x, tmp2.y + 2.5, tmp2.z * 1.06);
                stairAt(a + 0.5, look).add(O);
                look.y += 1.2;
                if (a >= 7.8) { walk(false); return true; }
            }
        },
        {   // 3. The roof: walk out, the eyes gather into the Watcher, and it changes
            name: 'watcher', END: 20.5,
            enter() {
                this.z = 11; this.t = 0; this.phase = 'walk';
                const C = SETS.top.position;
                hero.root.position.set(C.x, 0, this.z);
                hero.root.rotation.y = Math.PI;
                top.void.forEach(e => { e.position.copy(e.userData.from); e.scale.setScalar(e.userData.size); e.userData.openedAt = null; setOpen(e, 0); });
                setOpen(top.gaze, 0);
                top.clip.constant = 0;
                top.glow.intensity = 0;
                top.aura.material.opacity = 0;
                top.scythe.visible = false;
                top.crown.scale.setScalar(0.001);
                armReach = 1;
                document.body.classList.remove('fighting');
                watcher.root.scale.setScalar(BODY);
                watcher.stopAll();
                watcher.play('Idle_Loop', { fade: 0 });
                document.body.classList.remove('cine');
                watcher.mixer.timeScale = 0.45;
                world.fog.density = 0.026;
                heroLight.intensity = 3;
                $('say').textContent = '';
                $('boss').hidden = true;
                $('bossFill').style.width = '0';
                caption('The top of the tower.');
            },
            update(dt) {
                const C = SETS.top.position;
                if (this.phase === 'walk') {
                    if (walk(true)) this.z -= SPEED * dt;
                    hero.root.position.z = this.z;
                    if (once('c2', this.z < 7)) caption('Something has been waiting.');
                    if (this.z <= 3.6) { this.phase = 'scene'; walk(false); caption(''); sfx.whoosh(); sfx.setDrone(true); document.body.classList.add('cine'); }
                }
                const p = clamp01((11 - this.z) / 7.4);
                const t = this.phase === 'scene' ? (this.t += dt) : 0;

                // How big it is: it stands up at one size, then swells into something else
                const beast = ramp(t, 13.4, 17);
                const size = mix(BODY, BEAST, beast);
                watcher.root.scale.setScalar(size);
                watcher.root.rotation.y = Math.sin(clockT * 0.5) * 0.06;

                for (const e of top.void) {
                    const u = e.userData;
                    // They open out in the dark as the visitor crosses the roof...
                    if (u.openedAt === null && p >= u.openP) { u.openedAt = clockT; sfx.eye(0.4 + rand() * 0.4, e.position.x < 0 ? -0.7 : 0.7); }
                    let open = u.openedAt === null ? 0 : Math.min(1, (clockT - u.openedAt) * 3);
                    // ...then leave it, arcing in over the wall to pile into one shape
                    const k = ease((t - u.goAt) / 1.7);
                    if (t > 0) {
                        if (u.openedAt === null) u.openedAt = clockT;
                        bones[u.bone].getWorldPosition(tmp).sub(C).addScaledVector(u.on, size);
                        const a = 1 - k, tx = tmp.x, ty = tmp.y, tz = tmp.z;
                        const vx = (u.from.x + tx) / 2 + u.via.x, vy = (u.from.y + ty) / 2 + u.via.y, vz = (u.from.z + tz) / 2;
                        e.position.set(a * a * u.from.x + 2 * a * k * vx + k * k * tx, a * a * u.from.y + 2 * a * k * vy + k * k * ty, a * a * u.from.z + 2 * a * k * vz + k * k * tz);
                        e.scale.setScalar(mix(u.size, 0.2 * size, k));
                    }
                    // One by one they close, until only two are left; when it changes, they all open again
                    if (t > u.shutAt) open = Math.max(0, 1 - (t - u.shutAt) * 5);
                    if (t > u.wakeAt) open = Math.min(1, (t - u.wakeAt) * 4) * (0.8 + 0.2 * Math.sin(clockT * 7 + u.goAt * 9));
                    e.quaternion.copy(camera.quaternion);
                    setOpen(e, open);
                }
                // The body rises out of the floor as they arrive
                top.clip.constant = t > 13 ? 99 : ramp(t, 2, 6.5) * (BODY * 1.95);
                if (once('rise', t > 2)) sfx.rumble(4);
                top.aura.scale.set(4.4 * size, 4.2 * size, 1);
                top.aura.position.set(WATCH.x, 1.15 * size, WATCH.z - 0.8);
                top.aura.material.opacity = ramp(t, 2, 7.5) * (0.75 + Math.sin(clockT * 2.3) * 0.08) + (t > 8.7 ? 0.2 : 0);

                // Its own eyes open last, wherever its head is
                if (bones.Head) {
                    bones.Head.getWorldPosition(tmp).sub(C);
                    top.gaze.position.set(tmp.x, tmp.y + 0.05 * size, tmp.z + 0.11 * size);
                    top.gaze.scale.setScalar(0.87 * size);
                    top.gaze.quaternion.copy(camera.quaternion);
                    top.glow.position.set(tmp.x, tmp.y - 0.2, tmp.z + 1.4);
                }
                if (once('gaze', t > 8.7)) { sfx.thud(); sfx.roar(1.6); }
                setOpen(top.gaze, t < 8.7 ? 0 : Math.min(1, (t - 8.7) * 2.2) * (0.92 + Math.sin(clockT * 9) * 0.08));
                top.glow.intensity = ramp(t, 2.5, 6.5) * 2 + (t > 8.7 ? 5 + Math.sin(clockT * 9) * 0.8 : 0) + beast * 4;

                // It speaks
                const line = `I SEE YOU, ${who}.`;
                if (once('roar', t > 10.3)) sfx.roar(3.2);
                if (t > 10.3 && t < 13.4) $('say').textContent = line.slice(0, Math.floor((t - 10.3) * 9));

                // The change: it swells, its arms stretch, spines fan out behind it, and every eye opens again
                if (once('change', t > 13.4)) { sfx.rumble(3.6); sfx.roar(3.6); watcher.play('Sword_Idle', { fade: 1.6 }); watcher.mixer.timeScale = 0.6; hero.play(heroCls.pose, { fade: 0.6 }); }
                armReach = 1 + beast * 0.32;
                if (bones.spine_03) {
                    bones.spine_03.getWorldPosition(tmp).sub(C);
                    top.crown.position.set(tmp.x, tmp.y, tmp.z - 0.12 * size);
                    top.crown.scale.setScalar(Math.max(0.001, ramp(t, 14, 16.6) * size));
                }
                // The scythe is called up in its hand: a red line first, then the whole thing
                if (bones.hand_r && t > 15.2) {
                    if (once('scythe', true)) { sfx.thud(); sfx.whoosh(); }
                    bones.hand_r.getWorldPosition(tmp).sub(C);
                    const grow = ramp(t, 15.2, 16.1);
                    // The shaft runs through its closed hand
                    top.scythe.visible = true;
                    top.scythe.position.copy(tmp).addScaledVector(top.lean, -GRIP * size * grow);
                    top.scythe.scale.setScalar(Math.max(0.001, grow) * size);
                    top.edge.material.color.setRGB(1, 0.16 + (1 - ramp(t, 16.1, 17)) * 0.84, 0.1 + (1 - ramp(t, 16.1, 17)) * 0.9);
                }
                // The visitor's name comes apart and settles into its name, over a health bar
                if (t >= 13.4 && t < 17) $('say').textContent = jumble(who, BOSS, (t - 13.6) / 2.4);
                if (once('named', t > 17)) { $('say').textContent = ''; $('bossName').textContent = BOSS; $('boss').hidden = false; sfx.thud(); }
                if (t > 17) $('bossFill').style.width = ramp(t, 17.2, 18.8) * 100 + '%';
                if (once('full', t > 18.8)) sfx.tick();

                // Camera: behind the visitor as they walk; round to their shoulder as the thing takes shape; low and close when
                // it speaks; then back and up as it outgrows the frame
                const hz = hero.root.position.z;
                const turn = ramp(t, 0.3, 4), close = ramp(t, 8, 9.8), wide = ramp(t, 13.4, 16.5);
                camTo.set(
                    C.x + mix(mix(mix(1.8, -2.4, turn), 0.95, close), 1.5, wide),
                    mix(mix(mix(2.8, 2.1, turn), 1.75, close), 1.5, wide),
                    mix(mix(mix(hz + 4.8, 7.8, turn), 5.6, close), 8.2, wide));
                look.set(C.x + wide * -0.4, mix(mix(mix(mix(1.6, 3.4, p), 2.5, turn), 2.9, close), 3.7, wide), mix(hz - 8, WATCH.z, turn));
                if (t > 10.3 && t < 17) camTo.x += Math.sin(clockT * 40) * 0.012;

                if (t >= this.END) return true;
            },
            // Skip lands on the last frame instead of leaving the shot
            finish() { this.phase = 'scene'; this.z = 3.6; hero.root.position.z = 3.6; this.t = this.END - 0.05; walk(false); caption(''); fired = new Set(['c2', 'rise', 'gaze', 'roar', 'change', 'full']); watcher.play('Sword_Idle', { fade: 0 }); hero.play(heroCls.pose, { fade: 0 }); }
        },
        {   // 4. The fight (assets/fight/): it runs itself, form after form, until it is won or left
            name: 'fight', seamless: true,
            enter(n = 0) { fight.start(n); },
            update(dt) { fight.frame(dt); if (fight.done) hero.mixer.timeScale = 1; return fight.done; },
            finish() { fight.abort(); }
        },
        {   // 5. The end (assets/ending.js): keep it alive, or end it all
            name: 'ending', seamless: true,
            enter() { $('skip').hidden = true; ending.enter(fight.rank); },
            update(dt) { return ending.update(dt); }
        }
    ];

    // ═════════════ The fight ═════════════
    // Lives in assets/fight/: core.js runs it (forms in order, cut-scenes, hazards, checkpoints, the result), player.js is
    // the visitor, forms/*.js are the boss's forms. The page hands over what it built and drives it from the frame loop.
    let fight = null;
    // Forms in order. The later two do not exist yet; the fight skips a form whose file is missing.
    const FORMS = [
        () => import('../assets/fight/forms/watcher.js'),
        () => import('../assets/fight/forms/player2.js'),
        () => import('../assets/fight/forms/author.js')
    ];
    function makeFight() {
        fight = createFight({
            THREE, arena: SETS.top, camera, camTo, look,
            snap: () => { camSnap = true; },
            baseFov: () => (camera.aspect < 0.8 ? 72 : 55),
            fade: fadeTo,
            sfx, hero, heroCls, heroName: who, heroSteps: () => heroSteps(), loadCharacter,
            $, store, track, touch,
            parts: {
                watcher: {
                    body: watcher, bones, scythe: top.scythe, edge: top.edge, eyes: top.void, gaze: top.gaze, crown: top.crown,
                    aura: top.aura, glow: top.glow, clip: top.clip, lean: top.lean, grip: GRIP, home: WATCH, small: BODY, big: BEAST,
                    reach(v) { if (v !== undefined) armReach = v; return armReach; }
                }
            },
            forms: FORMS
        });
    }

    // ═════════════ The end ═════════════
    let ending = null, halted = false, flashA = 0, shakeK = 0;
    function makeEnding() {
        ending = createEnding({
            arena: SETS.top, world, camTo, look, hero, heroCls, who, sfx, $, store, track,
            canvas, floor: top.floor, bowl: top.bowl,
            snap: () => { camSnap = true; },
            steps: () => heroSteps(),
            fade: fadeTo,
            flash(color, a) { $('flash').style.background = color; flashA = a; },
            shake(k) { shakeK = Math.max(shakeK, k); },
            result: () => fight.result(),
            // The last form's sky and what it left sitting by the brazier go out like a light
            night() { try { if (fight.form) fight.form.dispose(); } catch (e) { console.error(e); } },
            snapshot() { renderer.render(world, camera); return canvas.toDataURL('image/png'); },
            halt() { halted = true; ending.after(); }
        });
    }

    // ── Running the shots ──
    let shot = -1, playing = false, cutting = false;
    function startShot(i) {
        shot = i;
        fired = new Set();
        cutting = false;
        canWalk = walking = false;
        hero.play(heroCls.walkIdle, { fade: 0 });
        SHOTS[i].enter();
        camSnap = true;
        fadeTo(false);
    }
    function cut(then) {
        if (cutting) return;
        cutting = true;
        walk(false);
        fadeTo(true);
        setTimeout(then, 650);
    }
    function finished() {
        // It is over (the end was chosen, or the fight was stepped past): show how it went
        playing = false;
        $('skip').hidden = true;
        $('end').hidden = false;
    }
    function play() {
        $('start').hidden = true;
        $('end').hidden = true;
        $('skip').hidden = false;
        sfx.setDrone(false);
        ending.reset();
        fight.reset();
        hero.mixer.timeScale = 1;
        hero.root.rotation.set(0, Math.PI, 0);
        hero.stopAll();
        caption('');
        playing = true;
        startShot(0);
    }
    $('climb').onclick = () => { sfx.unlock(); track('tower', 'climb'); play(); };
    $('again').onclick = () => { sfx.unlock(); fadeTo(true); setTimeout(play, 500); };
    $('skip').onclick = () => {
        if (!playing || cutting) return;
        const S = SHOTS[shot];
        // In the fight, Skip skips the cut-scene that is playing; between them, it leaves the fight
        if (S.name === 'fight') { if (!fight.skip()) S.finish(); return; }
        cut(() => {
            if (S.finish) { S.finish(); cutting = false; camSnap = true; fadeTo(false); }
            else startShot(shot + 1);
        });
    };

    const clock = new THREE.Clock();
    function frame(manual) {
        if (halted) return;
        if (manual !== true) requestAnimationFrame(frame);
        // Debug: hold the scene still between hand-stepped frames, so a pose can be looked at
        if (window.__hold && manual !== true) { clock.getDelta(); return; }
        // The fight can slow time down for a beat (a parry landing)
        const dt = Math.min(0.1, clock.getDelta()) * (fight && fight.on ? fight.warp : 1);
        clockT += dt;
        if (playing && shot >= 0 && !cutting) {
            const done = SHOTS[shot].update(dt);
            if (done) {
                const next = SHOTS[shot + 1];
                if (!next) finished();
                else if (next.seamless) { shot++; fired = new Set(); next.enter(); }
                else cut(() => startShot(shot + 1));
            }
        }
        if (hero) {
            hero.mixer.update(dt);
            watcher.mixer.update(dt);
            // Bone tweaks made by a shot have to be redone after the animation has had its say
            for (const n of ['upperarm_l', 'upperarm_r', 'lowerarm_l', 'lowerarm_r']) if (bones[n]) bones[n].scale.setScalar(armReach);
            // The fight poses both bodies on top of their animation, so it has to go after it
            if (fight.on) fight.pose(dt);
            if (walking) heroSteps();
            heroLight.position.copy(hero.root.position).add(tmp.set(-0.8, 3, 1.6));
        }
        // Ease the camera towards where the shot wants it (or jump there on a cut)
        const k = camSnap ? 1 : 1 - Math.pow(fight.on ? 0.0008 : 0.03, dt);
        camera.position.lerp(camTo, k);
        lookNow.lerp(look, k);
        camera.lookAt(lookNow);
        if (shakeK > 0.01) { camera.position.x += Math.sin(clockT * 47) * shakeK * 0.06; camera.position.y += Math.cos(clockT * 53) * shakeK * 0.06; shakeK *= Math.pow(0.02, dt); }
        if (flashA > 0) { flashA = Math.max(0, flashA - dt * 1.6); $('flash').style.opacity = flashA; }
        camSnap = false;
        renderer.render(world, camera);
    }

    // ── Sound toggle (shared with the flame) ──
    let soundOn = store.get('aumritash-music') !== 'off';
    function renderSound() {
        $('sound').textContent = soundOn ? '♪ Sound on' : '♪ Sound off';
        $('sound').setAttribute('aria-pressed', String(soundOn));
    }
    sfx.setMuted(!soundOn);
    $('sound').onclick = () => { soundOn = !soundOn; store.set('aumritash-music', soundOn ? 'on' : 'off'); sfx.setMuted(!soundOn); if (soundOn) sfx.unlock(); renderSound(); };
    document.addEventListener('visibilitychange', () => sfx.pause(document.hidden));
    addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

    // ── Boot ──
    (async () => {
        try { await loadCast(); }
        catch (e) { $('loading').textContent = 'SOMETHING WENT WRONG · RELOAD'; console.error(e); return; }
        makeFight();
        makeEnding();
        hero.root.position.set(0, 0, 11);
        camTo.set(1.3, 2.3, 16);
        look.set(0, 2, 0);
        $('loading').hidden = true;
        $('start').hidden = false;
        $('sound').hidden = false;
        renderSound();
        requestAnimationFrame(frame);
    })();

    // ?debug: drive the scene by hand when the tab can't animate
    if (location.search.includes('debug')) {
        window.__scene = {
            THREE, world, camera, cast: () => ({ hero, watcher, bones }),
            state: () => ({ shot: shot >= 0 ? SHOTS[shot].name : null, phase: shot >= 0 ? SHOTS[shot].phase : null, t: shot >= 0 ? +(SHOTS[shot].t || 0).toFixed(2) : 0, playing, walking, sfx: sfx.state() }),
            goto(i) { playing = true; $('start').hidden = true; $('end').hidden = true; startShot(i); },
            hold: on => (on ? held.add('debug') : held.delete('debug')),
            // The fight (assets/fight/core.js): fight.stats, fight.form (its .debug has moves and force(name)),
            // fight.ctx, fight.player, and fight.view = [camX, camY, camZ, lookX, lookY, lookZ] to pin the camera
            get fight() { return fight; },
            bot(on = true, skill = 0.9, parry = false) { fight.bot(on, skill, parry); },
            // Straight to form n (0 the Watcher, 1 the Player, 2 the Author), skipping the climb and what came before
            toForm(n = 0) {
                if (fight.on) fight.abort();
                playing = true; $('start').hidden = true; $('end').hidden = true; $('skip').hidden = false;
                startShot(2);
                SHOTS[2].finish();
                caption('');
                sfx.setDrone(true);
                shot = 3; fired = new Set();
                SHOTS[3].enter(n);
            },
            get ending() { return ending; },
            // Straight to the end, as if the fight had just been won with this rank
            toEnd(rank = 'B') {
                if (fight.on) fight.abort();
                ending.reset();
                playing = true; $('start').hidden = true; $('end').hidden = true;
                startShot(2);
                SHOTS[2].finish();
                caption(''); $('boss').hidden = true; $('say').textContent = '';
                hero.root.position.set(400 + 1.5, 0, 4);
                shot = 4; fired = new Set();
                $('skip').hidden = true; ending.enter(rank);
            },
            // Like step, but lets the fight's script run between frames
            async run(seconds, fps = 30) {
                const real = clock.getDelta;
                for (let i = 0; i < seconds * fps; i++) { clock.getDelta = () => 1 / fps; frame(true); clock.getDelta = real; await new Promise(r => setTimeout(r, 0)); }
            },
            step(seconds, fps = 30) {
                const real = clock.getDelta;
                clock.getDelta = () => 1 / fps;
                for (let i = 0; i < seconds * fps; i++) frame(true);
                clock.getDelta = real;
            }
        };
    }
    </script>
</body>
</html>
