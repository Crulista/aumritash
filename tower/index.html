            }
        } else if (B.state === 'scatter') {
            // Comes apart into the dark, and pulls itself together behind the visitor
            hold('gather', 6);
            if (B.t < 0.5) B.hidden = B.t / 0.5;
            else if (B.t < 0.95) {
                B.hidden = 1;
                if (first('move')) {
                    sfx.whoosh();
                    // Behind them, as seen from where it was; pulled in if that would be off the roof
                    let nx = P.x + dx / dist * 5.5, nz = P.z + dz / dist * 5.5;
                    const r = Math.hypot(nx, nz);
                    if (r > ARENA - 1.5) { nx *= (ARENA - 1.5) / r; nz *= (ARENA - 1.5) / r; }
                    if (Math.hypot(nx, nz) < 3) { nx = P.x - dx / dist * 5.5; nz = P.z - dz / dist * 5.5; }
                    B.x = nx; B.z = nz; B.yaw = Math.atan2(P.x - nx, P.z - nz);
                }
            } else if (B.t < 1.4) B.hidden = 1 - (B.t - 0.95) / 0.45;
            else { B.hidden = 0; begin('sweep', 'sweep'); B.last = 'scatter'; B.t = 0.25 / sp; }
        } else if (B.state === 'beams') {
            // Calls on the eyes still out in the dark; where they look, the stone burns
            const wind = 0.85 / sp, count = 6;
            face(2); hold('cast', 8);
            if (B.t >= wind) {
                const n = Math.min(count, Math.floor((B.t - wind) / 0.42) + 1);
                while (B.n < n) {
                    B.n++;
                    const b = fx.beams.find(q => q.t < 0);
                    if (!b) break;
                    // Mostly where the visitor is; sometimes where they are heading
                    const lead = Math.random() < 0.4 ? 1.6 : 0;
                    b.x = P.x + (P.state === 'run' ? Math.sin(P.yaw) * lead : 0); b.z = P.z + (P.state === 'run' ? Math.cos(P.yaw) * lead : 0);
                    b.t = 0; b.hit = false;
                    sfx.eye(1, 0);
                }
                if (B.t >= wind + count * 0.42 + 1.5 / sp) settle();
            }
        } else if (B.state === 'stagger') {
            // Its blow was turned aside: thrown open for a moment, and worth hitting
            hold('stagger', 16);
            fight.cut = 0;
            if (B.t > 1.9) settle();
        } else if (B.state === 'roar') {
            // Losing a third of itself: it throws the visitor back, and comes on harder
            hold(B.t < 0.45 ? 'gather' : 'roar', 12);
            B.hidden = 0; fight.cut = 0;
            if (B.t >= 0.45 && first('roar')) {
                sfx.roar(2.6); sfx.rumble(2.4); fight.shake = 1;
                line(B.phase === 2 ? 'LOOK AT ME.' : 'DO NOT LOOK AWAY.', 2.4);
                fight.crownTo = B.phase === 2 ? 1.35 : 1.7;
                for (const o of fx.orbs) o.live = false;
                for (const b of fx.beams) b.t = -1;
                fight.wave = { x: B.x, z: B.z, r: 1, max: 9, hit: true };
            }
            if (B.t > 0.45 && B.t < 0.95 && dist < 8) { P.x += dx / dist * 16 * dt; P.z += dz / dist * 16 * dt; }
            if (B.t > 2.6) settle();
        }
        if (!B.move) fight.cut = 0;
        B.walk = toward(B.walk, walking, 6, dt);
        B.run = toward(B.run, running, 14, dt);
        // Keep it on the roof and off the brazier
        const r = Math.hypot(B.x, B.z);
        if (r > ARENA - 1) { B.x *= (ARENA - 1) / r; B.z *= (ARENA - 1) / r; }
        if (r < 2.4) { const k = 2.4 / (r || 1); B.x = (B.x || 0.01) * k; B.z *= k; }
    }

    // ── Things in the air and on the ground ──
    function updateHazards(dt) {
        const P = fight.p;
        if (fight.wave) {
            const w = fight.wave;
            w.r += 9.5 * dt;
            fx.wave.visible = true;
            fx.wave.position.set(w.x, 0.05, w.z);
            fx.wave.scale.setScalar(w.r);
            fx.wave.material.opacity = 0.75 * (1 - w.r / (w.max + 1));
            if (!w.hit && Math.abs(Math.hypot(P.x - w.x, P.z - w.z) - w.r) < 0.75) w.hit = hitPlayer(16, w.x, w.z, 'wave') || P.inv;
            if (w.r > w.max) { fight.wave = null; fx.wave.visible = false; }
        }
        for (const o of fx.orbs) {
            o.sp.visible = o.live;
            if (!o.live) continue;
            o.age += dt;
            // They bend towards the visitor for a moment, then fly straight
            if (o.age < 0.9) {
                tmp.set(P.x - o.p.x, 1.2 - o.p.y, P.z - o.p.z).normalize().multiplyScalar(o.v.length());
                o.v.lerp(tmp, Math.min(1, dt * 2.2));
            }
            o.p.addScaledVector(o.v, dt);
            o.sp.position.copy(o.p);
            if (Math.hypot(o.p.x - P.x, o.p.z - P.z) < 0.85 && o.p.y < 2.6) { if (hitPlayer(11, o.p.x, o.p.z, 'orb') || !P.inv) o.live = false; }
            if (o.age > 3 || o.p.y < 0.1) o.live = false;
        }
        for (const b of fx.beams) {
            if (b.t < 0) { b.mark.visible = b.pillar.visible = false; continue; }
            b.t += dt;
            b.mark.visible = true;
            b.mark.position.set(b.x, 0.045, b.z);
            b.pillar.position.set(b.x, 10, b.z);
            if (b.t < 0.85) { b.mark.material.opacity = 0.1 + 0.3 * b.t / 0.85; b.pillar.visible = false; }
            else {
                b.pillar.visible = true;
                const k = 1 - (b.t - 0.85) / 0.4;
                b.pillar.material.opacity = Math.max(0, k);
                b.mark.material.opacity = Math.max(0, k) * 0.8;
                if (!b.hit) { b.hit = true; sfx.thud(); if (Math.hypot(P.x - b.x, P.z - b.z) < 2.1) hitPlayer(22, b.x, b.z, 'beam'); }
                if (k <= 0) b.t = -1;
            }
        }
        fx.spark.material.opacity = Math.max(0, fx.spark.material.opacity - dt * 6);
        // The mark for a scythe move: the traced path of the blade, laid where the Watcher stands
        for (const [name, m] of Object.entries(fx.marks)) {
            const on = fight.mark && fight.mark.name === name;
            m.visible = !!on;
            if (!on) continue;
            m.position.set(fight.mark.x, 0.042, fight.mark.z);
            m.rotation.z = fight.mark.yaw;
            m.scale.setScalar(fight.size);
            m.material.opacity = 0.08 + 0.3 * fight.mark.k;
        }
    }

    // ── A stand-in player for testing: circles, strikes in the openings, rolls or parries what it can ──
    function botThink() {
        const P = fight.p, B = fight.b, dist = Math.hypot(P.x - B.x, P.z - B.z);
        const blade = B.move && fight.hot > 0.86 && fight.mark && nearMark(P.x, P.z);
        const danger = blade || (fight.wave && !fight.wave.hit && Math.abs(Math.hypot(P.x - fight.wave.x, P.z - fight.wave.z) - fight.wave.r) < 1.6)
            || fx.orbs.some(o => o.live && Math.hypot(o.p.x - P.x, o.p.z - P.z) < 2.2) || fx.beams.some(b => b.t > 0.55 && b.t < 0.85 && Math.hypot(P.x - b.x, P.z - b.z) < 2.3);
        if (blade && fight.botParry && fight.hot > 0.97) { guard(true); setTimeout(() => guard(false), 250); }
        else if (danger && fight.botSkill > Math.random() * 0.999) press('roll');
        else if (P.hp < 45 && P.heals > 0 && fight.hot < 0.2) press('heal');
        else if (dist < REACH - 0.3 && (fight.hot < 0.3 || B.state === 'stagger') && P.st > 30) press('attack');
        return [B.state === 'beams' ? 1 : 0.35, dist > REACH - 0.8 ? 1 : 0];
    }
    // Roughly whether a point is inside the reach of the move being wound up (the bot only; hits use the blade)
    function nearMark(x, z) { const m = fight.mark, d = Math.hypot(x - m.x, z - m.z); return d > 1.5 && d < 8.5; }

    // How fast a walking or jogging clip actually covers ground, from how far a foot travels in it
    function clipSpeed(name) {
        const a = hero.actions[name], d = a.getClip().duration;
        let foot = null, lo = 9, hi = -9;
        hero.root.traverse(o => { if (o.isBone && o.name === 'foot_r') foot = o; });
        hero.stopAll();
        a.reset().play();
        const yaw = hero.root.rotation.y;
        hero.root.rotation.set(0, 0, 0);
        for (let i = 0; i < 16; i++) { a.time = d * i / 16; hero.mixer.update(0); hero.root.updateMatrixWorld(true); foot.getWorldPosition(tmp); lo = Math.min(lo, tmp.z); hi = Math.max(hi, tmp.z); }
        hero.stopAll();
        hero.root.rotation.y = yaw;
        return (hi - lo) * 2 / d;
    }

    let rigged = false;
    function startFight() {
        resetFight();
        if (!rigged) {
            rigged = true;
            // Match feet to ground speed: the visitor jogs a little faster than the clip, the Watcher walks slower
            const jog = clipSpeed('Jog_Fwd_Loop');
            WALK = clipSpeed('Walk_Loop');
            RUN = jog * JOG_RATE;
            armHero();
        }
        // From here its body is driven directly: three stances blended by weight, with the arms and scythe posed on top
        watcher.stopAll();
        for (const n of ['Idle_Loop', 'Crouch_Idle_Loop', 'Walk_Loop', 'Sprint_Loop', 'Fixing_Kneeling']) watcher.actions[n].reset().setEffectiveWeight(n === 'Idle_Loop' ? 1 : 0).play();
        watcher.mixer.timeScale = 1;
        if (!fx.marks.sweep) buildMarks();
        hero.stopAll();
        fight.on = true;
        document.body.classList.add('fighting', 'cine');
        $('me').hidden = false;
        $('pad').hidden = !touch;
        camSnap = true;
    }
    function abortFight() { fight.rank = '—'; fight.done = true; }

    // The fight's rules, every frame (bodies are posed afterwards, in fightPose)
    function fightFrame(dt) {
        const C = SETS.top.position, P = fight.p, B = fight.b;
        fight.T += dt;
        fight.modeT += dt;
        timeWarp = Math.min(1, timeWarp + dt * 4);
        if (fight.mode === 'intro') {
            // It shows itself before anything starts: gathers, roars, and drives the scythe's heel into the stone
            const t = fight.modeT;
            if (t < 1.3) { readPose(POSE.gather, fight.poseTo); fight.poseRate = 5; }
            else if (t < 3.3) {
                readPose(POSE.roar, fight.poseTo); fight.poseRate = 14;
                if (!fight.roared) { fight.roared = true; sfx.roar(2.4); sfx.rumble(2); fight.shake = 1; fight.wave = { x: B.x, z: B.z, r: 1, max: 9, hit: true }; camSnap = true; }
            } else { readPose(POSE.rest, fight.poseTo); fight.poseRate = 5; }
            if (t > 3.6 && !fight.carded) {
                fight.carded = true;
                camSnap = true;
                document.body.classList.remove('cine');
                $('phaseTitle').textContent = 'THE WATCHER';
                $('phaseHint').innerHTML = touch
                    ? 'Left thumb to move. <b>HIT</b> to strike, <b>ROLL</b> through attacks,<br>hold <b>GUARD</b> to block (tap it late to parry), <b>✚</b> to heal.'
                    : '<b>W A S D</b> move &nbsp; <b>J</b> or <b>CLICK</b> strike &nbsp; <b>SPACE</b> roll<br>hold <b>SHIFT</b> or <b>RIGHT CLICK</b> to guard, tap it late to parry &nbsp; <b>E</b> heal';
                $('phase').hidden = false;
                sfx.thud();
            }
            if (t > 7.5 || (t > 4.4 && (keys.size || stick.id !== null || fight.T - Math.max(fight.want.attack, fight.want.roll) < 0.3 || fight.bot))) { $('phase').hidden = true; setMode('play'); }
        } else if (fight.mode === 'play') fight.time += dt;
        else if (fight.mode === 'dead') {
            if (fight.modeT > 1.3) $('fell').hidden = false;
            if (fight.modeT > 3) fadeTo(true);
            if (fight.modeT > 3.8) {
                // Back to the start of this phase, with one more ember than last time
                const keep = { deaths: fight.deaths, hits: fight.hits, parries: fight.parries, time: fight.time, checkpoint: fight.checkpoint, bot: fight.bot, botSkill: fight.botSkill, botParry: fight.botParry, roared: true, carded: true };
                const phase = B.phase;
                resetFight();
                Object.assign(fight, keep, { on: true, crownTo: phase === 1 ? 1 : phase === 2 ? 1.35 : 1.7 });
                fight.b.hp = fight.b.shown = keep.checkpoint; fight.b.phase = phase;
                fight.p.heals = fight.p.maxHeals = Math.min(6, 3 + keep.deaths);
                $('me').hidden = false; $('pad').hidden = !touch;
                hero.stopAll();
                setMode('play');
                camSnap = true;
                fadeTo(false);
                return;
            }
        } else if (fight.mode === 'won') {
            readPose(POSE.down, fight.poseTo); fight.poseRate = 2.2;
            if (fight.modeT > 6 && !fight.done) {
                const d = fight.deaths, hh = fight.hits;
                fight.rank = d === 0 && hh <= 2 ? 'S' : d === 0 ? 'A' : d <= 1 ? 'B' : d <= 3 ? 'C' : 'D';
                fight.done = true;
            }
        }

        updatePlayer(dt);
        updateBoss(dt);
        updateHazards(dt);

        // Its stance: standing, crouched, walking or running, mixed by weight; feet keep pace with the ground
        const won = fight.mode === 'won';
        blendPose(fight.pose, fight.poseTo, 1 - Math.exp(-fight.poseRate * dt), fight.pose);
        const A = watcher.actions, kneel = won ? clamp01(fight.modeT / 1.5) : 0;
        const move = Math.max(B.walk, B.run), crouch = fight.pose.crouch * (1 - move) * (1 - kneel);
        A.Walk_Loop.setEffectiveWeight(B.walk * (1 - B.run) * (1 - kneel));
        A.Sprint_Loop.setEffectiveWeight(B.run * (1 - kneel));
        A.Crouch_Idle_Loop.setEffectiveWeight(crouch);
        A.Fixing_Kneeling.setEffectiveWeight(kneel);
        A.Idle_Loop.setEffectiveWeight(Math.max(0, 1 - move - crouch - kneel));
        A.Walk_Loop.setEffectiveTimeScale(0.62 * (1 + (B.phase - 1) * 0.14));
        A.Fixing_Kneeling.setEffectiveTimeScale(0.3);
        fight.size = toward(fight.size, won ? BODY + 0.6 : BEAST + (B.phase - 1) * 0.2, 1.2, dt);
        watcher.root.position.set(B.x, 0, B.z);
        watcher.root.scale.setScalar(fight.size);
        watcher.root.rotation.set(-B.flinch * 0.08, B.yaw, 0);
        armReach = toward(armReach, won ? 1 : 1.32, 1.5, dt);
        hero.root.position.set(C.x + P.x, 0, P.z);
        hero.root.rotation.set(0, P.yaw, 0);

        // The visitor's bars
        $('meHp').style.width = P.hp + '%';
        $('meSt').style.width = Math.max(0, P.st) + '%';
        $('meHeals').textContent = '✚'.repeat(P.heals) + '·'.repeat(Math.max(0, P.maxHeals - P.heals));
        $('btnHeal').style.opacity = P.heals ? 1 : 0.35;
        B.shown = toward(B.shown, B.hp, 6, dt);
        $('bossFill').style.width = B.shown + '%';

        // ── Camera ──
        fight.shake = toward(fight.shake, 0, 5, dt);
        const jolt = fight.shake * 0.07, size = fight.size;
        const fwX = Math.sin(B.yaw), fwZ = Math.cos(B.yaw);
        if (fight.mode === 'intro' && fight.modeT < 3.6) {
            // First low and close under its chin as it gathers; then wide, from behind the visitor, for the roar
            if (fight.modeT < 1.3) { camTo.set(C.x + B.x + fwX * 4.2 + fwZ * 1.6, 0.7, B.z + fwZ * 4.2 - fwX * 1.6); look.set(C.x + B.x, 0.8 * size, B.z); }
            else { camTo.set(C.x + P.x + 2.4 + Math.sin(clockT * 47) * jolt, 1.2 + Math.cos(clockT * 53) * jolt, P.z + 5.5); look.set(C.x + B.x, 0.7 * size, B.z); }
        } else if (won) {
            // Slowly round to its face as it goes down
            const a = B.yaw + 0.5 + fight.modeT * 0.06;
            camTo.set(C.x + B.x + Math.sin(a) * 6.5, 1.6, B.z + Math.cos(a) * 6.5);
            look.set(C.x + B.x, 0.45 * size, B.z);
        } else {
            // Locked on: behind the visitor on the line from the Watcher, backing off when they are close
            let bx = P.x - B.x, bz = P.z - B.z;
            const d = Math.hypot(bx, bz) || 1;
            bx /= d; bz /= d;
            const back = 5.4 + Math.max(0, 7 - d) * 0.55;
            camTo.set(C.x + P.x + bx * back + bz * 1.1 + Math.sin(clockT * 47) * jolt, 2.7 + Math.max(0, 7 - d) * 0.22 + Math.cos(clockT * 53) * jolt, P.z + bz * back - bx * 1.1);
            look.set(C.x + mix(P.x, B.x, 0.72), mix(1.4, 0.62 * size, 0.72), mix(P.z, B.z, 0.72));
        }
        // A fixed viewpoint for checking poses (debug only)
        if (fight.view) { camTo.set(C.x + fight.view[0], fight.view[1], fight.view[2]); look.set(C.x + fight.view[3], fight.view[4], fight.view[5]); camSnap = true; }
    }

    // Poses both bodies on top of their animation, places everything that hangs off them, and tests the blade
    const _hq = new THREE.Quaternion(), _hd = V(), _ht = V();
    function fightPose(dt) {
        const C = SETS.top.position, P = fight.p, B = fight.b, size = fight.size, won = fight.mode === 'won';
        // The Watcher: body, arms, scythe
        fight.scythe = toward(fight.scythe, won ? 0 : 1 - B.hidden, 6, dt);
        poseWatcher(fight.pose, B, size, fight.scythe);
        top.scythe.visible = fight.scythe > 0.02;
        const heat = Math.max(fight.hot, B.phase === 3 ? 0.35 : 0);
        top.edge.material.color.setRGB(1, 0.16 + heat * 0.84, 0.1 + heat * 0.9);
        // The blade, while it is cutting: does it pass over the visitor?
        if (fight.cut && !B.did.hit) {
            _s.copy(rig.hand).lerp(rig.top, 0.45);
            if (Math.min(nearSeg(P.x, P.z, _s, rig.top), nearSeg(P.x, P.z, rig.top, rig.tip)) < BLADE) { B.did.hit = true; hitPlayer(fight.cut, B.x, B.z, 'blade'); }
        }
        // Coming apart: the body sinks out of sight and only the eyes are left, flung wide
        top.clip.constant = B.hidden > 0 ? (1 - B.hidden) * size * 2 : 99;
        fight.crown = toward(fight.crown, won ? 0 : fight.crownTo, 1.6, dt);
        const tw = B.yaw + fight.pose.twist, sy = Math.sin(tw), cy = Math.cos(tw);
        bones.spine_03.getWorldPosition(tmp).sub(C);
        top.crown.position.set(tmp.x - sy * 0.12 * size, tmp.y, tmp.z - cy * 0.12 * size);
        top.crown.rotation.set(fight.pose.bend, tw, 0);
        top.crown.scale.setScalar(Math.max(0.001, fight.crown * size * (1 - B.hidden)));
        // Its eyes are its health: they shut as it loses
        top.void.forEach((e, i) => {
            const u = e.userData;
            bones[u.bone].getWorldPosition(tmp).sub(C);
            const ox = u.on.x * size, oz = u.on.z * size, spread = B.hidden * (2 + (i % 5));
            e.position.set(tmp.x + ox * cy + oz * sy + Math.cos(i * 2.4) * spread, tmp.y + u.on.y * size + B.hidden * (1.5 + Math.sin(i) * 2), tmp.z - ox * sy + oz * cy + Math.sin(i * 2.4) * spread);
            e.scale.setScalar(0.2 * size);
            e.quaternion.copy(camera.quaternion);
            const want = i / top.void.length < B.hp / 100 - 0.02 ? 0.8 + 0.2 * Math.sin(clockT * 7 + u.goAt * 9) : 0;
            setOpen(e, toward(u.open, want * (1 - B.flinch * 0.7), 8, dt));
        });
        bones.Head.getWorldPosition(tmp).sub(C);
        top.gaze.position.set(tmp.x + sy * 0.11 * size, tmp.y + 0.05 * size, tmp.z + cy * 0.11 * size);
        top.gaze.scale.setScalar(0.87 * size);
        top.gaze.quaternion.copy(camera.quaternion);
        top.glow.position.set(tmp.x + sy * 1.4, tmp.y - 0.2, tmp.z + cy * 1.4);
        fight.gaze = toward(fight.gaze, won ? 0.3 : 1 - B.hidden, 3, dt);
        setOpen(top.gaze, fight.gaze * (0.92 + Math.sin(clockT * 9) * 0.08));
        top.glow.intensity = (4 + B.phase * 2.5) * fight.gaze + B.flinch * 6 + fight.hot * 5;
        top.aura.scale.set(4.4 * size, 4.2 * size, 1);
        top.aura.position.set(B.x - Math.sin(B.yaw) * 0.8, 1.15 * size, B.z - Math.cos(B.yaw) * 0.8);
        top.aura.material.opacity = (0.4 + B.phase * 0.17) * fight.gaze;

        // The visitor's guard: the blade is brought up across the body, and flicked outwards on a parry
        if (blade) {
            if (P.state === 'guard' || P.flick > 0.05) {
                hero.root.updateMatrixWorld(true);
                const s = Math.sin(P.yaw), c = Math.cos(P.yaw), k = P.flick;
                // In front of the face, a little to the off side
                _ht.set(0.06, 1.24 + k * 0.1, 0.4);
                _ht.set(_ht.x * c + _ht.z * s + C.x + P.x, _ht.y, -_ht.x * s + _ht.z * c + P.z);
                reachFor(hb.upperarm_r, hb.lowerarm_r, hb.hand_r, _ht, _p.set(-c, -0.8, s).clone());
                // The blade lies across, pointing up and to the left; on a parry it whips out to the right
                _hd.set(mix(0.75, -0.7, k), mix(0.62, 0.5, k), mix(0.2, 0.5, k)).normalize();
                _hd.set(_hd.x * c + _hd.z * s, _hd.y, -_hd.x * s + _hd.z * c);
                hb.hand_r.getWorldQuaternion(_hq);
                blade.quaternion.copy(_hq.invert()).multiply(_q.setFromUnitVectors(_t.set(0, 0, 1), _hd));
            } else blade.quaternion.identity();
        }
    }

    // The fight's last word: how it went
    const RANKS = ['—', 'D', 'C', 'B', 'A', 'S'];
    function showResult() {
        const r = fight.rank || '—', s = Math.round(fight.time);
        $('rank').textContent = r;
        $('endTitle').textContent = r === '—' ? 'THE WATCHER WAITS' : 'THE WATCHER FALLS';
        $('endLine').textContent = r === '—' ? 'You stepped past the fight.' : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} · fell ${fight.deaths} time${fight.deaths === 1 ? '' : 's'} · struck ${fight.hits} time${fight.hits === 1 ? '' : 's'} · ${fight.parries} parr${fight.parries === 1 ? 'y' : 'ies'}`;
        for (const id of ['me', 'pad', 'fell', 'phase']) $(id).hidden = true;
        document.body.classList.remove('cine');
        if (RANKS.indexOf(r) > RANKS.indexOf(store.get('aumritash-rank') || '—')) store.set('aumritash-rank', r);
        track('fight', `${r} · ${s}s · ${fight.deaths} deaths · ${fight.hits} hits · ${fight.parries} parries`);
    }

    // ── Running the shots ──
    let shot = -1, playing = false, cutting = false;
    function startShot(i) {
        shot = i;
        fired = new Set();
        cutting = false;
        canWalk = walking = false;
        hero.play(heroCls.walkIdle, { fade: 0 });
        SHOTS[i].enter();
        camSnap = true;
        fadeTo(false);
    }
    function cut(then) {
        if (cutting) return;
        cutting = true;
        walk(false);
        fadeTo(true);
        setTimeout(then, 650);
    }
    function finished() {
        // The fight is over (or was stepped past): show how it went
        playing = false;
        fight.on = false;
        $('skip').hidden = true;
        showResult();
        $('end').hidden = false;
    }
    function play() {
        $('start').hidden = true;
        $('end').hidden = true;
        $('skip').hidden = false;
        sfx.setDrone(false);
        resetFight();
        hero.mixer.timeScale = 1;
        hero.root.rotation.set(0, Math.PI, 0);
        hero.stopAll();
        if (blade) blade.quaternion.identity();
        caption('');
        playing = true;
        startShot(0);
    }
    $('climb').onclick = () => { sfx.unlock(); track('tower', 'climb'); play(); };
    $('again').onclick = () => { sfx.unlock(); fadeTo(true); setTimeout(play, 500); };
    $('skip').onclick = () => {
        if (!playing || cutting) return;
        const S = SHOTS[shot];
        if (S.name === 'fight') { S.finish(); return; }
        cut(() => {
            if (S.finish) { S.finish(); cutting = false; camSnap = true; fadeTo(false); }
            else startShot(shot + 1);
        });
    };

    const clock = new THREE.Clock();
    function frame(manual) {
        if (manual !== true) requestAnimationFrame(frame);
        // Debug: hold the scene still between hand-stepped frames, so a pose can be looked at
        if (window.__hold && manual !== true) { clock.getDelta(); return; }
        const dt = Math.min(0.1, clock.getDelta()) * timeWarp;
        clockT += dt;
        if (playing && shot >= 0 && !cutting) {
            const done = SHOTS[shot].update(dt);
            if (done) {
                const next = SHOTS[shot + 1];
                if (!next) finished();
                else if (next.seamless) { shot++; fired = new Set(); next.enter(); }
                else cut(() => startShot(shot + 1));
            }
        }
        if (hero) {
            hero.mixer.update(dt);
            watcher.mixer.update(dt);
            // Bone tweaks made by a shot have to be redone after the animation has had its say
            for (const n of ['upperarm_l', 'upperarm_r', 'lowerarm_l', 'lowerarm_r']) if (bones[n]) bones[n].scale.setScalar(armReach);
            // The fight poses both bodies on top of their animation, so it has to go after it
            if (fight.on) fightPose(dt);
            if (walking) heroSteps();
            heroLight.position.copy(hero.root.position).add(tmp.set(-0.8, 3, 1.6));
        }
        // Ease the camera towards where the shot wants it (or jump there on a cut)
        const k = camSnap ? 1 : 1 - Math.pow(fight.on ? 0.0008 : 0.03, dt);
        camera.position.lerp(camTo, k);
        lookNow.lerp(look, k);
        camera.lookAt(lookNow);
        camSnap = false;
        renderer.render(world, camera);
    }

    // ── Sound toggle (shared with the flame) ──
    let soundOn = store.get('aumritash-music') !== 'off';
    function renderSound() {
        $('sound').textContent = soundOn ? '♪ Sound on' : '♪ Sound off';
        $('sound').setAttribute('aria-pressed', String(soundOn));
    }
    sfx.setMuted(!soundOn);
    $('sound').onclick = () => { soundOn = !soundOn; store.set('aumritash-music', soundOn ? 'on' : 'off'); sfx.setMuted(!soundOn); if (soundOn) sfx.unlock(); renderSound(); };
    document.addEventListener('visibilitychange', () => sfx.pause(document.hidden));
    addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

    // ── Boot ──
    (async () => {
        try { await loadCast(); }
        catch (e) { $('loading').textContent = 'SOMETHING WENT WRONG · RELOAD'; console.error(e); return; }
        hero.root.position.set(0, 0, 11);
        camTo.set(1.3, 2.3, 16);
        look.set(0, 2, 0);
        $('loading').hidden = true;
        $('start').hidden = false;
        $('sound').hidden = false;
        renderSound();
        requestAnimationFrame(frame);
    })();

    // ?debug: drive the scene by hand when the tab can't animate
    if (location.search.includes('debug')) {
        window.__scene = {
            THREE, world, camera, cast: () => ({ hero, watcher, bones }),
            state: () => ({ shot: shot >= 0 ? SHOTS[shot].name : null, phase: shot >= 0 ? SHOTS[shot].phase : null, t: shot >= 0 ? +(SHOTS[shot].t || 0).toFixed(2) : 0, playing, walking, sfx: sfx.state() }),
            goto(i) { playing = true; $('start').hidden = true; $('end').hidden = true; startShot(i); },
            hold: on => (on ? held.add('debug') : held.delete('debug')),
            fight,
            bot(on = true, skill = 0.9, parry = false) { fight.bot = on; fight.botSkill = skill; fight.botParry = parry; },
            MOVE, POSE, rig, fx,
            // Like step, but lets the fight's script run between frames
            async run(seconds, fps = 30) {
                const real = clock.getDelta;
                for (let i = 0; i < seconds * fps; i++) { clock.getDelta = () => 1 / fps; frame(true); clock.getDelta = real; await new Promise(r => setTimeout(r, 0)); }
            },
            step(seconds, fps = 30) {
                const real = clock.getDelta;
                clock.getDelta = () => 1 / fps;
                for (let i = 0; i < seconds * fps; i++) frame(true);
                clock.getDelta = real;
            }
        };
    }
    </script>
</body>
