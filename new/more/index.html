<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Know more - Aumritash Maitra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/chapter.css">
    <script type="importmap">
        { "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        } }
    </script>
    <style>
        html, body { height: 100%; overflow: hidden; }
        body::before { display: none; }
        body { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; background: #000; }

        /* The 3D view renders at PS1-ish resolution and is blown up with hard pixels */
        #view {
            position: fixed;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        [hidden] { display: none !important; }

        .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }

        .caption {
            position: fixed;
            top: 13%;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--pixel);
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            letter-spacing: 0.2em;
            color: rgba(232, 226, 218, 0.8);
            text-shadow: 0 2px 0 #000;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.6s;
            padding: 0 1rem;
        }

        .hint {
            position: fixed;
            bottom: 7%;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--pixel);
            font-size: 1.3rem;
            letter-spacing: 0.2em;
            color: var(--dim);
            text-shadow: 0 2px 0 #000;
            z-index: 5;
            pointer-events: none;
            animation: breathe 2.4s ease-in-out infinite;
        }

        @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

        .kindle {
            position: fixed;
            bottom: 7%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: 1.8rem;
            padding: 0.5rem 1.6rem 0.4rem;
            border-color: #ffcf8a;
            color: #ffe2b8;
            box-shadow: 0 0 24px rgba(255, 140, 50, 0.35);
        }

        .kindle:hover, .kindle:focus-visible { background: #ffcf8a; color: #1a0a00; }

        /* ── Choose your origin ── */
        .origin {
            position: fixed;
            inset: 0;
            z-index: 7;
            pointer-events: none;
        }

        .origin > * { pointer-events: auto; }

        .origin-title {
            position: absolute;
            top: 9%;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--pixel);
            font-size: clamp(2rem, 5vw, 3.4rem);
            letter-spacing: 0.22em;
            color: #ffd9a0;
            text-shadow: 0 0 18px rgba(255, 150, 60, 0.45), 0 2px 0 #000;
            pointer-events: none;
        }

        .origin-panel {
            position: absolute;
            left: 50%;
            bottom: 5%;
            transform: translateX(-50%);
            width: min(560px, 92vw);
            text-align: center;
            background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.75) 25%);
            padding: 1.5rem 1rem 1rem;
        }

        .class-row { display: flex; align-items: center; justify-content: center; gap: 1rem; }

        .arrow {
            font-family: var(--pixel);
            font-size: 2.2rem;
            line-height: 1;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 0 0.6rem;
        }

        .arrow:hover, .arrow:focus-visible { color: #ffcf8a; outline: none; }

        .class-name {
            font-family: var(--pixel);
            font-size: clamp(2.4rem, 6vw, 3.4rem);
            line-height: 1;
            letter-spacing: 0.12em;
            min-width: 8ch;
        }

        .sex-row { display: flex; justify-content: center; gap: 0.6rem; margin: 0.8rem 0; }

        .sex-row .btn { min-width: 5.5rem; justify-content: center; }
        .sex-row .btn[aria-pressed="true"] { background: var(--text); color: #000; }

        .lore { color: var(--dim); font-size: 0.98rem; font-style: italic; min-height: 3.2em; margin: 0.4rem auto 1rem; max-width: 460px; }

        .begin { font-size: 1.7rem; padding: 0.5rem 2rem 0.4rem; border-color: #ffcf8a; color: #ffe2b8; }
        .begin:hover, .begin:focus-visible { background: #ffcf8a; color: #1a0a00; }

        .loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--pixel);
            font-size: 1.6rem;
            letter-spacing: 0.3em;
            color: var(--dim);
            z-index: 15;
            background: #000;
        }

        /* "Flame kindled" banner */
        .banner {
            position: fixed;
            left: 0;
            right: 0;
            top: 40%;
            transform: translateY(-50%);
            z-index: 8;
            text-align: center;
            padding: 1.4rem 1rem;
            background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.75) 20%, rgba(0, 0, 0, 0.75) 80%, transparent);
            font-family: var(--pixel);
            font-size: clamp(2.6rem, 8vw, 5rem);
            letter-spacing: 0.18em;
            color: #ffd9a0;
            text-shadow: 0 0 18px rgba(255, 150, 60, 0.8);
            opacity: 0;
            pointer-events: none;
        }

        .banner.show { animation: banner 2.8s ease forwards; }

        @keyframes banner {
            0% { opacity: 0; letter-spacing: 0.4em; }
            20% { opacity: 1; letter-spacing: 0.18em; }
            75% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Path labels floating over the courtyard exits */
        .paths-title {
            position: fixed;
            bottom: 4.2rem;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--pixel);
            font-size: 1.3rem;
            letter-spacing: 0.3em;
            color: #ffcf8a;
            text-shadow: 0 2px 0 #000;
            z-index: 6;
            pointer-events: none;
        }

        .path {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 6;
            transform: translate(-50%, -100%);
            text-decoration: none;
            text-align: center;
            border: 2px solid var(--text);
            background: rgba(0, 0, 0, 0.65);
            padding: 0.45rem 0.9rem 0.35rem;
            outline: none;
            white-space: nowrap;
            animation: fadein 0.8s ease;
        }

        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

        .path .t { display: block; font-family: var(--pixel); font-size: 1.7rem; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; }
        .path .d { display: block; font-size: 0.8rem; color: var(--dim); margin-top: 0.2rem; }
        .path::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 14px; background: var(--text); transform: translateX(-50%); }

        .path:hover, .path:focus-visible, .path.current { background: var(--text); color: #000; }
        .path:hover .d, .path:focus-visible .d, .path.current .d { color: #3a3330; }

        .change { position: fixed; right: 1.5rem; bottom: 1.2rem; z-index: 10; }

        .credit {
            position: fixed;
            left: 1rem;
            bottom: 0.6rem;
            z-index: 4;
            font-size: 0.7rem;
            color: var(--muted);
        }

        .fade {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s steps(5);
        }

        .fade.on { opacity: 1; }

        @media (max-width: 760px) {
            .path .t { font-size: 1.3rem; }
            .path .d { display: none; }
            .caption { top: 11%; }
            .hint { font-size: 1.05rem; }
            .origin-title { top: 12%; }
            .change { right: 1rem; bottom: 1rem; }
            .credit { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="view" aria-hidden="true"></canvas>

    <div class="loading" id="loading">LOADING…</div>

    <header class="top">
        <a href="../" class="btn small">&lt; Title</a>
        <button class="btn small" id="skip" hidden>Skip &gt;</button>
    </header>

    <!-- Choose your origin -->
    <section class="origin" id="origin" hidden aria-label="Choose your origin">
        <h1 class="origin-title">CHOOSE YOUR ORIGIN</h1>
        <div class="origin-panel">
            <div class="class-row">
                <button class="arrow" id="prev" aria-label="Previous origin">&lt;</button>
                <span class="class-name" id="className">WANDERER</span>
                <button class="arrow" id="next" aria-label="Next origin">&gt;</button>
            </div>
            <div class="sex-row">
                <button class="btn small" id="sexM" aria-pressed="true">Male</button>
                <button class="btn small" id="sexF" aria-pressed="false">Female</button>
            </div>
            <p class="lore" id="lore"></p>
            <button class="btn begin" id="begin">Begin</button>
        </div>
    </section>

    <p class="caption" id="caption" hidden></p>
    <p class="hint" id="hint" hidden></p>
    <button class="btn kindle" id="kindle" hidden>Kindle the flame</button>

    <div class="banner" id="banner" aria-live="polite">FLAME KINDLED</div>

    <p class="paths-title" id="pathsTitle" hidden>CHOOSE A PATH</p>
    <a class="path" id="pathWork" href="../work/" hidden><span class="t">The Work</span><span class="d">Career, case studies and results</span></a>
    <a class="path" id="pathGames" href="../games/" hidden><span class="t">The Games</span><span class="d">What I play, and what nearly broke me</span></a>
    <a class="path" id="pathStories" href="../stories/" hidden><span class="t">The Stories</span><span class="d">The fiction that shaped me</span></a>

    <button class="btn small change" id="change" hidden>Change origin</button>
    <p class="credit">Characters &amp; animations: Quaternius (CC0)</p>

    <div class="fade on" id="fade"></div>

    <script type="module">
    import * as THREE from 'three';
    import { CLASSES, loadCharacter } from '../assets/characters.js';

    const $ = id => document.getElementById(id);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const touch = matchMedia('(hover: none)').matches;
    const STORE_ORIGIN = 'aumritash-origin', STORE_KINDLED = 'aumritash-kindled';
    const store = {
        get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
        del: k => { try { localStorage.removeItem(k); } catch (e) {} }
    };

    // ── Renderer at PS1-ish resolution ──
    const canvas = $('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'low-power' });
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 120);
    function resize() {
        const scale = Math.max(2, innerHeight / 300);
        renderer.setSize(Math.ceil(innerWidth / scale), Math.ceil(innerHeight / scale), false);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
    }
    resize();
    addEventListener('resize', resize);

    // ── Small procedural textures (no image files) ──
    function noiseTexture(base, spread, size = 64, blocks = false) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        const img = g.createImageData(size, size);
        for (let i = 0; i < size * size; i++) {
            const n = (Math.random() - 0.5) * spread;
            img.data[i * 4] = base[0] + n; img.data[i * 4 + 1] = base[1] + n * 0.9; img.data[i * 4 + 2] = base[2] + n * 0.8; img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        if (blocks) {
            g.strokeStyle = 'rgba(0,0,0,0.45)';
            g.lineWidth = 1;
            for (let y = 0; y < size; y += 16) {
                g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(size, y + 0.5); g.stroke();
                const off = (y / 16) % 2 ? 0 : 16;
                for (let x = off; x < size; x += 32) { g.beginPath(); g.moveTo(x + 0.5, y); g.lineTo(x + 0.5, y + 16); g.stroke(); }
            }
        }
        const t = new THREE.CanvasTexture(c);
        t.magFilter = THREE.NearestFilter;
        t.minFilter = THREE.NearestMipmapNearestFilter;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
    }
    function glowTexture() {
        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const g = c.getContext('2d');
        const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
        grd.addColorStop(0, 'rgba(255,255,255,1)');
        grd.addColorStop(0.4, 'rgba(255,255,255,0.6)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grd;
        g.fillRect(0, 0, 32, 32);
        return new THREE.CanvasTexture(c);
    }
    const GLOW = glowTexture();

    const stoneTex = noiseTexture([92, 84, 76], 40, 64, true);
    const roughTex = noiseTexture([70, 62, 56], 50, 64);
    const groundTex = noiseTexture([42, 34, 30], 30, 64);
    const mat = (tex, repeat = 1, color = '#ffffff') => {
        const t = tex.clone(); t.needsUpdate = true; t.repeat.set(repeat, repeat);
        return new THREE.MeshLambertMaterial({ map: t, color });
    };
    const STONE = mat(stoneTex, 1), ROUGH = mat(roughTex, 1), DARK = new THREE.MeshLambertMaterial({ color: '#0d0a09' });

    // ═════════════ The world: a ruined shrine courtyard ═════════════
    const world = new THREE.Scene();
    world.background = new THREE.Color('#07060a');
    world.fog = new THREE.FogExp2('#15111a', 0.045);

    const ambient = new THREE.HemisphereLight('#6a7a9a', '#1f1612', 1.1);
    world.add(ambient);
    const moon = new THREE.DirectionalLight('#9aaed4', 0.95);
    moon.position.set(-12, 20, -8);
    world.add(moon);
    // A faint cool light that travels with the character so they always read against the dark
    const heroLight = new THREE.PointLight('#a8bce0', 2.2, 7, 1.6);
    world.add(heroLight);

    // The distant ember: a glow that cuts through the fog so you know where to walk
    const beacon = new THREE.Sprite(new THREE.SpriteMaterial({ map: null, color: '#ff7a30', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    beacon.position.set(0, 0.7, 0);
    world.add(beacon);

    const fireLight = new THREE.PointLight('#ff8a3a', 0.6, 6, 1.5);
    fireLight.position.set(0, 0.9, 0);
    world.add(fireLight);

    // Ground and paved areas
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), mat(groundTex, 40));
    ground.rotation.x = -Math.PI / 2;
    world.add(ground);
    const courtyard = new THREE.Mesh(new THREE.CircleGeometry(9.5, 24), mat(stoneTex, 6, '#9a8f86'));
    courtyard.rotation.x = -Math.PI / 2;
    courtyard.position.y = 0.01;
    world.add(courtyard);
    const road = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 32), mat(stoneTex, 1, '#8a8078'));
    road.material.map.repeat.set(1.5, 15);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.012, 24);
    world.add(road);

    const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

    function pillar(x, z, h, broken = true) {
        const g = new THREE.Group();
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, h, 8), STONE);
        shaft.position.y = h / 2;
        g.add(shaft);
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.35, 1.2), ROUGH);
        base.position.y = 0.17;
        g.add(base);
        if (broken) {
            const chunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.42, 0.5, 6), STONE);
            chunk.position.set(0.12, h + 0.2, 0);
            chunk.rotation.z = 0.35;
            g.add(chunk);
        } else {
            const cap = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.3, 1.1), ROUGH);
            cap.position.y = h + 0.15;
            g.add(cap);
        }
        g.position.set(x, 0, z);
        world.add(g);
        return g;
    }

    function wall(x, z, len, h, rotY) {
        const g = new THREE.Group();
        const n = Math.max(2, Math.round(len / 1.2));
        for (let i = 0; i < n; i++) {
            const hh = h * (0.45 + rand() * 0.55);
            const b = new THREE.Mesh(new THREE.BoxGeometry(len / n + 0.02, hh, 0.7), STONE);
            b.position.set(-len / 2 + (i + 0.5) * (len / n), hh / 2, 0);
            g.add(b);
        }
        g.position.set(x, 0, z);
        g.rotation.y = rotY;
        world.add(g);
    }

    function arch(x, z, rotY, w = 3.4, h = 3.8, collapsed = false) {
        const g = new THREE.Group();
        for (const s of [-1, 1]) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.8, h, 0.8), STONE);
            p.position.set(s * w / 2, h / 2, 0);
            g.add(p);
        }
        const top = new THREE.Mesh(new THREE.TorusGeometry(w / 2, 0.38, 4, 10, collapsed ? Math.PI * 0.55 : Math.PI), STONE);
        top.position.y = h;
        g.add(top);
        g.position.set(x, 0, z);
        g.rotation.y = rotY;
        world.add(g);
        return g;
    }

    function rubble(x, z, n, spread) {
        for (let i = 0; i < n; i++) {
            const r = 0.15 + rand() * 0.45;
            const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), ROUGH);
            m.position.set(x + (rand() - 0.5) * spread, r * 0.6, z + (rand() - 0.5) * spread);
            m.rotation.set(rand() * 3, rand() * 3, rand() * 3);
            world.add(m);
        }
    }

    // The road in: broken pillars either side, a collapsed gateway arch
    for (let z = 30; z > 10; z -= 4) {
        pillar(-3.2, z + rand(), 1.5 + rand() * 3.2);
        pillar(3.2, z + rand(), 1.2 + rand() * 3.6);
        rubble(-4.5, z, 3, 2);
        rubble(4.5, z, 3, 2);
    }
    arch(0, 17, 0, 4.2, 4.2, true);
    rubble(1.8, 16.4, 6, 1.6);

    // The courtyard: a ring of ruined walls with three exits (west, north, east) and the road in (south)
    const R = 9.4;
    const exits = [Math.PI, Math.PI * 1.5, 0, Math.PI / 2];   // west, north, east, south (angles around the fire)
    for (let i = 0; i < 4; i++) {
        const a0 = exits[i] + 0.32, a1 = exits[(i + 1) % 4] + (i === 3 ? Math.PI * 2 : 0) - 0.32;
        const steps = 3;
        for (let s = 0; s < steps; s++) {
            const a = a0 + (a1 - a0) * (s + 0.5) / steps;
            const len = R * (a1 - a0) / steps * 1.05;
            wall(Math.cos(a) * R, Math.sin(a) * R, len, 2.4 + rand() * 1.6, -a + Math.PI / 2);
        }
    }
    for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + 0.39;
        pillar(Math.cos(a) * 6.6, Math.sin(a) * 6.6, 1.2 + rand() * 3.5, rand() < 0.75);
    }
    rubble(-5, -4, 5, 2.5);
    rubble(5, 4.5, 4, 2);

    // West exit: a dark doorway (The Work)
    arch(-R, 0, Math.PI / 2, 2.6, 3.6);
    const door = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 4.8), DARK);
    door.position.set(-R - 0.45, 2.4, 0);
    door.rotation.y = Math.PI / 2;
    world.add(door);

    // North exit: stairs climbing into the dark (The Games)
    for (let i = 0; i < 7; i++) {
        const st = new THREE.Mesh(new THREE.BoxGeometry(3, 0.32, 0.9), STONE);
        st.position.set(0, 0.16 + i * 0.32, -R - 0.2 - i * 0.85);
        st.scale.y = 1 + i;
        st.position.y = (0.32 * (1 + i)) / 2;
        world.add(st);
    }
    pillar(-2, -R - 1, 3.4, true);
    pillar(2, -R - 1, 2.2, true);

    // East exit: a broken bridge out over nothing (The Stories)
    for (let i = 0; i < 9; i++) {
        if (i === 6) continue;
        const pl = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.16, 2.2), ROUGH);
        pl.position.set(R + 0.6 + i * 0.9, 0.08 - (i > 6 ? 0.25 : 0), (rand() - 0.5) * 0.15);
        pl.rotation.y = (rand() - 0.5) * 0.12;
        world.add(pl);
    }
    for (let i = 0; i < 4; i++) for (const s of [-1, 1]) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.9 + rand() * 0.5, 0.14), ROUGH);
        post.position.set(R + 0.8 + i * 2, 0.5, s * 1.1);
        world.add(post);
    }

    // Far silhouettes so the fog has depth
    for (let i = 0; i < 10; i++) {
        const a = rand() * Math.PI * 2, d = 26 + rand() * 18, h = 6 + rand() * 14;
        const t = new THREE.Mesh(new THREE.BoxGeometry(2 + rand() * 4, h, 2 + rand() * 4), DARK);
        t.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
        if (Math.abs(Math.cos(a) * d) < 6 && Math.sin(a) > 0) continue;   // keep the road clear
        world.add(t);
    }

    // The cairn and brazier at the centre, and a broken column drum to sit on
    for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2;
        const st = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28 + rand() * 0.12, 0), ROUGH);
        st.position.set(Math.cos(a) * 0.75, 0.18, Math.sin(a) * 0.75);
        st.rotation.set(rand() * 3, rand() * 3, rand() * 3);
        world.add(st);
    }
    const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.32, 0.38, 8, 1, true), new THREE.MeshLambertMaterial({ color: '#2a2220', side: THREE.DoubleSide }));
    bowl.position.y = 0.42;
    world.add(bowl);
    const SEAT = new THREE.Vector3(1.75, 0, 1.75);
    const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.46, 8), STONE);
    seat.position.set(SEAT.x + 0.25, 0.23, SEAT.z + 0.25);
    world.add(seat);

    // ── Fire, embers and smoke as additive points ──
    const FIRE_N = touch ? 70 : 120;
    const fireGeo = new THREE.BufferGeometry();
    const fPos = new Float32Array(FIRE_N * 3), fCol = new Float32Array(FIRE_N * 3);
    const fState = Array.from({ length: FIRE_N }, () => ({ life: Math.random(), x: 0, z: 0, vy: 0, vx: 0, vz: 0 }));
    fireGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
    fireGeo.setAttribute('color', new THREE.BufferAttribute(fCol, 3));
    const fire = new THREE.Points(fireGeo, new THREE.PointsMaterial({ size: 0.42, map: GLOW, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
    world.add(fire);
    beacon.material.map = GLOW;

    // Ash drifting through the air
    const ASH_N = touch ? 120 : 220;
    const ashGeo = new THREE.BufferGeometry();
    const aPos = new Float32Array(ASH_N * 3);
    for (let i = 0; i < ASH_N; i++) { aPos[i * 3] = (Math.random() - 0.5) * 40; aPos[i * 3 + 1] = Math.random() * 10; aPos[i * 3 + 2] = Math.random() * 40 - 12; }
    ashGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
    world.add(new THREE.Points(ashGeo, new THREE.PointsMaterial({ size: 0.05, color: '#9a8f86', transparent: true, opacity: 0.6, depthWrite: false })));

    // Red eyes in the dark, until the flame is lit
    const lurkers = [];
    const eyeMat = new THREE.SpriteMaterial({ map: GLOW, color: '#ff2020', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
    function spawnLurker(near) {
        const g = new THREE.Group();
        for (const s of [-1, 1]) {
            const sp = new THREE.Sprite(eyeMat.clone());
            sp.scale.set(0.22, 0.12, 1);
            sp.position.x = s * 0.17;
            g.add(sp);
        }
        const side = Math.random() < 0.5 ? -1 : 1;
        g.position.set(side * (5 + Math.random() * 7), 1 + Math.random() * 1.6, near - 4 - Math.random() * 10);
        g.userData = { born: performance.now(), life: 1600 + Math.random() * 2200 };
        world.add(g);
        lurkers.push(g);
    }

    // ═════════════ Origin select stage ═════════════
    const stage = new THREE.Scene();
    stage.background = new THREE.Color('#050406');
    stage.fog = new THREE.Fog('#050406', 6, 14);
    stage.add(new THREE.HemisphereLight('#6a7aa0', '#140c08', 0.5));
    const torch = new THREE.PointLight('#ff9a4a', 9, 9, 1.6);
    torch.position.set(1.4, 2.3, -0.6);
    stage.add(torch);
    const rim = new THREE.DirectionalLight('#8aa0d0', 0.7);
    rim.position.set(-3, 4, -4);
    stage.add(rim);
    const dais = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.6, 0.4, 10), STONE);
    dais.position.y = -0.2;
    stage.add(dais);
    const torchGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: '#ff9a4a', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    torchGlow.scale.set(0.35, 0.35, 1);
    // A warm fill from the front so faces read
    const fill = new THREE.PointLight('#ffb070', 3, 8, 1.8);
    fill.position.set(-1.2, 1.6, 2.6);
    stage.add(fill);
    torchGlow.position.copy(torch.position);
    stage.add(torchGlow);

    // ═════════════ State ═════════════
    let mode = 'loading';       // loading → select → walk → arrived → kindling → resting → leaving
    let hero = null, heroCls = null;
    let selIndex = 0;            // index into the class names (Wanderer, Wretch)
    let selSex = 'm';
    const NAMES = [...new Set(CLASSES.map(c => c.name))];
    const pickClass = () => CLASSES.find(c => c.name === NAMES[selIndex] && c.sex === selSex);
    let stageChar = null, stageLoadToken = 0;
    let lit = false, litAt = 0, kindleAt = 0;
    const held = new Set();
    let wheelBoost = 0;

    const saved = store.get(STORE_ORIGIN);
    const savedCls = CLASSES.find(c => c.id === saved);
    if (savedCls) { selIndex = NAMES.indexOf(savedCls.name); selSex = savedCls.sex; }
    const kindled = store.get(STORE_KINDLED) === '1' && savedCls;

    // ── Origin UI ──
    function updateOriginUI() {
        const c = pickClass();
        $('className').textContent = c.name.toUpperCase();
        $('lore').textContent = c.lore;
        $('sexM').setAttribute('aria-pressed', String(selSex === 'm'));
        $('sexF').setAttribute('aria-pressed', String(selSex === 'f'));
        showOnStage(c);
    }
    async function showOnStage(c) {
        const token = ++stageLoadToken;
        const ch = await loadCharacter(c);
        if (token !== stageLoadToken) return;
        if (stageChar) stage.remove(stageChar.root);
        stageChar = ch;
        stage.add(ch.root);
        ch.play(c.pose, { fade: 0 });
    }
    $('prev').onclick = () => { selIndex = (selIndex + NAMES.length - 1) % NAMES.length; updateOriginUI(); };
    $('next').onclick = () => { selIndex = (selIndex + 1) % NAMES.length; updateOriginUI(); };
    $('sexM').onclick = () => { selSex = 'm'; updateOriginUI(); };
    $('sexF').onclick = () => { selSex = 'f'; updateOriginUI(); };
    $('begin').onclick = () => begin();
    addEventListener('keydown', e => {
        if (mode !== 'select') return;
        if (e.key === 'ArrowLeft') $('prev').click();
        else if (e.key === 'ArrowRight') $('next').click();
        else if (e.key === 'Enter' && document.activeElement === document.body) begin();
    });

    async function begin() {
        heroCls = pickClass();
        store.set(STORE_ORIGIN, heroCls.id);
        fadeTo(true);
        await sleep(450);
        await spawnHero(heroCls);
        $('origin').hidden = true;
        startWalk();
        fadeTo(false);
    }

    async function spawnHero(c) {
        if (hero) world.remove(hero.root);
        hero = await loadCharacter(c);
        world.add(hero.root);
    }

    // ── Walking ──
    const START_Z = 30, STOP_Z = 2.4, SPEED = 1.55;
    function startWalk() {
        mode = 'walk';
        hero.root.position.set(0, 0, START_Z);
        hero.root.rotation.y = Math.PI;
        hero.play('Idle_Loop', { fade: 0 });
        $('caption').hidden = false;
        $('caption').textContent = 'A flame flickers in the distance';
        $('hint').hidden = false;
        $('hint').textContent = touch ? 'HOLD THE SCREEN TO WALK' : 'HOLD CLICK · W · ↑ · OR SCROLL TO WALK';
        $('skip').hidden = false;
        camera.position.set(0.8, 2.1, START_Z + 4.4);
    }

    const isUI = t => t.closest && t.closest('button, a, .origin');
    addEventListener('pointerdown', e => { if (!isUI(e.target)) held.add('pointer'); });
    addEventListener('pointerup', () => held.delete('pointer'));
    addEventListener('pointercancel', () => held.delete('pointer'));
    addEventListener('blur', () => held.clear());
    addEventListener('contextmenu', e => { if (!isUI(e.target)) e.preventDefault(); });
    addEventListener('keydown', e => {
        if (mode === 'walk' && ['w', 'W', 'ArrowUp', ' '].includes(e.key)) { held.add(e.key); e.preventDefault(); }
        if (mode === 'arrived' && ['e', 'E', 'Enter'].includes(e.key)) { e.preventDefault(); kindle(); }
    });
    addEventListener('keyup', e => held.delete(e.key));
    addEventListener('wheel', e => { if (mode === 'walk' && e.deltaY > 0) wheelBoost = Math.min(1.2, wheelBoost + e.deltaY * 0.004); }, { passive: true });

    $('skip').onclick = () => { if (mode === 'walk') { hero.root.position.z = STOP_Z; arrive(); } };

    function arrive() {
        mode = 'arrived';
        hero.play('Idle_Loop');
        $('hint').hidden = true;
        $('skip').hidden = true;
        $('caption').textContent = 'An unlit flame. Warmth, waiting.';
        $('kindle').hidden = false;
        if (!touch) $('kindle').focus({ preventScroll: true });
    }

    $('kindle').onclick = () => kindle();
    function kindle() {
        if (mode !== 'arrived') return;
        mode = 'kindling';
        kindleAt = performance.now();
        $('kindle').hidden = true;
        $('caption').style.opacity = 0;
        hero.play('Fixing_Kneeling', { fade: 0.4 });
        store.set(STORE_KINDLED, '1');
        // The flame catches a beat after the hand reaches it
        setTimeout(() => { lit = true; litAt = performance.now(); $('banner').classList.add('show'); }, reduce ? 0 : 1300);
        setTimeout(sitDown, reduce ? 400 : 3400);
    }

    function sitDown() {
        mode = 'resting';
        // Step to the column drum and sit facing the fire
        hero.root.position.copy(SEAT);
        hero.root.rotation.y = Math.atan2(-SEAT.x, -SEAT.z);
        const enter = hero.play('Sitting_Enter', { fade: 0.25, once: true });
        const onDone = e => { if (e.action === enter) { hero.mixer.removeEventListener('finished', onDone); hero.play('Sitting_Idle_Loop', { fade: 0.2 }); } };
        hero.mixer.addEventListener('finished', onDone);
        showPaths();
    }

    // ── Paths around the fire ──
    const PATHS = [
        { el: $('pathWork'), at: new THREE.Vector3(-R + 0.4, 3.9, 0), go: new THREE.Vector3(-R - 1, 0, 0) },
        { el: $('pathGames'), at: new THREE.Vector3(0, 4.2, -R - 2), go: new THREE.Vector3(0, 0, -R - 1) },
        { el: $('pathStories'), at: new THREE.Vector3(R + 2.2, 2.4, 0), go: new THREE.Vector3(R + 2, 0, 0) }
    ];
    let pathIdx = 0;
    function showPaths() {
        $('pathsTitle').hidden = false;
        $('change').hidden = false;
        PATHS.forEach(p => { p.el.hidden = false; });
        selectPath(0);
    }
    function selectPath(i) {
        pathIdx = (i + PATHS.length) % PATHS.length;
        PATHS.forEach((p, n) => p.el.classList.toggle('current', n === pathIdx));
    }
    PATHS.forEach((p, i) => {
        p.el.addEventListener('mouseenter', () => selectPath(i));
        p.el.addEventListener('focus', () => selectPath(i));
        p.el.addEventListener('click', e => { e.preventDefault(); travel(i); });
    });
    addEventListener('keydown', e => {
        if (mode !== 'resting') return;
        if (['ArrowRight', 'ArrowDown'].includes(e.key)) { selectPath(pathIdx + 1); PATHS[pathIdx].el.focus(); e.preventDefault(); }
        else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) { selectPath(pathIdx - 1); PATHS[pathIdx].el.focus(); e.preventDefault(); }
        else if (e.key === 'Enter' && document.activeElement === document.body) travel(pathIdx);
    });

    let leaveTo = null;
    function travel(i) {
        if (mode === 'leaving') return;
        mode = 'leaving';
        const p = PATHS[i];
        leaveTo = p.go;
        PATHS.forEach(q => { q.el.hidden = true; });
        $('pathsTitle').hidden = true;
        $('change').hidden = true;
        hero.root.rotation.y = Math.atan2(p.go.x - hero.root.position.x, p.go.z - hero.root.position.z);
        hero.play('Walk_Loop', { fade: 0.3 });
        setTimeout(() => fadeTo(true), 900);
        setTimeout(() => { location.href = p.el.href; }, 1500);
    }

    $('change').onclick = () => {
        store.del(STORE_KINDLED);
        store.del(STORE_ORIGIN);
        location.reload();
    };

    // ── Helpers ──
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function fadeTo(on) { $('fade').classList.toggle('on', on); }

    // ── Main loop ──
    const clock = new THREE.Clock();
    const camTarget = new THREE.Vector3(), camLook = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3();
    const REST_CAM = new THREE.Vector3(0.5, 7.2, 13.5), REST_LOOK = new THREE.Vector3(0, 0.8, -1.5);
    let nextLurker = 0;

    function updateFire(dt, t) {
        const strength = lit ? Math.min(1, (performance.now() - litAt) / 600) : 0;
        const flare = lit ? 1 + Math.max(0, 1 - (performance.now() - litAt) / 900) * 1.2 : 0;
        const active = lit ? FIRE_N : 6;
        for (let i = 0; i < FIRE_N; i++) {
            const p = fState[i];
            if (i >= active) { fPos[i * 3 + 1] = -10; continue; }
            p.life += dt * (lit ? 1.4 + (i % 5) * 0.12 : 0.5);
            if (p.life >= 1) {
                p.life = 0;
                const r = lit ? 0.32 : 0.12;
                p.x = (Math.random() - 0.5) * r; p.z = (Math.random() - 0.5) * r;
                p.vx = (Math.random() - 0.5) * 0.25; p.vz = (Math.random() - 0.5) * 0.25;
                p.vy = lit ? 1.1 + Math.random() * 0.9 : 0.3;
            }
            const l = p.life, pull = 1 - l * 0.85;
            fPos[i * 3] = (p.x * pull + p.vx * l + Math.sin(t * 7 + i) * 0.03) * flare;
            fPos[i * 3 + 1] = 0.55 + p.vy * l * (lit ? 0.9 * flare : 0.6);
            fPos[i * 3 + 2] = (p.z * pull + p.vz * l) * flare;
            const fade = Math.sin(Math.PI * Math.min(1, l * 1.1));
            const c = lit ? [1, 0.9 - l * 0.6, 0.45 - l * 0.45] : [0.9, 0.3, 0.08];
            const k = lit ? fade * (0.9 + 0.1 * strength) : fade * 0.6;
            fCol[i * 3] = c[0] * k; fCol[i * 3 + 1] = c[1] * k; fCol[i * 3 + 2] = Math.max(0, c[2]) * k;
        }
        fireGeo.attributes.position.needsUpdate = true;
        fireGeo.attributes.color.needsUpdate = true;
        const flick = 0.85 + 0.1 * Math.sin(t * 17) + 0.05 * Math.sin(t * 31);
        fireLight.intensity = lit ? (22 * strength * flick * Math.max(1, flare * 0.8)) : 0.6 + 0.3 * Math.sin(t * 3);
        fireLight.distance = lit ? 16 : 4;
        world.fog.density = lit ? 0.035 : 0.045;
        // Beacon: big and soft from afar, fading as the real flame takes over
        const dist = hero ? hero.root.position.distanceTo(beacon.position) : 20;
        const b = lit ? 1.6 + 0.2 * flick : Math.min(2.4, 0.5 + dist * 0.07) * (0.85 + 0.15 * Math.sin(t * 3));
        beacon.scale.set(b, b, 1);
        beacon.material.opacity = lit ? 0.35 : 0.9;
    }

    function frame(manual) {
        if (manual !== true) requestAnimationFrame(frame);
        const dt = Math.min(0.1, clock.getDelta());
        const t = clock.elapsedTime;

        if (mode === 'select') {
            // Sway slowly around the front of the character, like a creation screen
            const a = Math.sin(t * 0.3) * 0.65;
            camera.position.set(Math.sin(a) * 5.4, 1.35, Math.cos(a) * 5.4);
            camera.lookAt(0, innerWidth < 760 ? 0.35 : 0.55, 0);
            torch.intensity = 8 + Math.sin(t * 13) * 0.8 + Math.sin(t * 29) * 0.5;
            if (stageChar) stageChar.mixer.update(dt);
            renderer.render(stage, camera);
            return;
        }

        if (hero) {
            if (mode === 'walk') {
                const moving = held.size > 0 || wheelBoost > 0.05;
                if (moving) {
                    hero.play('Walk_Loop', { fade: 0.25 });
                    hero.root.position.z -= SPEED * dt * (held.size > 0 ? 1 : wheelBoost);
                } else {
                    hero.play('Idle_Loop', { fade: 0.35 });
                }
                wheelBoost *= Math.pow(0.15, dt);
                const z = hero.root.position.z;
                const p = 1 - (z - STOP_Z) / (START_Z - STOP_Z);
                const cap = p < 0.3 ? 'A flame flickers in the distance' : p < 0.75 ? 'Keep walking' : 'Almost there';
                if ($('caption').textContent !== cap) $('caption').textContent = cap;
                if (z <= STOP_Z) { hero.root.position.z = STOP_Z; arrive(); }
            }
            if (mode === 'leaving' && leaveTo) {
                tmp.copy(leaveTo).sub(hero.root.position).setY(0);
                if (tmp.length() > 0.2) hero.root.position.addScaledVector(tmp.normalize(), SPEED * dt);
            }
            hero.mixer.update(dt);

            // Camera: follow from behind while walking, swing wide over the courtyard once resting
            const hp = hero.root.position;
            heroLight.position.set(hp.x - 1.2, 3.2, hp.z + 1.8);
            heroLight.intensity = lit ? 0.8 : 2.2;
            if (mode === 'walk' || mode === 'arrived' || mode === 'kindling') {
                // Over the right shoulder, high enough to see the flame ahead
                camTarget.set(hp.x + 1.3, 2.5, hp.z + 4.4);
                tmp.set(hp.x - 0.3, 1.5, hp.z - 4);
                if (mode === 'kindling') { camTarget.set(hp.x + 2.6, 1.9, hp.z + 2.6); tmp.set(0, 0.7, 0); }
            } else {
                camTarget.copy(REST_CAM);
                tmp.copy(REST_LOOK);
            }
            const k = 1 - Math.pow(mode === 'walk' ? 0.02 : 0.25, dt);
            camera.position.lerp(camTarget, k);
            camLook.lerp(tmp, k);
            if (mode === 'walk' && !reduce && held.size) camera.position.y += Math.sin(t * 9) * 0.008;
            camera.lookAt(camLook);

            // Lurkers stay out of the light
            if (!lit && !reduce && performance.now() > nextLurker) { spawnLurker(hp.z); nextLurker = performance.now() + 1400 + Math.random() * 2600; }
        }
        for (let i = lurkers.length - 1; i >= 0; i--) {
            const g = lurkers[i], u = (performance.now() - g.userData.born) / g.userData.life;
            if (u > 1 || lit) { world.remove(g); lurkers.splice(i, 1); continue; }
            const open = Math.min(1, u * 6, (1 - u) * 6);
            g.children.forEach(s => { s.scale.y = 0.12 * Math.max(0.05, open); });
        }

        // Ash drifts
        for (let i = 0; i < ASH_N; i++) {
            aPos[i * 3] -= dt * 0.25;
            aPos[i * 3 + 1] -= dt * 0.18;
            if (aPos[i * 3 + 1] < 0) { aPos[i * 3 + 1] = 10; aPos[i * 3] = (Math.random() - 0.5) * 40 + camera.position.x; aPos[i * 3 + 2] = camera.position.z - Math.random() * 30; }
        }
        ashGeo.attributes.position.needsUpdate = true;

        updateFire(dt, t);
        renderer.render(world, camera);

        // Keep the path labels pinned over their exits
        if (mode === 'resting') {
            for (const p of PATHS) {
                tmp.copy(p.at).project(camera);
                const vis = tmp.z < 1;
                p.el.style.visibility = vis ? 'visible' : 'hidden';
                // Keep the whole label on screen
                const half = p.el.offsetWidth / 2 + 10;
                const x = Math.min(innerWidth - half, Math.max(half, (tmp.x * 0.5 + 0.5) * innerWidth));
                const y = Math.min(innerHeight - 60, Math.max(p.el.offsetHeight + 70, (-tmp.y * 0.5 + 0.5) * innerHeight));
                p.el.style.left = x + 'px';
                p.el.style.top = y + 'px';
            }
        }
    }

    // ── Boot ──
    (async () => {
        try {
            if (kindled) {
                // Returning visitor: straight to the lit fire with their origin resting
                heroCls = savedCls;
                await spawnHero(heroCls);
                lit = true;
                litAt = performance.now() - 5000;
                mode = 'resting';
                hero.root.position.copy(SEAT);
                hero.root.rotation.y = Math.atan2(-SEAT.x, -SEAT.z);
                hero.play('Sitting_Idle_Loop', { fade: 0 });
                camera.position.copy(REST_CAM);
                camLook.copy(REST_LOOK);
                showPaths();
            } else {
                mode = 'select';
                $('origin').hidden = false;
                await showOnStage(pickClass());
                updateOriginUI();
                // Warm the cache for the other origins in the background
                CLASSES.forEach(c => loadCharacter(c).catch(() => {}));
            }
        } catch (e) {
            $('loading').textContent = 'SOMETHING WENT WRONG · RELOAD';
            console.error(e);
            return;
        }
        $('loading').hidden = true;
        fadeTo(false);
        requestAnimationFrame(frame);
    })();

    // ?debug: drive the scene by hand when the tab can't animate (background testing)
    if (location.search.includes('debug')) {
        window.__scene = {
            state: () => ({ mode, lit, z: hero && +hero.root.position.z.toFixed(2), cls: heroCls?.id }),
            hold: on => (on ? held.add('debug') : held.delete('debug')),
            step(seconds, fps = 30) {
                const real = clock.getDelta;
                clock.getDelta = () => 1 / fps;
                for (let i = 0; i < seconds * fps; i++) { clock.elapsedTime += 1 / fps; frame(true); }
                clock.getDelta = real;
            }
        };
    }
    </script>
</body>
</html>
