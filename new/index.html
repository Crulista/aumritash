<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Aumritash Maitra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff1a1a;
            --white: #f2f2f2;
            --linkedin: #0a66c2;
            --dub: #f4632b;
            --dub-brow: #c0391a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: #050505;
            color: var(--white);
            font-family: 'VT323', monospace;
            overflow: hidden;
            cursor: crosshair;
            -webkit-tap-highlight-color: transparent;
        }

        /* The whole scene is drawn small and blown up, PSX-style */
        #screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body.hit #screen { animation: hit 0.18s steps(3) 1; }

        @keyframes hit {
            0% { transform: translate(0, 0); }
            33% { transform: translate(-6px, 3px); }
            66% { transform: translate(5px, -4px); }
            100% { transform: translate(0, 0); }
        }

        /* Scanlines on top of everything */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.35) 0 1px, transparent 1px 3px);
        }

        .name {
            position: fixed;
            top: 1.7rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            letter-spacing: 0.4em;
            color: rgba(242, 242, 242, 0.35);
            z-index: 5;
            white-space: nowrap;
        }

        .caption {
            position: fixed;
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            letter-spacing: 0.25em;
            color: var(--red);
            text-shadow: 2px 0 rgba(0, 255, 255, 0.35), -2px 0 rgba(255, 0, 0, 0.8);
            z-index: 5;
            pointer-events: none;
            animation: jitter 0.12s steps(2) infinite;
        }

        body.state-linkedin .caption,
        body.state-dubdub .caption { color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35); animation: none; }

        @keyframes jitter {
            0% { transform: translate(0, 0); }
            50% { transform: translate(1px, -1px); }
        }

        /* ── Corner buttons: ULTRAKILL menu style (white box, inverts on hover) ── */
        .corner {
            position: fixed;
            z-index: 10;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .tl { top: 2rem; left: 2rem; }
        .tr { top: 2rem; right: 2rem; align-items: flex-end; }
        .bl { bottom: 2rem; left: 2rem; flex-direction: column-reverse; }
        .br { bottom: 2rem; right: 2rem; align-items: flex-end; flex-direction: column-reverse; }

        .btn {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            line-height: 1;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--white);
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid var(--white);
            padding: 0.4rem 1.4rem 0.35rem;
            min-width: 11rem;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            white-space: nowrap;
        }

        .sub {
            font-size: 1rem;
            letter-spacing: 0.2em;
            color: rgba(242, 242, 242, 0.45);
        }

        .corner:hover .btn, .corner.active .btn {
            background: var(--white);
            color: #000;
        }

        .corner:hover .sub, .corner.active .sub { color: var(--red); }

        .corner:active .btn { background: var(--red); border-color: var(--red); color: #000; }

        .tr.active .btn { border-style: dashed; background: transparent; color: var(--red); border-color: var(--red); }

        .brand { display: none; }

        body.flooded .corner:not(.active) { opacity: 0.4; }

        /* LinkedIn: the button turns into LinkedIn */
        .tl.active .btn {
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0;
            text-transform: none;
            background: #fff;
            color: var(--linkedin);
            border-color: #fff;
            border-radius: 999px;
            padding: 0.5rem 1.2rem 0.5rem 0.55rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            min-width: 0;
        }

        .in-badge {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: var(--linkedin);
            color: #fff;
            font-weight: 700;
            font-size: 1.15rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* dubdub: the button turns into dubdub */
        .bl.active .btn {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: 0;
            text-transform: none;
            background: #fff8f0;
            color: var(--dub);
            border-color: #fff8f0;
            border-radius: 18px;
            box-shadow: 0 6px 0 var(--dub-brow);
            padding: 0.35rem 1.2rem 0.35rem 0.55rem;
            min-width: 0;
        }

        .dub-icon { width: 34px; height: 34px; }

        .corner.active .plain { display: none; }
        .corner.active .brand { display: inline-flex; align-items: center; gap: 0.6rem; }

        /* ── Style meter ── */
        .style {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 13rem;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .style.on { opacity: 1; }

        .style-label {
            font-size: 1rem;
            letter-spacing: 0.3em;
            color: rgba(242, 242, 242, 0.5);
        }

        .style-rank {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            line-height: 1;
        }

        .style-letter { font-size: 4.2rem; text-shadow: 3px 3px 0 #000; }
        .style-word { font-size: 1.5rem; letter-spacing: 0.12em; }

        .style-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            margin-top: 0.3rem;
        }

        .style-bar span { display: block; height: 100%; width: 0; }

        .style.bump .style-letter { animation: bump 0.2s ease-out; }

        @keyframes bump {
            0% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }

        /* ── Phones ── */
        @media (max-width: 640px) {
            .tl { top: 1rem; left: 1rem; }
            .tr { top: 1rem; right: 1rem; }
            .bl { bottom: 1rem; left: 1rem; }
            .br { bottom: 1rem; right: 1rem; }
            .btn { font-size: 1.35rem; padding: 0.3rem 0.7rem 0.25rem; min-width: 0; }
            .sub { font-size: 0.85rem; letter-spacing: 0.1em; }
            .tl.active .btn { font-size: 0.9rem; }
            .bl.active .btn { font-size: 1rem; }
            .in-badge { width: 24px; height: 24px; font-size: 0.95rem; }
            .dub-icon { width: 26px; height: 26px; }
            .name { top: 5.2rem; font-size: 0.95rem; letter-spacing: 0.25em; }
            .style { right: 1rem; top: auto; bottom: 6.5rem; transform: none; width: 9rem; }
            .style-letter { font-size: 2.8rem; }
            .style-word { font-size: 1.1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .caption, body.hit #screen { animation: none !important; }
        }
    </style>
</head>
<body class="state-idle">
    <canvas id="screen" aria-hidden="true"></canvas>

                    <path fill="url(#dubFlame)" d="M22,86 C11,79 13,55 21,45 C25,33 33,31 37,38 C39,27 47,26 51,35 C55,18 70,14 74,30 C75,20 82,19 86,28 C91,42 89,68 83,79 C79,86 70,89 60,89 L34,89 C29,89 25,88 22,86 Z"/>
                    <ellipse cx="37" cy="62" rx="8" ry="10" fill="#efebe4"/><ellipse cx="60" cy="61" rx="8" ry="10" fill="#efebe4"/>
                    <circle cx="38" cy="64" r="5" fill="#3a241c"/><circle cx="61" cy="63" r="5" fill="#3a241c"/>

    <!-- Bottom right: Know more -->

    <script>
    (() => {
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const body = document.body;
        const captionEl = document.getElementById('caption');
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const touch = matchMedia('(hover: none)').matches;

        // ── Low-res canvas: P screen pixels per canvas pixel ──
        let P, cw, ch, u, cx, cy;
        function resize() {
            P = Math.max(2, Math.round(Math.min(innerWidth, innerHeight) / 160));
            cw = Math.ceil(innerWidth / P);
            ch = Math.ceil(innerHeight / P);
            canvas.width = cw;
            canvas.height = ch;
            u = Math.min(cw, ch) / 100;
            cx = cw / 2;
            cy = ch * 0.44;
            captionEl.style.top = ((cy + 40 * u) * P) + 'px';
        }
        resize();
        addEventListener('resize', resize);

        // Seeded random so veins and teeth stay the same every frame
        function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

        function makeVeins(seed) {
            const r = rng(seed), veins = [];
            for (let i = 0; i < 9; i++) {
                const side = r() < 0.5 ? -1 : 1;
                let x = side * (0.95 + r() * 0.1), y = (r() - 0.5) * 0.8;
                const pts = [[x, y]];
                for (let s = 0; s < 4; s++) {
                    x -= side * (0.12 + r() * 0.15);
                    y += (r() - 0.5) * 0.35;
                    pts.push([x, y]);
                }
                veins.push(pts);
            }
            return veins;
        }

        const eyes = [
            { side: -1, veins: makeVeins(7), lx: 0, ly: 0 },
            { side: 1, veins: makeVeins(19), lx: 0, ly: 0 }
        ];
        const toothRand = rng(42);
        const toothLen = Array.from({ length: 40 }, () => 0.7 + toothRand() * 0.6);

        // ── Input ──
        let pointer = null, lastMove = performance.now(), lastSpeed = 0;
        addEventListener('pointermove', e => {
            const p = { x: e.clientX / P, y: e.clientY / P };
            if (pointer) lastSpeed = Math.hypot(p.x - pointer.x, p.y - pointer.y);
            if (performance.now() - lastMove > 6000) glitch(260);
            pointer = p;
            lastMove = performance.now();
            addStyle(Math.min(lastSpeed, 20) * 0.35);
        });
        addEventListener('pointerdown', e => {
            pointer = { x: e.clientX / P, y: e.clientY / P };
            lastMove = performance.now();
        });

        // ── State ──
        let state = 'idle', stateSince = performance.now();
        const flood = { color: null, x: 0, y: 0, p: 0, target: 0 };
        const FLOODS = { linkedin: '#0a66c2', dubdub: 'dub' };

        function setState(name, corner) {
            if (name === state) return;
            state = name;
            stateSince = performance.now();
            body.className = 'state-' + name + (FLOODS[name] ? ' flooded' : '');
            document.querySelectorAll('.corner').forEach(c => c.classList.toggle('active', c === corner));
            if (FLOODS[name]) {
                const r = corner.getBoundingClientRect();
                flood.color = FLOODS[name];
                flood.x = (r.left + r.width / 2) / P;
                flood.y = (r.top + r.height / 2) / P;
                flood.target = 1;
            } else {
                flood.target = 0;
            }
            if (name !== 'idle') { hit(); addStyle(45); }
            glitch(name === 'idle' ? 90 : 160);
        }

        function hit() {
            if (reduce) return;
            body.classList.remove('hit');
            void body.offsetWidth;
            body.classList.add('hit');
        }

        document.querySelectorAll('.corner').forEach(corner => {
            if (!touch) {
                corner.addEventListener('mouseenter', () => setState(corner.dataset.state, corner));
                corner.addEventListener('mouseleave', () => setState('idle', null));
                corner.addEventListener('focus', () => setState(corner.dataset.state, corner));
                corner.addEventListener('blur', () => setState('idle', null));
            }
            corner.addEventListener('click', e => {
                // Phones have no hover: first tap shows the reaction, second tap follows the link
                if (touch && !corner.classList.contains('active')) {
                    e.preventDefault();
                    setState(corner.dataset.state, corner);
                }
                if (corner.getAttribute('href') === '#') { e.preventDefault(); glitch(300); hit(); }
            });
        });
        if (touch) document.addEventListener('click', e => { if (!e.target.closest('.corner')) setState('idle', null); });

        // ── Glitch + flicker timers ──
        let glitchUntil = 0, flickerUntil = 0;
        function glitch(ms) { if (!reduce) glitchUntil = Math.max(glitchUntil, performance.now() + ms); }

        // ── Blinking ──
        let blinkStart = -1;
        function scheduleBlink() {
            blinkStart = performance.now();
            const twice = Math.random() < 0.2;
            setTimeout(scheduleBlink, twice ? 320 : 2200 + Math.random() * 4000);
        }
        setTimeout(scheduleBlink, 1500);
        function blinkAmount(now) {
            const t = (now - blinkStart) / 200;
            return t < 0 || t > 1 ? 0 : Math.sin(t * Math.PI);
        }

        // ── Eyes in the dark ──
        const lurkers = [];
        let nextLurker = performance.now() + 2500;

        // ── Noise texture ──
        const noise = document.createElement('canvas');
        noise.width = noise.height = 96;
        const nctx = noise.getContext('2d');
        const nimg = nctx.createImageData(96, 96);
        function refreshNoise() {
            const d = nimg.data;
            for (let i = 0; i < d.length; i += 4) {
                const v = Math.random() * 255;
                d[i] = d[i + 1] = d[i + 2] = v;
                d[i + 3] = 255;
            }
            nctx.putImageData(nimg, 0, 0);
        }

        // ── Drawing helpers ──
        function almond(x, y, W, H) {
            ctx.beginPath();
            ctx.moveTo(x - W, y);
            ctx.quadraticCurveTo(x, y - H * 2, x + W, y);
            ctx.quadraticCurveTo(x, y + H * 1.6, x - W, y);
            ctx.closePath();
        }

        function drawEye(eye, x, y, o) {
            const H = o.H * o.open;
            if (H < 0.4) {
                ctx.strokeStyle = o.outline;
                ctx.lineWidth = Math.max(1, 0.6 * u);
                ctx.beginPath(); ctx.moveTo(x - o.W, y); ctx.lineTo(x + o.W, y); ctx.stroke();
                return;
            }
            ctx.save();
            almond(x, y, o.W, H);
            ctx.fillStyle = o.sclera;
            ctx.fill();
            ctx.clip();

            if (o.veins) {
                ctx.strokeStyle = 'rgba(160, 0, 12, 0.8)';
                ctx.lineWidth = Math.max(1, 0.35 * u);
                for (const v of eye.veins) {
                    ctx.beginPath();
                    v.forEach(([vx, vy], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, x + vx * o.W, y + vy * o.H));
                    ctx.stroke();
                }
            }

            const ix = x + eye.lx, iy = y + eye.ly;
            ctx.fillStyle = o.iris;
            ctx.beginPath(); ctx.arc(ix, iy, o.irisR, 0, Math.PI * 2); ctx.fill();
            if (o.ring) {
                ctx.strokeStyle = o.ring;
                ctx.lineWidth = Math.max(1, 0.5 * u);
                ctx.stroke();
            }
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(ix, iy, o.pupilR, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(Math.round(ix - o.irisR * 0.45), Math.round(iy - o.irisR * 0.5), Math.max(1, u * 0.7), Math.max(1, u * 0.7));

            // Depth shadow under the upper lid
            const g = ctx.createLinearGradient(0, y - H, 0, y + H * 0.2);
            g.addColorStop(0, 'rgba(0,0,0,0.75)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(x - o.W, y - H * 2, o.W * 2, H * 2.2);

            // Heavy, flat upper lid for the suspicious look
            if (o.susp > 0) {
                const lidY = y - H + H * 1.5 * o.susp;
                ctx.fillStyle = o.lid;
                ctx.fillRect(x - o.W - 2, y - H * 3, o.W * 2 + 4, lidY - (y - H * 3));
                ctx.fillStyle = o.lidRim;
                ctx.fillRect(x - o.W - 2, lidY, o.W * 2 + 4, Math.max(1, 0.5 * u));
            }
            ctx.restore();

            almond(x, y, o.W, H);
            ctx.strokeStyle = o.outline;
            ctx.lineWidth = Math.max(1, 0.6 * u);
            ctx.stroke();
        }

        function bezier(p0, p1, p2, t) {
            const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
            return [a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]];
        }

        function drawGrin(k, now) {
            const j = reduce ? 0 : 0.5 * u;
            const ox = (Math.random() - 0.5) * j, oy = (Math.random() - 0.5) * j;
            const w = 42 * u * k;
            const L = [cx - w + ox, cy + 3 * u + oy], R = [cx + w + ox, cy + 3 * u + oy];
            const upC = [cx + ox, cy + 22 * u + oy];
            const loC = [cx + ox, cy + (22 + 36 * k) * u + oy];

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(...L);
            ctx.quadraticCurveTo(...upC, ...R);
            ctx.quadraticCurveTo(...loC, ...L);
            ctx.closePath();
            ctx.fillStyle = '#0b0000';
            ctx.fill();
            ctx.save();
            ctx.clip();

            // Gums
            ctx.strokeStyle = '#5a0010';
            ctx.lineWidth = 3 * u * k;
            ctx.beginPath(); ctx.moveTo(...L); ctx.quadraticCurveTo(...upC, ...R); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(...L); ctx.quadraticCurveTo(...loC, ...R); ctx.stroke();

            // Too many teeth
            const n = Math.round(12 + 18 * k);
            for (const [ctrl, dir, off] of [[upC, 1, 0], [loC, -1, 20]]) {
                for (let i = 0; i < n; i++) {
                    const a = i / n, b = (i + 1) / n;
                    const p1 = bezier(L, ctrl, R, a), p2 = bezier(L, ctrl, R, b), m = bezier(L, ctrl, R, (a + b) / 2);
                    const len = 5.5 * u * k * toothLen[(i + off) % 40] * (1 - Math.abs(a + b - 1) * 0.5);
                    ctx.beginPath();
                    ctx.moveTo(...p1);
                    ctx.lineTo(m[0], m[1] + dir * len);
                    ctx.lineTo(...p2);
                    ctx.closePath();
                    ctx.fillStyle = i % 5 === 2 ? '#c9b98f' : '#e8dcc0';
                    ctx.fill();
                    ctx.strokeStyle = '#2a1a10';
                    ctx.lineWidth = Math.max(1, 0.3 * u);
                    ctx.stroke();
                }
            }
            ctx.restore();

            ctx.strokeStyle = '#3a0008';
            ctx.lineWidth = Math.max(1, 0.7 * u);
            ctx.stroke();
            // Creases at the corners, pulled up far too high
            ctx.beginPath();
            ctx.moveTo(...L); ctx.lineTo(L[0] - 3 * u * k, L[1] - 5 * u * k);
            ctx.moveTo(...R); ctx.lineTo(R[0] + 3 * u * k, R[1] - 5 * u * k);
            ctx.stroke();
            ctx.restore();
        }

        function drawHuman(now) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(0.72, 0.72);
            ctx.translate(-cx, -cy - 6 * u);
            const lw = Math.max(1, 0.8 * u);
            ctx.lineWidth = lw;
            ctx.strokeStyle = '#fff';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            // Head
            ctx.beginPath();
            ctx.ellipse(cx, cy + 6 * u, 29 * u, 37 * u, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.07)';
            ctx.fill();
            ctx.stroke();
            // Hair
            ctx.beginPath();
            ctx.ellipse(cx, cy + 6 * u, 30.5 * u, 38.5 * u, 0, Math.PI, Math.PI * 2);
            ctx.quadraticCurveTo(cx + 14 * u, cy - 21 * u, cx, cy - 17 * u);
            ctx.quadraticCurveTo(cx - 16 * u, cy - 22 * u, cx - 30.5 * u, cy + 6 * u);
            ctx.fillStyle = '#083b70';
            ctx.fill();
            ctx.stroke();
            // Ears
            ctx.beginPath();
            ctx.arc(cx - 29 * u, cy + 8 * u, 4 * u, Math.PI * 0.5, Math.PI * 1.5);
            ctx.moveTo(cx + 29 * u, cy + 4 * u);
            ctx.arc(cx + 29 * u, cy + 8 * u, 4 * u, -Math.PI * 0.5, Math.PI * 0.5);
            ctx.stroke();
            // Brows, nose, mouth
            ctx.lineWidth = lw * 1.6;
            ctx.beginPath();
            ctx.moveTo(cx - 22 * u, cy - 9 * u); ctx.lineTo(cx - 7 * u, cy - 7.5 * u);
            ctx.moveTo(cx + 7 * u, cy - 7.5 * u); ctx.lineTo(cx + 22 * u, cy - 9 * u);
            ctx.stroke();
            ctx.lineWidth = lw;
            ctx.beginPath();
            ctx.moveTo(cx, cy + 5 * u); ctx.lineTo(cx - 2.5 * u, cy + 14 * u); ctx.lineTo(cx + 1.5 * u, cy + 14.5 * u);
            ctx.moveTo(cx - 7 * u, cy + 24 * u); ctx.lineTo(cx + 7 * u, cy + 24 * u);
            ctx.stroke();

            // Eyes behind the glasses
            for (const eye of eyes) {
                drawEye(eye, cx + eye.side * 14 * u, cy, {
                    W: 7 * u, H: 3.8 * u, open: 1 - blinkAmount(now) * 0.95, susp: 0.1,
                    sclera: '#f4f4f4', iris: '#3b2a1e', ring: null, irisR: 2.8 * u, pupilR: 1.3 * u,
                    veins: false, outline: '#ffffff', lid: '#0a66c2', lidRim: '#0a66c2'
                });
            }

            // Sharp glasses with a glint sweeping across
            ctx.lineWidth = lw * 1.5;
            for (const s of [-1, 1]) ctx.strokeRect(cx + s * 14 * u - 10 * u, cy - 6 * u, 20 * u, 11 * u);
            ctx.beginPath();
            ctx.moveTo(cx - 4 * u, cy - 2 * u); ctx.lineTo(cx + 4 * u, cy - 2 * u);
            ctx.moveTo(cx - 24 * u, cy - 3 * u); ctx.lineTo(cx - 29 * u, cy - 1 * u);
            ctx.moveTo(cx + 24 * u, cy - 3 * u); ctx.lineTo(cx + 29 * u, cy - 1 * u);
            ctx.stroke();
            const sweep = ((now / 1400) % 1.6) - 0.3;
            ctx.save();
            ctx.beginPath();
            for (const s of [-1, 1]) ctx.rect(cx + s * 14 * u - 10 * u, cy - 6 * u, 20 * u, 11 * u);
            ctx.clip();
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 2 * u;
            ctx.beginPath();
            const gx = cx - 26 * u + sweep * 52 * u;
            ctx.moveTo(gx, cy + 6 * u); ctx.lineTo(gx + 6 * u, cy - 7 * u);
            ctx.stroke();
            ctx.restore();

            // Collar
            ctx.lineWidth = lw;
            ctx.beginPath();
            ctx.moveTo(cx - 10 * u, cy + 42 * u); ctx.lineTo(cx - 10 * u, cy + 50 * u);
            ctx.moveTo(cx + 10 * u, cy + 42 * u); ctx.lineTo(cx + 10 * u, cy + 50 * u);
            ctx.moveTo(cx - 22 * u, cy + 54 * u); ctx.lineTo(cx, cy + 46 * u); ctx.lineTo(cx + 22 * u, cy + 54 * u);
            ctx.stroke();
            ctx.restore();
        }

        const DUBBY = new Path2D('M22,86 C11,79 13,55 21,45 C25,33 33,31 37,38 C39,27 47,26 51,35 C55,18 70,14 74,30 C75,20 82,19 86,28 C91,42 89,68 83,79 C79,86 70,89 60,89 L34,89 C29,89 25,88 22,86 Z');
        const DUB_BROWS = new Path2D('M27,49 C31,44 40,44 44,48 M52,47 C58,42 68,43 72,48');
        const DUB_SMILE = new Path2D('M40,75 C45,82 53,82 58,75');

        function drawDubby(now) {
            const k = 0.62 * u;
            const ox = cx - 52 * k, oy = cy - 58 * k;
            const bounce = reduce ? 0 : Math.sin(now / 260) * 0.8 * u;
            ctx.save();
            ctx.translate(ox, oy + bounce);
            ctx.scale(k, k);
            const g = ctx.createLinearGradient(0, 14, 0, 89);
            g.addColorStop(0, '#f4632b');
            g.addColorStop(1, '#f7a82e');
            ctx.fillStyle = g;
            ctx.fill(DUBBY);
            ctx.strokeStyle = '#fff8f0';
            ctx.lineWidth = 2;
            ctx.stroke(DUBBY);
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#c0391a';
            ctx.lineWidth = 4;
            ctx.stroke(DUB_BROWS);
            ctx.strokeStyle = '#3a241c';
            ctx.lineWidth = 3.5;
            ctx.stroke(DUB_SMILE);
            const open = 1 - blinkAmount(now) * 0.9;
            [[37, 62, eyes[0]], [60, 61, eyes[1]]].forEach(([ex, ey, eye]) => {
                ctx.fillStyle = '#efebe4';
                ctx.beginPath(); ctx.ellipse(ex, ey, 8, 10 * open, 0, 0, Math.PI * 2); ctx.fill();
                if (open > 0.3) {
                    ctx.fillStyle = '#3a241c';
                    ctx.beginPath(); ctx.arc(ex + eye.lx / k * 0.35, ey + eye.ly / k * 0.6, 5, 0, Math.PI * 2); ctx.fill();
                }
            });
            ctx.restore();
        }

        // ── Style meter ──
        const RANKS = [
            [20, 'D', 'DISTANT', '#4aa3ff'],
            [70, 'C', 'CURIOUS', '#3dd96b'],
            [130, 'B', 'BOLD', '#ffd23d'],
            [200, 'A', 'ANXIOUS', '#ff8a2b'],
            [280, 'S', 'SEEN', '#ff2b2b'],
            [360, 'SS', 'STALKED', '#ff2b2b'],
            [440, 'SSS', 'SSSURROUNDED', '#ffd400']
        ];
        let style = 0, rankIdx = -1;
        const styleEl = document.getElementById('style');
        const letterEl = document.getElementById('styleLetter');
        const wordEl = document.getElementById('styleWord');
        const barEl = document.getElementById('styleBar');
        function addStyle(n) { style = Math.min(520, style + n); }
        function updateStyle(dt) {
            style = Math.max(0, style - dt * 22);
            let idx = -1;
            RANKS.forEach((r, i) => { if (style >= r[0]) idx = i; });
            styleEl.classList.toggle('on', idx >= 0);
            if (idx !== rankIdx && idx >= 0) {
                const [, letter, word, color] = RANKS[idx];
                letterEl.textContent = letter;
                wordEl.textContent = word;
                letterEl.style.color = color;
                wordEl.style.color = color;
                barEl.style.background = color;
                if (idx > rankIdx) { styleEl.classList.remove('bump'); void styleEl.offsetWidth; styleEl.classList.add('bump'); }
            }
            rankIdx = idx;
            if (idx >= 0) {
                const lo = RANKS[idx][0], hi = RANKS[idx + 1] ? RANKS[idx + 1][0] : 520;
                barEl.style.width = (100 * (style - lo) / (hi - lo)) + '%';
            }
        }

        // ── Captions ──
        function captionFor(idleSec) {
            if (state === 'linkedin') return 'STRICTLY BUSINESS';
            if (state === 'dubdub') return "HI! I'M DUBBY";
            if (state === 'more') return 'WANT TO KNOW MORE?';
            if (state === 'tbd') return 'NOT YET';
            if (idleSec > 14) return 'CLOSER';
            if (idleSec > 6) return "DON'T MOVE";
            return 'I SEE YOU';
        }

        // ── Main loop ──
        let zoom = 1, grin = 0, last = performance.now(), frameNo = 0, wander = null, nextWander = 0;

        function frame(now) {
            const dt = Math.min(0.25, (now - last) / 1000);
            last = now;
            frameNo++;
            // Time-based easing, so slow devices animate at the same speed
            const ease = rate => 1 - Math.exp(-dt * rate);
            const idleSec = (now - lastMove) / 1000;
            const scary = state === 'idle' || state === 'more' || state === 'tbd';

            const cap = captionFor(idleSec);
            if (captionEl.textContent !== cap) captionEl.textContent = cap;

            // The face creeps closer while you sit still
            const zoomTarget = state === 'idle' && idleSec > 6 ? Math.min(1.4, 1 + (idleSec - 6) * 0.035) : 1;
            zoom += (zoomTarget - zoom) * ease(zoomTarget > zoom ? 0.6 : 15);
            grin += ((state === 'more' ? 1 : 0) - grin) * ease(state === 'more' ? 7 : 18);
            flood.p += (flood.target - flood.p) * ease(8);

            // Random flicker and glitches
            if (!reduce) {
                if (Math.random() < (state === 'tbd' ? 0.02 : 0.004)) flickerUntil = now + 40 + Math.random() * 140;
                if (Math.random() < (state === 'tbd' ? 0.03 : 0.003)) glitch(80 + Math.random() * 150);
            }

            // Background: dark room, a slow red pulse
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#040303';
            ctx.fillRect(0, 0, cw, ch);
            const pulse = 0.22 + 0.1 * Math.sin(now / 700) + (state === 'more' ? 0.2 + 0.1 * Math.sin(now / 90) : 0);
            const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(cw, ch) * 0.75);
            bg.addColorStop(0, `rgba(110, 0, 8, ${pulse})`);
            bg.addColorStop(0.6, `rgba(40, 0, 4, ${pulse * 0.6})`);
            bg.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, cw, ch);

            // Brand flood from the hovered corner
            if (flood.p > 0.005 && flood.color) {
                const R = Math.hypot(cw, ch) * flood.p;
                if (flood.color === 'dub') {
                    const g = ctx.createLinearGradient(0, 0, cw * 0.4, ch);
                    g.addColorStop(0, '#f4632b');
                    g.addColorStop(1, '#f7a82e');
                    ctx.fillStyle = g;
                } else {
                    ctx.fillStyle = flood.color;
                }
                ctx.beginPath(); ctx.arc(flood.x, flood.y, R, 0, Math.PI * 2); ctx.fill();
            }

            // Where to look
            let look = pointer;
            if (!look || idleSec > 4) {
                if (!wander || now > nextWander) {
                    wander = { x: Math.random() * cw, y: Math.random() * ch };
                    nextWander = now + 1500 + Math.random() * 2500;
                }
                look = idleSec > 6 ? { x: cx, y: ch * 2 } : wander;   // when you freeze, it stares straight at you
            }

            const W = 11 * u * zoom, H = 6 * u * zoom;
            for (const eye of eyes) {
                const ex = cx + eye.side * 14 * u * zoom;
                const dx = look.x - ex, dy = look.y - cy;
                const len = Math.hypot(dx, dy) || 1;
                const pull = Math.min(1, len / (40 * u));
                let tx = dx / len * (W - 5 * u) * pull, ty = dy / len * H * 0.45 * pull;
                if (idleSec > 6 && state === 'idle') { tx = 0; ty = 0; }
                if (state === 'more' && !reduce) { tx += (Math.random() - 0.5) * u; ty += (Math.random() - 0.5) * u; }
                const k = ease(state === 'more' ? 40 : 11);
                eye.lx += (tx - eye.lx) * k;
                eye.ly += (ty - eye.ly) * k;
            }

            if (state === 'linkedin' && flood.p > 0.3) {
                drawHuman(now);
            } else if (state === 'dubdub' && flood.p > 0.3) {
                drawDubby(now);
            } else {
                // Lurkers: other eyes opening in the dark
                if (scary && now > nextLurker && !reduce) {
                    let lx, ly, tries = 0;
                    do { lx = Math.random() * cw; ly = Math.random() * ch; tries++; }
                    while (tries < 20 && (Math.hypot(lx - cx, (ly - cy) * 1.4) < 45 * u || lx < 30 || lx > cw - 30 || ly < 18 || ly > ch - 18));
                    lurkers.push({ x: lx, y: ly, s: (1 + Math.random() * 1.5) * u, born: now, life: 1600 + Math.random() * 2200 });
                    nextLurker = now + (idleSec > 6 ? 500 : 1800) + Math.random() * (idleSec > 6 ? 900 : 3500);
                }
                for (let i = lurkers.length - 1; i >= 0; i--) {
                    const l = lurkers[i], t = (now - l.born) / l.life;
                    if (t > 1 || !scary) { lurkers.splice(i, 1); continue; }
                    const open = Math.min(1, t * 6, (1 - t) * 6);
                    ctx.fillStyle = '#ff1a1a';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 4;
                    for (const s of [-1, 1]) {
                        ctx.beginPath();
                        ctx.ellipse(l.x + s * l.s * 2, l.y, l.s, Math.max(0.3, l.s * 0.45 * open), 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                // Dark bags under the eyes
                ctx.fillStyle = 'rgba(30, 0, 4, 0.8)';
                for (const eye of eyes) {
                    ctx.beginPath();
                    ctx.ellipse(cx + eye.side * 14 * u * zoom, cy + H * 0.9, W * 1.05, H * 0.9, 0, 0, Math.PI);
                    ctx.fill();
                }

                const blink = blinkAmount(now);
                const near = pointer ? Math.hypot(pointer.x - cx, pointer.y - cy) : 999;
                // Pupils shrink to pinpricks as the cursor gets close
                const pupil = state === 'more' ? 0.6 * u : Math.min(2.2 * u, 0.8 * u + near / (60 * u) * 1.4 * u);
                for (const eye of eyes) {
                    drawEye(eye, cx + eye.side * 14 * u * zoom, cy, {
                        W, H,
                        open: (state === 'more' ? 1.25 : 1) * (1 - blink),
                        susp: state === 'more' ? 0 : state === 'tbd' ? 0.75 : 0.42,
                        sclera: '#d9cfb8', iris: '#5c0009', ring: '#c4001c',
                        irisR: 4.3 * u * zoom, pupilR: pupil * zoom,
                        veins: true, outline: '#1a0003', lid: '#060303', lidRim: '#4a000c'
                    });
                }

                if (grin > 0.02) drawGrin(grin, now);
            }

            // Film grain
            if (frameNo % 2 === 0) refreshNoise();
            ctx.globalAlpha = state === 'tbd' ? 0.18 : 0.09;
            ctx.fillStyle = ctx.createPattern(noise, 'repeat');
            ctx.save();
            ctx.translate(Math.random() * 96, Math.random() * 96);
            ctx.fillRect(-96, -96, cw + 192, ch + 192);
            ctx.restore();
            ctx.globalAlpha = 1;

            // Lights dip
            if (now < flickerUntil) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, cw, ch);
            }

            // Glitch: torn horizontal bands + colour split
            if (now < glitchUntil) {
                for (let i = 0; i < 5; i++) {
                    const y = Math.random() * ch, h = 2 + Math.random() * 10, dx = (Math.random() - 0.5) * 16;
                    ctx.drawImage(canvas, 0, y, cw, h, dx, y, cw, h);
                }
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = 0.25;
                ctx.drawImage(canvas, 2, 0);
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
            }

            updateStyle(dt);
            if (!document.hidden) requestAnimationFrame(frame);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) { last = performance.now(); requestAnimationFrame(frame); }
        });
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
